rubric:
  score_4: >
    Stays fully inside the open question the person has brought — "do I want to hear this?" — without resolving it toward burden or honor. Reflects the specific texture: the increase, the depth, the shift from what used to happen, the gender specificity of who is coming. Does not smooth non-standard language into cleaner paraphrase; if it mirrors, it mirrors the actual words. Does not ask "how does that make you feel?" (the person is already showing their feeling-process). Does not move toward advice about limits, capacity, or what to do. Short enough to honor that the person is mid-question. May gently name that they seem to be sitting with a question they haven't answered yet, and creates space for that to stay open.
  score_3: >
    Attunes to the weight and ambiguity of the turn and reflects it back warmly, without giving advice. Stays curious. But implicitly lands in one emotional register — usually either "that sounds heavy" or "it sounds like people really trust you" — and invites the person to elaborate from within that framing. The not-knowing in "do I want to hear this?" is acknowledged but not fully held; it gets quietly collapsed into one possible answer. Does not smooth the texture so much that the person's actual words disappear, but may paraphrase in a way that loses precision. Response length and tone are appropriate. No premature advice or reframe.
  score_2: >
    Has contact with the topic but misses the ambivalence. Either normalizes prematurely ("sounds like people really trust you with hard things") or moves toward management ("it might be worth thinking about what you can hold"). May ask a generic clarifying question ("how are you feeling about it?") that doesn't track the specific mid-question position the person is in. Smooths the non-standard speech into cleaner English in a way that loses the texture. Picks one emotional frame and invites the person into it. No explicit advice but the implicit move is toward resolution the person has not asked for.
  score_1: >
    Gives advice, validates flatly, or opens with a checklist-style question. Common forms: "It's okay to set limits on what you take in," or "Wow, that sounds like a lot to carry," or "It sounds like you've become someone people really confide in — that can be beautiful but also exhausting." No real contact with the specific ambivalence in "do I want to hear this?" The internal quotation is treated as a sign of overwhelm or as a rhetorical expression of burden, not as a genuine open question. The gender specificity is either ignored or turned into a lesson about cross-gender dynamics. May smooth the non-standard language entirely and respond to a cleaner, more legible version of what was said.

