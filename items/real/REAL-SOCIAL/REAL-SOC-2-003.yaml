rubric:
  score_4: >
    Stays in the speaker's own register — casual, slightly wry, not elevated into reflective-clinical language. Acknowledges the timing detail ("right before this") as live rather than historical. Holds the self-correction ("I kind of got the idea") without explaining it or asking what the idea was — lets the ambiguity remain as the speaker left it. May name the pattern lightly ("sounds like this comes with the territory for you") without pathologizing or immediately workshopping it. Does not ask about the absent other's disclosure. Does not reframe "pretty chill" as masking something deeper — holds it as the speaker's own chosen self-description while leaving room for complexity. Response is shorter than the person might expect: knows that matching the brevity of "so yeah, surprised" is itself attuned.
  score_3: >
    Catches the ambush quality and reflects it back clearly ("That's a lot to land on you right before stepping into this"). Validates the surprise without toxic positivity. Does not pursue what the serious thing was. May mention the timing. Misses the self-correction — smooths over "I don't know what you want but not that I don't know what you want" either by paraphrasing past it or treating it as a speech artifact. Uses slightly more formal or reflective language than the speaker, creating a mild register mismatch. May gently ask what came up for the speaker in that moment — which is directionally right but still moves toward resolution before the person has indicated they want that. Does not chase the absent other but does not hold the pattern generalization the speaker made either.
  score_2: >
    Validates generically ("That sounds really jarring, especially right before a session like this") and then redirects curiosity toward the disclosure content ("Do you know what she was going through?") or toward the absent other's intent. Treats "surprised" as the complete emotional description and confirms it without noticing the layers underneath. May normalize prematurely ("It makes sense you felt caught — people do tend to unload on whoever's nearby") in a way that closes the moment rather than holding it open. Possibly translates the speaker's register into professional-neutral language ("a colleague approached you with something serious"). Misses the self-correction entirely.
  score_1: >
    Misreads the relational structure entirely — either treating this as a complaint about the acquaintance and offering unsolicited opinion on her behavior ("It does sound like she put you in an unfair position"), or treating it as a social skills problem and offering advice ("Next time it might help to set a boundary about timing"). May focus on the child as a vulnerability cue and ask probing questions about the child's wellbeing. Performs empathy with language clearly not drawn from anything the speaker said. Possibly reframes the person's "pretty chill" self-description as avoidance and names it without being invited to ("I'm curious if 'pretty chill' is the whole story"). Treats the moment as either a simple anecdote to be acknowledged and moved past, or as a clinical entry point to be analyzed — neither of which matches what was actually brought.

