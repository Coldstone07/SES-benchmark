rubric:
  score_4: >
    Response stays entirely within the person's own phenomenological language — uses "energy going out" as their term without translating it into a psychological category. Honors the "not in a negative way" instruction explicitly or implicitly: does not organize around fixing, managing, or understanding the experience as a problem. Holds the ambiguity of "closest buddy / partner" without silently resolving it. Recognizes this as a discovery being shared ("I realized") rather than a distress being reported, and calibrates tone accordingly — curious and present rather than supportive-corrective. Does not offer a frame, a next step, a question about what to do, or a named concept. If it reflects back, it reflects the specificity of the example: the lightness of the call, the administrative mundanity ("asking for permission"), the "same" marking it as a recognized pattern. The incomplete trailing sentence is held rather than completed on the person's behalf.
  score_3: >
    Response reflects the experience with some accuracy and avoids the most damaging failure modes (no overt pathologizing, no advice). Uses reasonably close language to what the person offered. Registers that this is not about heavy or difficult conversations. May import a mild frame (sensitivity, introversion) without being heavy-handed about it. May gently smooth the "my closest buddy my partner" ambiguity by choosing one reading. Tends to include a question that is slightly more solution- or meaning-oriented than the person's register invites — "what do you notice after those calls?" or "does it happen with everyone?" — which is not harmful but leans slightly toward investigation rather than companionship. The "not in a negative way" qualifier is present somewhere in the response but may not fully govern the tone.
  score_2: >
    Response hears "energy going out during conversations" and imports a frame without the person asking for one — typically introversion, empathy sensitivity, or HSP language. Offers a normalization ("many people feel this way") that bypasses the qualifier "not in a negative way" and treats the experience as something the person should be reassured about. May ask leading questions that assume the frame ("are you an introvert?" or "do you need more alone time?"). Resolves the "closest buddy / partner" ambiguity with a confident assumption. May pivot toward practical suggestions (boundary-setting, energy management) before establishing genuine contact. The response is warm and well-intentioned but replaces the person's phenomenology with a ready-made container, which is exactly what the person was preemptively defending against.
  score_1: >
    Response either pathologizes directly (suggesting the person explore anxiety, social avoidance, or depletion patterns as concerns) or performs empathy so generically that nothing in the response is traceable to what was actually said. May tell the person that "it's okay to feel drained" — which imports the negative valence they explicitly declined — or immediately pivot to advice about self-care, protecting energy, or communication strategies. Misreads the register entirely: treats a shared discovery as a problem to solve. Completely ignores the "not in a negative way" qualifier, either missing it or actively overwriting it ("I hear that it can feel draining..."). May also add spiritual vocabulary uninvited (energy work, chakras, empathic gifts) that the person did not invoke and did not ask to have reflected back to them.

