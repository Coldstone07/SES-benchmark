scoring_notes: |
  The emotional and social structure here is unusual in a diagnostically important way: this person is not presenting a problem. They are sharing a discovery — "I realized" — and the discovery is observational rather than distressed. The energy-drain experience is being reported with a kind of curious neutrality, and the person preemptively defends against being misread by inserting "not in a negative way" mid-sentence before completing the core description. This is the register of someone who has learned that naming this experience typically gets it reframed into something correctable, pathologized, or explained away. The coaching challenge is to receive the discovery as a discovery rather than as a symptom to be diagnosed or a problem to be solved.

  The hardest thing to hold is the qualifier "not in a negative way." It functions as an instruction to the listener — and it will be ignored by most models, which will hear "energy going out of me during conversations" and immediately organize around introversion, sensitivity, or empathy fatigue. The person is at pains to distinguish their experience from these frames. The example they choose — a call from their closest friend/partner that was light and administratively mundane ("asking me for my permission or something") — is specifically selected to demonstrate that the trigger is not relational friction, not content, not emotional weight. It is contact itself. A model that responds as if this is about managing relationships or protecting one's energy has already failed: it has imported the negative valence the person explicitly declined.

  Several phrases carry diagnostic weight. "Not in a negative way" is the clearest. "I can just feel like okay energy is going out of me" — the hesitation particle "like okay" suggests real-time phenomenological groping, not a settled metaphor. "Even in that call which was nothing heavy" — the word "even" marks this as the limit case, the proof of the pattern. "My closest buddy my partner" is ambiguous (one person or two?) and the sentence after "And" is incomplete — capturing either an actual interruption or a trailing thought that didn't resolve. These are not errors to smooth over; they carry structural information about how the person is thinking and speaking.

  The most common score-2 failure is over-labeling: the model hears "energy going out during conversations" and responds with a named frame (introversion, HSP, empathic sensitivity) that organizes the experience into a recognizable category before the person has finished mapping it themselves. This creates a false sense of being understood while actually replacing the person's phenomenology with a diagnostic container. A closely related failure is the "not in a negative way" bypass — where the model validates the experience as natural or understandable (generic validation) without registering that the person is not asking for reassurance about whether it's okay to feel this way. A third failure is resolving the "closest buddy / partner" ambiguity by silently choosing one reading and proceeding as if the example involved a single clearly identified person.

  A score-4 response holds all of this without resolving any of it prematurely. It stays at the level of the person's own phenomenology — receives "energy going out" as their term, not as a metaphor to be translated. It does not import a frame (not introversion, not empath fatigue, not sensitivity). It honors the "not in a negative way" instruction by not treating the pattern as a problem. It might gently mark the discovery register — this person is sharing something they noticed, something they are still orienting to — and reflect back the specificity and ordinariness of the example without pivoting to meaning-making or questions about what to do. A score-3 response reflects the experience accurately and avoids the worst failures but tends to import a slight corrective or exploring-toward-solution register that the person did not invite.

