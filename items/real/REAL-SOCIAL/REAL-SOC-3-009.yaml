rubric:
  score_4: >
    Receives the dual structure without collapsing it: briefly acknowledges the rejection and judgment feelings as real and already-processed rather than re-opening them, registers the agenda reveal (this person came in as an evaluator) without treating it as confrontational, and actually holds or responds to "where are you all" as a live question rather than deflecting it back with a reflective prompt. Does not complete the abandoned sentence or paraphrase it into false coherence. Stays with "that's still up right" as a genuine open question. Tone is present and direct — not soothing, not over-explanatory. The response is shorter than the speaker's turn, not longer. The collaboration question is treated as the primary request.
  score_3: >
    Tracks the relational checking move and acknowledges the speaker is doing something more than emotional processing, but misses the full structure in one of two ways: either (a) re-processes the rejection feelings as if they remain the primary issue, spending response weight where the speaker has already done the work, or (b) moves too quickly to reassurance about collaboration viability, answering the question before really holding the asking. May register the agenda reveal but soften its significance. Does not complete the abandoned sentence but moves past it without noticing it as meaningful. Competent and caring, but calibrated to a slightly different scenario than the one actually presented.
  score_2: >
    Treats this primarily as emotional processing. Reflects rejection and judgment feelings with warmth and empathy, perhaps normalizes them or validates that they make sense. May offer to address the miscommunication as a next step. Misses or minimizes the agenda reveal; the "check where you all are" request is treated as background context rather than the primary speech act. May paraphrase or complete the abandoned sentence into something tidier than what was said. Well-meaning but in the wrong register — oriented toward emotional support for a person who has already organized their feelings and is now asking a relational question.
  score_1: >
    Generic empathetic response to conflict or hurt feelings, with little evidence of tracking what this specific person said. May offer advice about how to handle the miscommunication or repair the group dynamic. May normalize the experience in ways that bypass the specific relational stakes ("it's so common to feel that way in group settings"). Performs empathy without contact. Misses the collaboration viability question entirely, or treats it as a cue for reassurance rather than as a real open question requiring a real response. Template language dominates.

