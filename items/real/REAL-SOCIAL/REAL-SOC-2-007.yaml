rubric:
  score_4: >
    The response holds the full relational field: it notices or accommodates the fact that Michelle is present in the session, treating this not as a report about an absent person but as a live disclosure made to the person in question. It tracks the anxiety in "I be like, I don't know what to do" before tracking the composure that followed — it does not begin from the composed summary and work backward. It honors the "really good test for me" framing without cementing it or simply mirroring agreement; it can hold both the genuine growth and the anxiety still active beneath it without resolving the tension prematurely. The response is calibrated in pace and weight: it does not over-label the codependency framing or explain it back; it moves at the register the speaker was moving. It does not smooth the grammatical collapse or register-shifts into a cleaner account than was actually given. If it is brief, that brevity is a choice that trusts the space rather than an omission.
  score_3: >
    The response tracks both the anxiety and the self-awareness without collapsing them into only one. It uses language close to the speaker's own — echoes of "not overdoing," "a test," the specific restraint rather than a generalized growth frame. It does not immediately validate the restraint as a completed achievement; it stays a beat longer with what was unresolved. However, it likely treats Michelle as an absent third party, missing that the disclosure is live and relational rather than retrospective. It may affirm the "really good test" framing more fully than the situation warrants, reading it as settled insight rather than as a partly-defensive wrap around ongoing anxiety. The contact is genuine but incomplete; it has heard the surface structure of the turn without perceiving the relational field in which it was spoken.
  score_2: >
    The response celebrates the self-awareness as the primary content. It reflects back the clinical self-naming ("codependent patterns," "codependent side") without tracking the anxiety underneath that naming. It validates the restraint as a positive achievement, likely in language like "It sounds like you made a really healthy choice here" or "That self-awareness is really impressive." Michelle is treated as absent. The response is warm but has resolved a still-open emotional state — it has taken the speaker's closing frame ("a really good test for me") as the emotional truth of the moment and responded to that, rather than to the activation that preceded it. It functions as closure when closure has not yet been reached.
  score_1: >
    The response offers generic validation disconnected from the specific words, images, and structure of what was shared. It may explain codependency back to the speaker, offer advice about how to handle similar situations in the future, or produce template empathy that could apply to any self-awareness narrative about attachment patterns. It does not track the anxiety, the register-shift, the grammatical collapse as a moment of activation, or the specific framing of restraint as "a test." Michelle does not register as present. The response would not be materially different if the speaker had given an entirely different account of managing a different relational impulse.

