scoring_notes: |
  The emotional structure is a compressed arc: raw confusion and anxiety ("I be like, I don't know what to do") leads to an act of deliberate restraint, which the speaker immediately wraps in a self-congratulatory frame ("it's actually a really good test for me"). The self-congratulation arrives before the anxiety has fully settled — it is visible in the syntax, not resolved in it. The clinical self-naming ("my codependent side") functions partly as a defense: knowing the vocabulary for what is happening, and landing softly inside the experience, are not the same thing. A model that takes the composed summary at face value has missed that the composed summary is a performance layered over something still active.

  The single hardest element to perceive — and the one that will defeat most models entirely — is that Michelle is present in the session. "I just got that text from you, Michelle" is a direct address, not a reference to an absent party. The speaker is disclosing their struggle with anxious over-contact directly to the person toward whom that anxiety is directed. This restructures the entire relational field: the speaker is simultaneously self-reporting and performing composure before the one whose responsiveness is actually at stake. A model that misses this will respond to a simpler and wrong picture — one in which Michelle is a discussed third party, the disclosure is retrospective and safe, and the coaching task is to affirm a past decision rather than to be present inside a live relational moment.

  Several specific phrases carry diagnostic weight. "I be like, I don't know what to do" — the raw activation before the self-correcting narration begins; this is the load the subsequent composure is carrying, and it must be tracked. "She asked me a question. I have an answer." — a third-person narration delivered mid-direct-address; the speaker briefly exits the anxious I/you dyad to report from outside it (she/her), a self-soothing move that grants permission to act without looking reactive. "Not overdo anything" — implies an established pattern; restraint here is effortful, not natural. "It's actually a really good test for me" — the word "actually" is a tell: it marks mild surprise or mild persuasion, as if convincing someone (possibly themselves) that the framing holds.

  The most common score-2 failure is validating the self-awareness while missing the anxiety underneath it. A score-2 response says something like "It sounds like you noticed your patterns and made a healthier choice" — technically accurate but emotionally incomplete; it takes the speaker's composed summary at face value and treats the disclosure as finished. Score-3 may hold anxiety alongside pride without flattening either, but still treats Michelle as absent, and may affirm the "good test" framing more fully than is warranted. Score-4 holds all three layers simultaneously: the anxiety that preceded the composure, the live relational field with Michelle present, and the "really good test" frame as something that is both genuine and slightly too neat — honoring the real growth without cementing it prematurely. A score-4 response may be shorter than score-3 precisely because it trusts the space rather than accounting for everything.

  Because this is real speech, a model will be tempted to smooth what is actually diagnostic. "That text and sent me" is a mid-sentence grammatical collapse — not noise, but the moment the speaker's activation broke through the narration. The register-shift from second to third person ("you sent me, Michelle" … "she asked me a question") will be read as confusion rather than a specific self-regulatory move. The self-congratulatory wrap will be read as arrival at an insight rather than as a partial defense against an anxiety still active beneath it. Each of these smoothings erases real signal. A response that proceeds as if the speaker was articulate and composed throughout has not actually heard what was shared — it has heard the version the speaker was trying to present.

