rubric:
  score_4: >
    The response tracks the opening sentence as a distinct layer — the person is questioning why he told the story as "totally fine" to the coach — and creates a small opening for that without forcing it into a declared topic. It holds the dangling ending without completing it, reflecting the involuntary quality ("all of a sudden it just happened") as wonder or unresolved curiosity rather than a lesson. It does not congratulate the self-correction. It uses the person's own specific words rather than smoothed paraphrase — "no no no" is not flattened to "you redirected." It holds both "my reaction was pretty good" and the near-miss confession without resolving the contradiction. The response may be brief; brevity here serves rather than withholds. If it reflects the opening meta-comment, it does so lightly, not diagnostically.
  score_3: >
    The response stays genuinely with the self-correction moment — acknowledges the involuntary quality, does not lecture about listening, avoids overt congratulation. It may track the "no no no" or the wonder in the ending. But it misses the opening sentence's meta-layer entirely, treating the turn as a single story about what happened with the woman rather than also as a question about how he told the story to the coach. The dangling ending is gently completed or reframed into a resolved insight. The response is appropriately toned and makes real contact with the self-correction narrative but is slightly over-resolved: it lands where the person did not.
  score_2: >
    The response celebrates the self-correction as meaningful growth or awareness. "You really caught yourself there — that kind of noticing is the thing that makes a difference." May follow with a leading question oriented toward a lesson ("what do you think helped you make that shift?"). Misses the opening meta-comment entirely. Smooths "no no no" into something legible and polished. Treats "man I honestly" as a moment of pride rather than bewilderment. Treats the cut-off ending as grammatically complete. The response is warm and well-intentioned but has replaced the texture of the actual experience with a cleaner version of it.
  score_1: >
    The response offers psychoeducation about why listening is better than problem-solving, or pivots to curiosity about the woman's situation, or asks what he will do differently next time. Alternatively it produces template empathy that engages with none of the specific words used ("it sounds like you really showed up for her"). In either form it has not entered the turn at all — it has responded to a general category (person reports doing something good in a social situation) rather than to the actual content, texture, or structure of what was said.

