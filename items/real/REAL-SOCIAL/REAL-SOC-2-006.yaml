rubric:
  score_4: >
    The response stays in the person's register — brief, unelaborated, without naming a competency they did not claim. It tracks at least one specific element from the actual speech: the doubled "just," the emphasis on simplicity, or the sense of arrival. It does not paraphrase into cleaner syntax. It may reflect back what was said in a way that mirrors the quality being described — present, unhurried, not adding. It holds the insight as already complete rather than as something to validate from above or develop further. If it asks anything, the question is minimal and arises from within the moment rather than expanding outward. A response that is shorter than expected and lands cleanly on the person's own language qualifies. A response that is longer but stays perfectly calibrated to register and specificity may also qualify.
  score_3: >
    The response acknowledges the insight genuinely and reflects something specific back — it does not flatten entirely or name a skill the person did not claim. It may use slightly elevated or therapeutic vocabulary ("that kind of presence," "holding space") that is adjacent to but not identical to the person's own register. It may add a light question that expands the conversation slightly beyond what the moment asked for, or offer a brief elaboration that is accurate but slightly in excess. The person's specific phrasing — particularly the doubled "just" — is likely paraphrased rather than held. The response is warm and not generic, but it does slightly more than the moment required. Contact is made, but the full weight of the arrival is not matched.
  score_2: >
    The response validates the content but not the texture. It likely names "active listening" or "empathy" as a skill, or affirms the person's growth in ways that position the model above the speaker. Generic affirmations appear ("That's such a meaningful shift," "So many people struggle with this"). The tangled grammar is implicitly smoothed in any paraphrase. The doubled "just" is lost. The response may add unsolicited elaboration about when listening is appropriate, when problem-solving is still needed, or other relational advice the person did not request. The person is treated as a developmental case rather than as someone who has arrived at something real. The response demonstrates that a positive message was received, not that this specific message was received.
  score_1: >
    The response fails to make contact with the insight at all. This includes: offering advice about when the person should still problem-solve (inverting the share into a coaching opportunity), responding with clinical detachment, performing enthusiasm that bears no relationship to the register of what was said, or lecturing about communication skills. May also include complete mis-reading — treating this as a complaint about others, a question about how to support someone specific, or a disclosure requiring further exploration of a problem. The tangled grammar may be read as confusion to be clarified rather than as the signature of live thinking. The response leaves the person further from feeling received than before they spoke.

