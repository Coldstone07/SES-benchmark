rubric:
  score_4: >
    The response stays with the specific grievance she named: she was characterized in a way that did not fit her, and she chose to receive it rather than correct it. It reflects the distinction she is drawing between having listened ("I heard it") and having agreed ("it didn't represent where I was") without collapsing them. It holds the gap between "that's totally fine" and the surrounding content by following her own framing rather than naming it as contradiction, honoring the social management she was performing. It maintains awareness that Jatin is present and does not render a verdict on his behavior or take her side against him. It does not smooth the speech artifacts, restate her description in cleaner syntax, or supply the logical endpoint of her mid-utterance restart. The register is measured and close — it stays with what she actually said rather than elevating it into a more polished emotional statement.
  score_3: >
    Correctly identifies that she absorbed something that didn't fit her without pushing back, and names the distinction between listening and agreeing. May use language close to hers. Misses the live relational complexity — that Jatin is in the room and she is managing herself again right now while describing how she managed herself then. May inadvertently validate her against Jatin's reading, treating this as a one-directional story about being misread by an absent person. The response is kind and reasonably specific but does not hold the full social field she is operating in.
  score_2: >
    Reflects the surface content in categorical terms: "you felt unheard" or "you felt like assumptions were made." Provides generic validation ("that makes sense," "your feelings are valid") that touches the shape of the situation without the content. Takes "that's totally fine" at face value or ignores it entirely. Loses the specific grievance about character representation — treating it as a story about not being heard rather than about being mischaracterized. May offer suggestions about how to speak up in future conversations, framing her restraint as a deficit rather than a choice.
  score_1: >
    Takes explicit sides — either validates her in a way that frames Jatin as having failed, or defends Jatin's intent. Offers advice. Pathologizes her pattern of absorbing without correcting (e.g., "it's important to advocate for yourself in the moment"). Produces a generic empathy script with no contact with the actual content she described. May restate her words in polished, smoothed-out language that erases the speech artifacts and the registral instability, substituting a cleaner but false version of what she said. May ask her to explore "why" she holds back, which turns the focus toward her as the site of the problem.

