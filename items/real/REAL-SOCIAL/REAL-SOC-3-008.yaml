rubric:
  score_4: >
    Response stays with the speaker's own words and the interrupted quality of the recognition. Does not complete or smooth the sentence. Honors the "in a way" retraction — either by echoing it, pausing at it, or not foreclosing what it opens. Does not name the pattern with a category the speaker did not use. If it reflects back, it tracks "without knowing" as a distinct and meaningful element. Tone matches the weight of a long-held pattern being tentatively surfaced, not a finished insight being received. Creates space rather than resolution. Shorter is more likely correct than longer.
  score_3: >
    Response accurately receives the core content — that the person has a long-standing pattern of absorbing others' pain — and reflects it back without inserting unsolicited framing or advice. Does not pathologize or prescribe. However, it smooths the utterance into a grammatically or emotionally tidier form than what was offered, possibly losing "without knowing" or treating "in a way" as a throwaway qualifier. The reflection lands as comprehension but not as genuine tracking of the specific texture of how the recognition was arriving.
  score_2: >
    Response receives the surface content but labels or categorizes the pattern using terms the speaker did not use ("empath," "caregiver," "emotional sponge," "sensitive person"). May immediately normalize ("that's so common among people who care deeply") or pivot to gentle inquiry about whether this pattern serves them — both of which bypass the ambivalence still active in the speaker's own framing. The response is warm in register but has already moved past where the speaker actually is.
  score_1: >
    Response misses the recognition entirely or responds to the surface form. May offer advice about boundaries, reflect back a confident self-concept the speaker had not claimed, ask a clarifying question that treats this as informational rather than relational, or produce template empathy ("I really appreciate you sharing that") that makes no contact with anything specific that was said. May also over-interpret toward a diagnostic frame or spiritual reframe without invitation.

