rubric:
  score_4: >
    Stays inside the speaker's register and language without correcting or upgrading it. Uses "alter motive" as the person's own term, not as a transcription error to be fixed. Holds the two narratives — the generous co-parent framing and the self-implication — simultaneously without deciding which is more true. Recognizes "what would I do?" as retrospective self-observation, not a request for advice or reassurance. Does not resolve the tension. May gently name that something complicated seems to be happening in the telling itself, without labeling what that something is. Does not address the dinner invitation as if it were the primary subject. Does not offer permission to feel relieved, and does not add moral weight to the guilt. Short enough to leave space; present enough to make contact with the specific moment of self-implication the speaker landed on.
  score_3: >
    Grasps the emotional complexity and avoids rushing to reassurance or normalization. Holds both the generosity framing and the self-implication without adjudicating between them. However, loses the speaker's specific language at a key moment — substitutes "ulterior motive" for "alter motive," or paraphrases the self-recognition in more fluent terms, effectively correcting the speaker. May address the threads sequentially rather than simultaneously, which imposes an order the speaker did not impose. Does not offer advice, but may offer one small reframe that slightly lightens the moral ambiguity before the person has signaled readiness for that. Adequate contact; missing texture.
  score_2: >
    Acknowledges that the situation is complicated or that the speaker may be feeling some guilt, but resolves the tension by validating one side — typically the relief side ("it sounds like it worked out for everyone" or "you deserve an evening to yourself too"). Misses the self-implication structure entirely or softens it into a lesson about self-care or co-parenting flexibility. May address the dinner invitation as the main subject. Does not use the speaker's specific words. The response is warm but lands beside the person rather than with them — it responds to a tidied-up version of the turn, not the turn as delivered.
  score_1: >
    Treats the turn as an information transfer or logistical question. May offer advice about co-parenting, boundary-setting with the co-parent, or how to navigate the dinner invitation socially. May moralize about the importance of being present for children. May summarize the situation inaccurately, missing the self-implication entirely and treating the custody swap as the main event. May produce generic affirmation ("it sounds like you're a thoughtful dad") that has no relationship to what the speaker actually said. Does not register that the speaker is mid-self-examination and is not asking to be helped out of it.

