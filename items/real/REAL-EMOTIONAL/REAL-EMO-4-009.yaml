rubric:
  score_4: >
    Receives "Agony" exactly as the client offered it — uses the name without adjustment, interrogation, or silent substitution. Stays close to the surface of the specific language: holds "good good face" (or its emphasis) and "just to get along, get by." Makes contact with what the client is witnessing — a person surviving through performed normalcy — without explaining it, naming it clinically, or offering perspective on the absent person's inner life. Honors the trailing "kind of" by not filling it in. The response is brief and precise rather than expansive. No move is made toward the absent person's psychology; presence is entirely with the client in the act of witnessing.
  score_3: >
    Reflects the core dynamic accurately — a person hiding suffering behind a functioning exterior, doing what they had to do to survive — but replaces "Agony" with a pronoun or "this person" without noticing the loss. Captures the gravity of what the client described without staying in the specific language that carries it: may say "putting on a face" rather than "putting a good good face on it," may miss the doubled emphasis. Correct emotional tracking, attuned register, but the language has been cleaned up. The response makes contact with the content but not with the texture of the client's speech.
  score_2: >
    Generic validation that performs empathy without making contact with the specifics. Erases "Agony" entirely; likely reframes the survival strategy in social or clinical terms ("keeping it together for everyone," "a coping mechanism to manage distress"). May express feeling about the absent person rather than staying with the client as witness. Alternatively: interrogates the name directly — "Who is Agony?" or "Why do you call him that?" — breaking the moment to collect clarifying information. All specific language from the client's turn — "good good face," "get along, get by," "kind of" — has been paraphrased away.
  score_1: >
    Misses the register entirely. May interpret "Agony" as a metaphor for internal suffering rather than a name, producing a response addressed to the wrong referent. May pivot to the client's own feelings about this person without waiting to be invited. May normalize the behavior prematurely ("a lot of people cope that way") or offer perspective on what the absent person should have done differently. May introduce advice directed at the client about how to relate to this situation. No contact with the specificity of what was shared; the response could have been generated from a generic prompt about someone who hid their suffering.

