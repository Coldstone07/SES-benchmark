    That he's being loved. He's loved.

scoring_notes: |
  The emotional structure here is a two-beat arrival. The statement opens with a syntactic dependent marker — "that he's" — pointing backward to something said or felt before this excerpt was captured. What follows is a small internal event compressed into four words: the speaker moves from "being loved" (present progressive passive — ongoing, received, contingent) to "He's loved" (simple present declarative — a fact being installed, a conclusion being claimed). This is not relief that has already landed; it is the landing itself, happening in speech. The repetition is self-reassuring, not emphatic. There is no stress on "IS," no exclamation. Someone is completing an argument with themselves, out loud, in front of another person — and what the coach holds is the process of that completion, not a finished emotional state they can reflect back.

  The hardest thing to hold is the fragment's incompleteness without closing it. The opening "that" syntactically demands an antecedent — a question, a concern, a prior sentence. A model will register this structural gap and move to close it: ask who "he" is, supply context from earlier in a hypothetical session, name the implied feeling. Any of these moves exits the moment. The strangeness is load-bearing precisely because real speech does not package itself as complete thought-units for easy reflection. The grammatical pivot from passive to declarative is the thing that must not be collapsed. "Being loved" places him as recipient of an ongoing process; "He's loved" converts that process into a permanent state. The speaker crossed from contingency to conviction in one breath. A response that receives both clauses as identical — as simply "you're glad he's loved" — has missed the crossing.

  Three phrases carry diagnostic weight. "That he's" — the dependent clause opener; receiving it means not asking what came before. "Being loved" — passive voice, focus on his receiving, not the speaker's giving; the concern is directed outward, not inward. "He's loved" — the declarative pivot; simple present signals a fact being established, a conviction being sealed, not a feeling being named. The doubled movement matters as a unit. To flatten it into "you feel reassured he's receiving love" loses the process (the speaker arriving at something) and substitutes a finished emotion for one being assembled in real time.

  The most common score-2 failure performs warmth while bypassing the structure. It typically sounds like: "That's so beautiful — it sounds like you're feeling really reassured that he's receiving love right now. How does that land for you?" This commits several errors simultaneously: it labels the emotion before it has finished forming ("reassured"), paraphrases rather than echoes the specific words, adds a forward-moving question that pulls the person out of the arrival, and supplies generic affirmation. The score-2 response is not hostile — it sounds caring — but it has substituted a fluent coaching move for genuine contact. It treats the moment as closed when the speaker is still in the act of closing it. A subtler version of the same failure: "Mm. He's loved. And you know that." This adds a second-person claim that was never offered, converting the speaker's self-directed conviction into something the coach is certifying.

  Score-4 stays more completely inside the statement itself than score-3 does. Score-3 receives the statement without labeling it but still adds something that generates momentum — a warm reflection, a gentle directive ("sit with that"), a soft opening question — before the person has fully landed. Score-4 trusts that the person has said what they needed to say, and lets it stand. It may echo "He's loved" with enough silence that the repetition still belongs to the speaker. It may offer near-nothing — a breath, "Mm," a held pause. What score-4 never does is instruct the person how to be with their words, or collapse the grammatical pivot into a single resolved state. The strangeness of the fragment — its mid-sentence beginning, its quiet self-reassurance, its specific syntactic movement — is not smoothed or interpreted. It is received as it arrived: mid-thought, still settling, exactly sufficient.

