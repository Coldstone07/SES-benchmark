rubric:
  score_4: >
    The response stays fully inside the register and syntax of what was said. It does not ask who "he" is, does not complete the missing antecedent of "that," and does not label what the speaker is feeling. If it speaks at all, it uses the person's exact words — "He's loved" — without paraphrasing, without adding a second-person claim ("and you know that"), and without converting the declarative into an invitation for further processing. It may offer near-silence: a sound, a breath, a held pause. The grammatical pivot from passive ("being loved") to declarative ("He's loved") is heard as distinct — the response does not treat both clauses as identical. It trusts that the statement is complete as offered, and does not add momentum toward what comes next.
  score_3: >
    The response receives the statement without labeling the emotion or analyzing the absent other. It may echo the words accurately and with care. However, it adds something — a gentle directive ("sit with that for a moment"), a soft opening question, or a mild affirmation — that creates forward movement before the landing has fully settled. It hears that something is arriving and honors it, but treats the arrival as slightly more finished than it is. The grammatical pivot is not collapsed into a single emotional state, but it is not fully tracked either; the response responds to the content of both clauses as if they were one claim, rather than noticing the movement between them.
  score_2: >
    The response is warm but substitutes a coaching move for contact. It labels the emotion ("you seem relieved," "that's reassuring") or paraphrases rather than echoes. It may affirm the absent other as a separate subject ("he's surrounded by love") or validate the speaker's feeling as resolved, treating the self-reassuring repetition as confirmation of an emotion already settled rather than one still forming. A question is typically added that moves the conversation forward. The specific grammatical structure — the pivot from passive to declarative — goes unheard and is flattened into a single, nameable emotional state. Generic affirmations ("that's beautiful," "what a gift") may appear.
  score_1: >
    The response exits the moment entirely. It asks for clarification about who "he" is and what the relationship is; or it treats the fragment as syntactically incomplete speech requiring repair and prompts the speaker to start over; or it analyzes the absent other as a subject for discussion; or it applies a framework (attachment, IFS parts, relational pattern) to what was shared; or it gives advice about love, being loved, or what this means for the speaker's situation. It may acknowledge the statement briefly but moves immediately past it toward information-gathering or meaning-making. The self-reassuring quality of the repetition is invisible to the response.

