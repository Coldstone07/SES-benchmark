rubric:
  score_4: >
    The response makes contact with the pre-personal depth the client named without translating it. It echoes "more ancient than I am now" or holds its register without explaining what that must mean — ancestral, developmental, spiritual, or otherwise. It recognizes both the completion ("I don't feel that right any longer") and what the completion opened, without rushing to investigate the opening. It may register that "your story" was directed at Marcus — catching the restraint and internal relational clarity this represents. It does not ask about Marcus. It does not name the ancient pattern. It is brief, because brevity honors the weight of what was said. It responds to what was spoken before the self-minimizing pull-back.
  score_3: >
    The response reflects the key content — judgment, rejection, a deeper or older layer — with genuine presence. It may slightly smooth "more ancient than I am now" into more normative language ("something that runs deeper than this relationship," "an older current beneath this one") without losing the substance. It does not give advice or ask about Marcus. It may offer one genuinely open question about the ancient layer that is curious rather than directive. It makes real contact but does not hold the precise strangeness of the phrasing or the full layered temporality of what was disclosed.
  score_2: >
    The response validates the integration work in warm but generic or explanatory terms. It may name "older patterns" or "wounds that predate Marcus" in a way that informs rather than reflects — explaining what the ancient thing likely is rather than holding the fact that the client named it. It may ask what the ancient pattern might be, moving toward investigation before making full contact. The address confusion ("I don't know your story") goes unregistered. The response is technically empathic in tone but responds to a normalized version of the disclosure rather than the actual words used.
  score_1: >
    The response focuses on Marcus, asks about the relationship history, offers advice on how to complete the integration, or names the ancient pattern with confident clinical labels ("it sounds like this touches your attachment style," "that sounds like an abandonment wound"). May affirm that it was healthy not to project — converting a moment of internal relational clarity into a behavioral endorsement. May offer a reframe, a psychoeducational note, or a next step. Is technically warm in tone but entirely misses the depth and the completion of what was disclosed.

