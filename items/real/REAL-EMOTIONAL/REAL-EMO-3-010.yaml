strangeness_notes: "The phrase 'more ancient than I am now' is the tell — it is a genuinely odd formulation that a synthetic writer would smooth into something like 'older wounds' or 'childhood patterns.' The speaker also self-interrupts to disclaim projection ('I don't know your story') while apparently speaking to the coach about the ex-partner, which creates a slight address confusion that feels real and unrehearsed. The double 'like, oh, like' opener is a specific hesitation pattern, not generic filler."

