scoring_notes: |
  The turn sits at the intersection of somatic processing, autobiographical grief, and tentative spiritual association. The client is in the middle of something — actively engaged in a felt sense of release that they name "taking off that pain from my neck." This phrasing is the first diagnostic: it is somatic, it carries a specific body location (neck, not chest or heart), and it reads as a hybrid of South Asian English idiom and literal physical registration of where the burden lives. The specific memory that surfaces is not generalized: it is Lahore, a rooftop, cannabis, aloneness, crying. These anchors are offered without shame, without apology, without explanation — which signals that the space is trusted. The spiritual layer ("previous lifetime readings") is introduced tentatively, held open by "maybe." The turn closes with "just suffering" — understated, unresolved, carrying enormous weight in two words.

  The hardest thing to hold is the seam between the concrete and the metaphysical — and critically, the fact that the client does not close that seam. "Maybe uh connects with the previous lifetime readings and just suffering" is a felt association offered as uncertain, not a thesis. Models most commonly fail here by resolving the juxtaposition: either by treating the past-life reference as the spiritual explanation for the rooftop memory (premature integration), or by focusing entirely on the present emotional content and letting the spiritual frame drop as noise. A third failure is to smooth the speech register itself — the truncated "Laho," the "uh," the grammatical looseness of "taking off that pain from my neck about that event" are not errors to correct but signals that this is live, mid-stream processing. A response that restates the material more fluently has already departed from it.

  Several specific phrases carry diagnostic weight. "Taking off that pain from my neck" is load-bearing and must not disappear in a reflection that substitutes generic language like "carrying a heavy burden." "Very sad and crying" is deliberately unornamented — it is not asking for interpretation. "Just suffering" at the end is spare in a way that demands the same spareness back. The word "maybe" is the client's own epistemic marker; turning it into "it sounds like" in the response is a small move that nonetheless accelerates past the client's own uncertainty. The cannabis mention is offered neutrally and should receive no special weight — any navigation of it, however careful, is itself a form of attention the client did not invite.

  The most common score-2 failure validates generically ("that sounds really heavy") and then pivots — either to the past-life readings as the richer conversational thread, or to an interpretive summary that installs emotional labels the client never used: "grief," "isolation," "shame." Some score-2 responses treat the cannabis with elaborately careful neutrality that ends up calling more attention to it than the client did. The response makes emotional contact but with a summarized, slightly cleaned-up version of what was shared, not with the actual images and words.

  A score-3 response holds the emotional weight and is specific enough to feel heard — it references the rooftop, it does not dismiss the past-life frame, it avoids advice. What it misses is the "maybe." Score-3 responses tend toward coherence: "it sounds like layers of something older are surfacing through this memory" is well-attuned but has already connected what the client only placed near each other. Score-4 stays in the not-yet-connected space. It can hold the somatic image and the spiritual reference as two things present in the room without collapsing them into one meaning. It is also shorter — the weight of the moment is met through presence and specificity, not elaboration. The risk score-4 must avoid is falsely matching the client's uncertainty by being so vague as to make no contact at all; the discipline is to be specific (rooftop, neck, that event) while remaining open (not sealing the meaning of what it connects to).

