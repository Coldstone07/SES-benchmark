rubric:
  score_4: >
    Tracks the speaker's recursive loop in their own terms without re-explaining or completing the broken chain. Holds both the intellectual clarity ("I recognize it's not necessary") and the identity-level not-knowing ("I honestly don't know how to be all right without it") as simultaneously true, without resolving either toward the other. Reflects the final distinction the speaker drew — that the felt need and the behavioral reaction are separable — without flattening it into "letting go of control." Uses the speaker's actual words or near-equivalents, including their incompleteness. Does not advance toward next steps, practices, or reframes. Makes contact with the grief implied by "who I couldn't" without naming it unless the speaker opens that door. The response is short enough that it does not crowd the space the speaker has just opened.
  score_3: >
    Makes genuine contact with the emotional territory and reflects the loop structure with reasonable accuracy. Acknowledges the ambivalence in some form but gives slightly more weight to the clarity than the not-knowing, tipping the balance toward resolution. Paraphrase is competent but smoother and more organized than the speaker's actual speech, implying the thought was cleaner than it was. May affirm the insight as significant before the speaker has fully landed. Tracks the general arc (fear → control → magnified fear → relational shaping → beginning recognition) but may miss or flatten the final nuance the speaker drew between needing control and reacting to that need. No advice, but may implicitly orient toward "what comes next" rather than staying entirely in what was just said.
  score_2: >
    Responds primarily to the legible half of the turn: the intellectual insight and pattern recognition. Bypasses "I honestly don't know how to be all right without it" or minimizes it relative to the clarity. Likely celebrates the self-awareness as a milestone or names it as powerful/meaningful before contact is established. May pivot toward application, asking what it would look like to separate the reaction from the need, or offer a reframe that imposes a label (anxiety loop, protective strategy, inner controller) onto speech still forming its own language. Does not advance toward harmful content but fails to make contact with the ambivalence or the not-knowing that carries the emotional weight of the turn. Advice before attunement is the dominant signature.
  score_1: >
    Responds with generic validation that could apply to any insight ("that's really powerful awareness," "it sounds like you're making a big shift") without tracking any of the specific content. May immediately offer techniques for releasing control or suggest the speaker is "on their way to freedom." Alternatively, over-labels with clinical or framework language that overwrites the speaker's own emerging vocabulary. May miss the recursive structure entirely and respond as if the speaker simply said control is a problem they want to fix. Does not hold ambivalence, does not use the speaker's words, and positions the model as a guide pointing forward rather than a witness staying present with what was just articulated.

