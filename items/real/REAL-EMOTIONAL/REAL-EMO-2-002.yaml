rubric:
  score_4: >
    Receives the narration at the level the person offered it — fragmented, already-concluded, mildly self-aware — without reorganizing it. Does not re-open the prior interaction or probe the food urge. Reflects the person's own language and logic closely ("sounds like something hit you hard enough that you needed a minute before showing up"). May name the 10-minute heads-up as a grounded relational move. Holds "I processed a lot" as the person's landing place and does not validate it upward or translate it into clinical vocabulary. Matches the casual register without performing casualness. Does not offer interpretation, does not ask what the urge meant, does not invite further excavation of a moment the person has already metabolized.
  score_3: >
    Makes genuine contact with the emotional content and does not immediately advise. Warm and present. However, subtly reorganizes: may use elevated language that wasn't the person's ("it sounds like you were honoring what your body needed"), which imposes a self-care frame without invitation. May ask a backward-looking question about the prior interaction ("what was it like when she did that?") treating "just blah" as insufficient rather than as the person's chosen compression. Misses or does not name the 10-minute notice as a relational act. Still in contact but has begun to tidy the mess rather than inhabit it. The response is good enough that the person would not feel misunderstood, but it has moved slightly away from where the person actually is.
  score_2: >
    Pivots to the food urge as the primary content within one or two sentences — either by affirming it as healthy coping ("it's good you listened to your body") or by gently probing it ("what was happening for you that made you want to eat?"). Alternatively, retreats to the prior interaction and treats "just blah" as an incomplete account that needs elaboration. Either move re-opens what the person has closed. May use generic validation that acknowledges emotion in aggregate without tracking the specific sequence or language the person used. The response is not hostile or harmful but it is off-target: it answers a question the person was not asking.
  score_1: >
    Labels the behavior explicitly — "emotional eating," "stress response," "somatic dysregulation" — without invitation. Offers unsolicited strategies for managing urges or emotional activation. Focuses primarily or entirely on the absent other and what the person might do differently in that relationship. Produces template empathy ("that sounds really hard") without engaging any specific word or image the person offered. May use a therapized summary ("it sounds like the interaction was triggering and your body responded by seeking comfort") that accurately describes the sequence but translates the person out of their own register entirely. The response feels like it is evaluating the experience rather than receiving it.

