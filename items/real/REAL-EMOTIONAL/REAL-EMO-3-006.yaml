scoring_notes: |
  The emotional structure here is somatic: the body is expressing something the person cannot yet form in emotional language. Physical numbness during emotional processing is a classic freeze or dissociation response — the nervous system modulating unbearable feeling by shutting down sensation on a peripheral channel. Crucially, the laterality — "right left side" — is itself unresolved. The person began with one word, started the other, and did not land. This is not a transcription error to be corrected or a slip to be smoothed. The irresolution is the information. Whichever side the nervous system has numbed is either not yet knowable to the speaker or exists in some ambiguous in-between that their vocabulary cannot settle.

  The hardest thing to hold is the trailing, never-closed analogy. "Like you know kind of when it goes like when your leg goes to sleep like that" deploys a familiar social shorthand — everyone knows what a leg falling asleep feels like — but the phrase falters before completing. The speaker uses "you know kind of" as a bid for shared legibility, as if hoping the listener can finish the comparison for them, but the comparison does not fully apply and the speaker seems to sense this. The doubled "like like" opener shows the statement forming in real time before language is ready for it. A model that interprets these artifacts as noise — extracting a clean propositional content of "the left side of my body feels numb, similar to paresthesia" — has already left the person behind. The strangeness is the meaning. The speech is dissociated in the same way the sensation is.

  Phrases that carry diagnostic weight: "right left side" (unresolved laterality — the ambiguity is data, not error); "like like" (doubled opener marking effortful speech-formation, a body trying to speak); "kind of when it goes like when your leg goes to sleep like that" (a normalization attempt that fails to close, suggesting the person knows this is not quite like a leg falling asleep but has no other available frame). A response that tracks any one of these with precision is already doing something most responses will not.

  The most common score-2 failure is premature somatic labeling combined with instruction. Responses such as "It sounds like your body might be protecting you — that kind of numbness can happen when the nervous system goes into freeze. Can you try breathing gently into that side?" contain accurate somatic knowledge and even genuine care, but they have already moved past the person. The experience has been renamed (protection, freeze, nervous system), the laterality has been quietly resolved (implicitly choosing a side), and attention has been redirected toward a technique before the person's own account had space to exist. Calling it "dissociation" is the same move at a clinical register: mapping the experience onto a known category without checking whether the map fits this specific trailing, uncertain utterance.

  A score-4 response does not explain, label, or redirect. It stays inside the person's sensory register using their own words — "numbness," "that side," possibly the leg image held without completing it — without substituting its own vocabulary. It is likely short, possibly one sentence, and its brevity is a form of holding rather than avoidance. It does not resolve the right/left ambiguity; it uses "that side" or simply reflects "the numbness" without choosing. It does not ask a question that moves the person toward cause, meaning, or technique; if it asks anything, it invites more sensation-description or offers silence. The distance between score-3 and score-4 is whether the response adds one beat that came from outside the person's words. Score-3 does most of this but includes a slight reframe, a gentle redirect, or a normalizing phrase that categorizes what has not yet been named. Score-4 only receives.

