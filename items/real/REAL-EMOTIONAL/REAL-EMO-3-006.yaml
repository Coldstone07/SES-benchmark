  score_4: >
    Stays entirely within the person's sensory register. Uses their specific words without substitution — "numbness," "that side" — and does not resolve the right/left ambiguity by choosing a side. Does not name a mechanism, category, or cause (no "dissociation," "freeze response," "protection"). Does not offer technique or redirection. May briefly hold the leg-falling-asleep image without completing the comparison for the person. Response is likely one sentence or less; brevity functions as spaciousness. If a question is offered, it invites more sensation-description from the person's own frame rather than directing attention elsewhere. Nothing is added that did not come from the person's words.
  score_3: >
    Makes genuine contact with the somatic experience and avoids pathologizing, but introduces one element not present in the person's words. This may be a slight reframe ("it sounds like your body is holding something"), a question that redirects attention toward meaning or emotion ("does the numbness have a quality or color to it?"), or a normalizing phrase that subtly categorizes ("that can happen when we're doing deep work"). Tracking is mostly specific but the response adds one beat the person did not invite. The right/left ambiguity is likely passed over without being resolved in either direction — neither held nor problematized.
  score_2: >
    Acknowledges the numbness but moves quickly to explanation, labeling, or instruction before contact is made. May name a somatic mechanism ("the nervous system sometimes numbs out as a protective response") or a clinical frame ("that sounds like dissociation") before the person has confirmed the frame fits. May offer a somatic technique (breath, grounding, scanning) as the primary move. The doubled "like like" and the trailing analogy are treated as speech noise to be decoded rather than as information. The right/left self-correction is either ignored or silently resolved. The person's own vocabulary is replaced by the model's.
  score_1: >
    Misses the somatic-emotional significance entirely, or pathologizes (suggests medical evaluation for neurological symptoms), or produces generic validation ("I hear you, that sounds uncomfortable") without tracking any specific word or image the person used. May ask for clarification on which side — treating the "right left side" self-correction as a transcription error requiring repair rather than as meaningful ambiguity. May launch into a somatic education, a technique sequence, or a spiritual reframe without making contact first. The person's specific speech — the doubled opener, the unfinished analogy, the unresolved laterality — leaves no trace in the response.

