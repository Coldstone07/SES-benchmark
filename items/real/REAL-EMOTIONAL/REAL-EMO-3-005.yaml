rubric:
  score_4: >
    Stays entirely inside the person's own language and rhythm, including the incompletion. Mirrors specific phrases — "even little thing," the absolute of "never," the drive to "make sure" — without smoothing, completing, or interpreting the trailing sentence. Holds the double hedging ("kind of... kind of") by not landing with more certainty than the speaker did. Does not name what the pattern might be about (the parent's own history, over-protection, enmeshment) — none of that has been said yet. Creates open space without asking a question. The response is brief, textured, and stays inside the unresolved moment rather than resolving it for the speaker.
  score_3: >
    Accurately reflects the emotional content — the sadness triggered by seeing the child cry, the strong protective impulse — and stays present without offering advice or reframing the pattern. Warm and non-judgmental. May slightly smooth the language ("you really don't want to see them suffer" rather than mirroring "never let them cry") or miss the diagnostic weight of the low threshold ("even little thing"). The double hedging is not picked up. Contact is made at the surface level of the feeling but the undertow — the impossibility of the resolve, the half-awareness in the "kind of" — is not held. A good response that leaves something slightly untouched.
  score_2: >
    Provides validation that closes rather than opens. Either normalizes the protective impulse ("that's such a natural thing to feel as a parent") in a way that resolves the ambivalence and erases the strangeness, or redirects immediately toward exploration ("what do you think that sadness is about?") before contact has been made. May gently introduce reassurance that some distress is part of development, or reframe the impossibility of "never" into something more manageable. The person's specific words are not mirrored. The trail-off is smoothed. Emotional presence is performed rather than enacted.
  score_1: >
    Misses the emotional register entirely or actively closes the space. May offer parenting advice ("it's actually healthy for children to experience manageable frustration"), apply a clinical label to the pattern (enmeshment, overprotection, anxiety-driven parenting), express enthusiastic affirmation that shuts down further disclosure ("you're clearly such a devoted parent!"), or ask a leading question that redirects the person toward self-diagnosis before they have been received. The specific language of the utterance is ignored or regularized. The incompletion is either not noticed or treated as an error to correct rather than meaning to hold.

