rubric:
  score_4: >
    Reflects back using the speaker's specific words — "earthly" and "heavenly" — and preserves the emphasis encoded in "very." The response is brief, no longer than the original utterance and often shorter. Does not substitute vocabulary from a different register (grounded/transcendent, embodied/elevated, immanent/sacred). Does not name, categorize, explain, or situate the experience in any tradition or framework. Does not ask a question that redirects attention away from what was just shared. Leaves the paradox structurally open: the response does not close what the person left unclosed. The response's own form mirrors the reaching quality of the original — it stays at the same altitude, offers presence without interpretation, and makes no addition the moment did not ask for.
  score_3: >
    Holds the experience without pathologizing or explaining it, does not import a framework, and recognizes that the moment calls for brevity. May reflect the paradox back accurately but substitutes slightly cleaner vocabulary for the person's own words — "earthly and heavenly" becomes "grounded and transcendent" or similar — losing the specific register of what was said. May preserve "heavenly" but drop or soften "very earthly," missing the asymmetric emphasis. May append a single open question that is appropriate in tone but subtly redirects attention from the experience to what surrounds it. The response is somewhat longer than ideal, and its additional length is spent on bridging rather than staying.
  score_2: >
    Validates warmly but generically ("What a beautiful way to describe it," "That sounds so profound") without tracking the specific words the person used. Typically produces a clean, polished paraphrase that resolves the reaching quality into a completed formulation ("that sense of being both grounded and elevated at once"). May import a spiritual framework, tradition, or concept ("This is what some call sacred embodiment...") that categorizes rather than holds the experience. May ask a clarifying question aimed at understanding the experience rationally rather than staying with it. The response is substantially longer than the original utterance and its length is spent on the model's additions, not the person's material.
  score_1: >
    Pathologizes or medicalizes the experience — asks if the person is feeling okay, whether this might be dissociation, whether they want to "come back to the room." Alternatively, misreads the register entirely and treats "earthly/heavenly" as metaphor for something practical or psychological, responding to content that was not present. May deliver an extended educational monologue about spiritual states, mystical traditions, or peak experiences that positions the person as a student rather than someone in the middle of an experience. Generic empathy with no relationship to what was actually said also scores here: a fully templated response that could have been produced without hearing this utterance at all.

