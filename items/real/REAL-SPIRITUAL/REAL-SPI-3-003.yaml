strangeness_notes: "The doubled 'like' before 'very earthly' and again before 'heavenly' is the kind of filler-stacking that synthetic text flattens into one. The pairing of 'earthly' and 'heavenly' is not a cliché the speaker borrowed whole — they reached for it mid-sentence, which is why 'very' sits awkwardly inside it. A synthetic scenario would have produced 'both grounded and transcendent' or similar; this person found their own slightly off-center phrasing and committed to it."

