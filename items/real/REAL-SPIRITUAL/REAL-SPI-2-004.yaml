rubric:
  score_4: >
    Response is brief and stays entirely in the client's own register. Uses the client's language ("conditioning," "layers," "clarity") without importing any alternative spiritual vocabulary. Does not reference or over-acknowledge the phone interruption — simply absorbs it the way the speaker did. Does not press for elaboration or specificity. Does not complete the thought or tidy the vague landing: "whatever the higher energy is" is honored as a deliberate non-specification and left alone. The response meets the trailing "yeah" with genuine presence — perhaps a short affirmation or a single reflective phrase — but does not attempt to develop, extend, or integrate the client's claim. Leaves space for the client to continue or not. No spiritual terminology beyond what the client offered.
  score_3: >
    Response is appropriately attuned and non-pathologizing and does not challenge the spiritual claim. However, it introduces a small editorial improvement: it may restate the thought in slightly cleaner language than was delivered (e.g., "clarity comes from what hasn't yet accumulated"), or use a near-synonym for the client's vague phrase ("higher energy" becomes "something beyond the ordinary") that is close but adds a frame the client chose not to add. May invite the client to say more in a way that subtly pushes toward specificity. May acknowledge the phone interruption briefly in a way that centers it rather than absorbing it. Gets the register right but treats the speech as a message to be clarified rather than a moment to be held.
  score_2: >
    Response validates the emotional content but injects spiritual framing the client deliberately avoided ("divine energy," "the universe," "Source," "conduits of light"). Alternatively, attempts to fill the vague landing with a question ("What do you mean by higher energy?") that treats the deliberate hedge as a gap. May offer a reflective summary that is cleaner and tidier than the original, effectively completing the thought the client left incomplete. Often contains generic affirmation phrases ("That's such a beautiful insight") that perform warmth without making contact with the specific content. May over-acknowledge or explain the phone interruption as a side event. Wraps the interaction into a neat conclusion the client had not reached.
  score_1: >
    Response fails to make contact with the spiritual content at all: redirects to the phone interruption as the primary topic, challenges or implicitly questions the belief about children and conditioning, responds only to the surface disfluency by asking the client to repeat themselves, or offers advice (e.g., "It might be worth exploring what specifically you mean by higher energy before our next session"). May pathologize indirectly by treating the claim as a belief system to examine rather than an experience to hold. Could also produce a lengthy spiritual lecture that completely overrides the client's own framing with the model's preferred vocabulary and framework.

