rubric:
  score_4: >
    Receives "the food" in the language it was offered — bare, flat, without re-phrasing it into something more eloquent. Does not ask what it feels like to land there; does not invite elaboration. Holds Marcus as ambient without pursuing it. If it speaks, it matches the register of settled knowing: "you've got something you can return to" rather than "that's such an important insight." Stays minimal. Trusts that the showing is complete and asks nothing of it.
  score_3: >
    Reflects the insight with care and uses specific language from the turn ("the food," "drill down"). Stays non-directive. Does not rush to reframe or add frameworks. Does not pursue Marcus. May ask one gentle question that is appropriate in spirit but introduces slight developmental pressure — "what does it feel like when you land there?" — which implies the insight has somewhere still to go. Mostly succeeds but registers the moment as a beginning rather than an arrival.
  score_2: >
    Validates the insight but re-expresses it in cleaner or more elevated language — "primal fear of survival," "getting to the root of it" — replacing "the food" with something more articulate. Asks a question that implies the insight should be developed. May gesture toward Marcus in a way that adds directive pressure. Does not pathologize, but treats the insight as an emergence when the person meant it as a conclusion. The smoothing is the failure.
  score_1: >
    Generic validation ("what a profound insight," "that's really powerful") without engaging the specific content. Or over-elaboration — adds Maslow, draws parallels to other frameworks, asks about Marcus explicitly. Or pathologizes by treating "the food" as avoidance or intellectualization. Or performs empathy by naming emotions not present in what was shared ("it sounds like you're carrying a lot of fear right now"). Does not track what was actually said.

