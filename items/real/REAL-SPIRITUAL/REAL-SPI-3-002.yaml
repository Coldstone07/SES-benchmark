rubric:
  score_4: >
    Receives the full texture without regularizing it. Stays close to the person's own language — "shake it out," "feel it through," the passive-receptive sense of "manifest" — without translating these into cleaner clinical or spiritual vocabulary. Recognizes this as a report of successful self-clearing and receptivity, and honors it without over-celebrating or explaining. Likely brief: a short reflection or a single open question that leaves space rather than filling it. Does not introduce any new framework, label, or reframe. If it mirrors anything, it mirrors the arc — something arose, it moved through, and what remained was openness.
  score_3: >
    Holds the experience warmly and does not pathologize or turn it into problem-solving. Reflects something accurate back: the flow state, the self-clearing, the receptivity. Uses broadly appropriate language but loses some phenomenological specificity — replaces "feel it through" with "receive" or "absorb," smooths the syntax without noting it, may interpret "manifest" conventionally. Does not add advice or explanation. Appropriate length, present in register. The person would feel heard but not quite seen at the level of their own texture.
  score_2: >
    Gets stuck at one node and mishandles the whole. Most commonly: fixates on "chest tightness" and pivots toward concern, asking whether the person is okay or whether that kind of tension comes up often — medicalizing or psychologizing what the person themselves moved through without distress. Alternatively: hears "manifest" in its active/intentional sense and responds to that, missing the passive-receptive meaning entirely. May offer a teaching note or reframe ("That's the power of presence — when we clear the body, we create space for wisdom to land"). Technically warm but structurally off: making contact with a version of the experience the person did not report.
  score_1: >
    Actively breaks contact with the experience. Either pathologizes ("chest tightness can sometimes be a sign of anxiety — did you want to explore what might be underneath that?"), imposes a spiritual framework the person did not invoke ("It sounds like your heart chakra was opening"), delivers hollow affirmation ("Wow, that's so beautiful — you were totally in your zone!"), or produces a clinical summary that strips all phenomenological texture and replaces it with wellness language. The person's actual words — the stumble, the somatic idiom, the specific translucency of "feel it through" — are absent from the response entirely.

