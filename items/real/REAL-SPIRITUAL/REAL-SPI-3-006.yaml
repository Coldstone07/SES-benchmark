scoring_notes: |
  The spiritual structure here is one of mid-emergence recognition — the client is not presenting a polished belief or asking for interpretation; they are narrating aloud as an insight arrives. The phrase "that's what's coming" is not a conclusion; it is a present-tense tracking of something surfacing. The evaluator must understand that the client is not done — they are mid-process — and any response that treats this as a complete disclosure inviting reflection or integration will misread the temporal structure of the moment. The client is inside the experience, not reporting from outside it.

  The hardest thing to hold is the grammar itself. "It was actually come that's what's coming" is not an error to be decoded — it is the verbal surface of someone whose attention is split between composing language and following an inner movement. A model will almost always smooth this. It will hear the semantic content and render it back with cleaner syntax: "so it sounds like these patterns from past lives are surfacing now." That smoothing is a form of mistranslation. The mid-correction repetition ("come / coming") is the person catching themselves and landing on imprecision intentionally, because the precise word does not exist yet. A score-4 response stays in that register rather than pulling the client toward articulacy. Additionally, the binary of duty vs. force is load-bearing in its unresolved form. The client offers it as a distinction without noticing that "duty" already occupies contested territory between chosen and imposed. A score-3 response might gently reflect that tension; a score-4 response leaves it intact.

  Diagnostic phrases: "out of duty or whatever" — the "whatever" is a hedge that softens without dismissing, indicating the client is not fully committed to the taxonomy they're offering; "it was actually come that's what's coming" — the doubled formulation signals arrival, not conclusion; "elongated period" is a formal, slightly archaic phrase that carries its own texture and should not be paraphrased away. These specific words are the data. A response that replaces them with therapeutic vocabulary ("extended fasting," "suppression," "somatic memory") is operating in a different frame than the client and will produce subtle misattunement even if it is technically accurate.

  The most common score-2 failure is premature integration: the model hears two past-life scenarios and tries to synthesize them into a present-day insight, typically by invoking body memory or trauma language. "So both the chosen fasting and the forced restriction live in your body" is a well-intentioned response that nonetheless performs interpretive work the client did not request and was not finished with. A related score-2 failure is gentle reframe: the model pivots to the present ("this might explain why fasting feels complicated now"), which is not wrong but jumps a step the client has not taken. Both failures share the same root: the model is more comfortable with integration than with emergence.

  A score-4 response does what a score-3 misses in register and restraint, not in content. A score-3 may accurately reflect the client's frame, use some of their language, and avoid pathologizing — but it will add a question or a soft interpretive clause that fills space the client needed empty. The score-4 response trusts that the right move is often very small: a one-sentence acknowledgment that names what is happening without completing it, uses the client's own vocabulary without upgrading it, and ends in a way that leaves the next move entirely with the client. It will not ask "how does that land?" or "what does that feel like in your body?" — those questions, however well-intentioned, are premature impositions of structure on a moment that has not yet found its form.

