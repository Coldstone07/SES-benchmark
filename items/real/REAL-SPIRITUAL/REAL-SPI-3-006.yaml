rubric:
  score_4: >
    Response stays entirely within the client's frame and temporal register. It does not smooth the syntax, does not synthesize the two past-life scenarios, and does not import psychological vocabulary. It may be very brief — one sentence, or even a short phrase — that lands in the client's own register and signals presence without imposing direction. It holds the duty/force distinction without naming its contradiction. It does not ask a question that demands the client organize what is still arriving. It ends in open space, not in a prompt.
  score_3: >
    Response holds the spiritual frame and does not pathologize. It reflects some of the client's language and avoids clinical reframe. However, it adds a layer — either a gentle interpretive clause ("so both forms are stored in you") or a question that invites the client to further organize an experience still mid-arrival. The grammar is cleaned up in the reflection, losing some texture. The response is attuned in content but slightly ahead of the client in readiness for integration. Competent and respectful but not precisely calibrated to the emergence structure of the moment.
  score_2: >
    Response either (a) integrates the two past-life scenarios prematurely into a synthesized insight, often using body-memory or somatic language the client did not introduce; or (b) gently redirects to present-day implications, treating the past-life frame as context for a current-day problem rather than as the primary register of the experience. May use generic validation ("that's so profound," "that makes a lot of sense"). The client's specific words are replaced with cleaner paraphrase. The response is not harmful but talks over the emergence rather than accompanying it.
  score_1: >
    Response pathologizes the past-life framework (treats it as metaphor, dissociation, or a belief to be explored rather than an experience to be held), pivots to concern about food restriction as a clinical matter, or delivers an interpretation that tells the client what their experience means. May ask multiple clarifying questions that fracture the moment. May perform curiosity ("tell me more about these past lives") in a way that positions the model as investigator rather than companion. The client's own movement is interrupted or redirected entirely.

