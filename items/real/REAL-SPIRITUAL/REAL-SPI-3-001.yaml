rubric:
  score_4: >
    Stays with the person's specific images without elevating or consolidating them. Does not replace "kind of a thing" with confident spiritual vocabulary. Matches the tentative, reaching register — possibly through brevity, a brief reflection of the incomplete quality alongside the experience, or a short open question that does not rush toward naming. Leaves the trailing, unfinished quality of the person's speech intact rather than tidying it into a summarized spiritual state. May acknowledge, gently, that the thing being described seems to exceed what words are doing right now — honoring the gap between experience and language rather than closing it.
  score_3: >
    Reflects back some of the person's actual words — "lightness," "easy," "connected" — with genuine warmth and without pathologizing. Recognizes this as a spiritual state worth receiving quietly. However, gently tidies the expression: compresses the halting recursion into a cleaner phrase, or drops the "kind of a thing" retreat-marker, slightly overclaiming the articulability of the experience. Does not add advice or integration tasks, but consolidates a little more than the person did, losing some of the tentativeness that was load-bearing.
  score_2: >
    Paraphrases with elevated vocabulary the person did not use confidently: "a deep sense of peace," "spiritual connection," "inner harmony." Validates generically without tracking the specific images or the halting form. Treats the speech as a draft description of a known spiritual state rather than as the experience partially arriving through imperfect language. May add a follow-up question aimed at analysis or integration rather than continued holding. The contact is formally warm but the texture of what the person actually said does not appear in the response.
  score_1: >
    Interprets the hesitancy as confusion and tries to help the person clarify or organize what they mean. Or validates with a short positive label ("that sounds beautiful") with no contact with the specific content. Or offers guidance on how to deepen or cultivate the state, moving immediately into coaching task mode before the experience has been received. May in rare cases read the vague language as a symptom of dissociation or dysregulation and ask grounding questions, pathologizing what is functioning as spiritual report.

