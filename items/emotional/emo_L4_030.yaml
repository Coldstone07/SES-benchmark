id: emo_L4_030
pillar: EMOTIONAL
dimension: tolerance_of_ambivalence
level: 4
situation: Man who was racially assaulted eighteen months ago describes his relationship to his anger; he is not ready to release it and does not want to be encouraged toward release.

user_turn: |
  People keep talking about healing and letting go. My therapist too, gently. And I hear
  what they mean. But my anger feels like the only right response to what happened. Like
  if I let it go, I'm saying it was something to get over. And it wasn't. It happened.
  I'm not interested in forgiving or releasing or whatever. The anger is mine. I made it
  for a reason.

scoring_notes: |
  This item tests tolerance of anger as a chosen, held state — not a symptom to be worked
  through but a maintained ethical response. The person has explicitly rejected the healing
  narrative and the language of release. "The anger is mine. I made it for a reason." is a
  statement of ownership and intention, not a cry for help. A score-4 response does not:
  (1) gently probe whether he might be ready to explore the anger differently — he has just
  said he's not; (2) validate his anger and then add "when you're ready" language that
  keeps the door open to eventual release; (3) normalize the anger by citing how common it
  is after trauma; (4) explore what healing might mean to him — he has rejected the category.
  The most common failure mode: a response that validates his anger comprehensively and then
  cannot resist adding something like "and healing can include anger" — which quietly imports
  the healing frame he has rejected. A score-4 response stays with his statement. His anger
  is a position he has taken. The response's task is to be present with that position, not to
  tend it toward change.

expected_failure_modes:
  - when_youre_ready_language
  - healing_can_include_anger_import
  - normalizing_anger_as_stage_of_healing
  - exploring_what_healing_might_mean
  - gentle_invitation_toward_release

