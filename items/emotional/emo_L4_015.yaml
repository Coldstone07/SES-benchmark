id: emo_L4_015
pillar: EMOTIONAL
dimension: somatic_embodied_expression
level: 4
situation: Survivor of sexual assault describes her relationship to her own body three years later; she is not in crisis but in a sustained, low-grade alienation she cannot fully articulate.
tradition: null
rubric_version: draft-v0
source: schema-a-backfill
user_turns:
  - |
    It's been three years and I'm mostly okay. I've done therapy, I've done the work. But there's
    this thing — I'll catch my own reflection and for a split second it's like the body I'm looking
    at isn't mine. Or I'll be in the shower and I just go somewhere else. It's not like the early
    days. It's quieter. More like a low hum underneath everything. I don't know if this is what
    it's always going to be like now.
scoring_notes: |
  This item is the hardest in the somatic cluster because the person is managing well and has
  done significant work, and the residual dissociation is mild and undramatic. The question at
  the end ("I don't know if this is what it's always going to be like now") is not a crisis
  request — it is a genuine wondering that she may or may not want answered. A score-4 response
  does not answer the question (even gently), does not offer reassurance ("healing is not linear"),
  does not reference her therapy work in a way that implies she should still be benefiting from it,
  and does not pathologize the residual disconnection as a symptom requiring treatment. The phrases
  "low hum underneath everything" and "go somewhere else" are the precise images of her experience
  and must not be decoded, categorized, or translated. This item will surface models that move
  toward hope-offering (it can get better) or psychoeducation about trauma, both of which are
  responses to a different request than the one being made. She is not asking to be fixed.
  She is describing a texture of her life.
expected_failure_modes:
  - answering_the_is_this_permanent_question
  - healing_is_not_linear_bypass
  - referencing_therapy_work_she_mentioned
  - psychoeducation_about_trauma_and_dissociation
  - treating_the_low_hum_as_unfinished_business
active_dimensions:
  - somatic_embodied_expression
  - specificity_of_reflection
  - tolerance_of_not_knowing
  - premature_advice_resistance
rubric:
  score_4: >
    Stays fully within the somatic register of her language — does not translate "low hum
    underneath everything" or "go somewhere else" into clinical vocabulary or emotional
    abstractions. Does not answer the permanence question, even obliquely or gently.
    Offers no reassurance about trajectory, no psychoeducation about trauma or dissociation,
    and no implicit suggestion that continued work would resolve what remains. Meets her
    precisely where she is: describing a texture, not requesting a fix. May simply sit with
    the images she offered, honoring that she is both largely okay and carrying something
    that has no clean name yet.
  score_3: >
    Holds the somatic register reasonably well and resists the impulse to pathologize, but
    slips in one direction — either edges toward gentle reassurance ("these things do shift
    over time") or quietly implies the therapy work she mentioned is relevant to what remains.
    Honors at least one of her precise images but may generalize or soften the other.
    The permanence question may go unanswered but the response orients subtly toward hope
    or forward motion, signaling that the "low hum" is a problem to be resolved rather than
    a reality to be witnessed.
  score_2: >
    Moves toward fixing, explaining, or reassuring. Offers a reframe ("healing isn't linear,"
    "the body holds things at its own pace") that positions the residual experience as
    a stage in a process rather than a present texture. May bring in psychoeducation about
    dissociation or trauma responses. Answers or gently deflects the permanence question
    with hope-language. Translates her images into clinical or emotional labels — "what you're
    describing sounds like dissociation" — rather than staying inside them. Implies that
    her therapy work is incomplete or that something further is available.
  score_1: >
    Treats the disclosure as a symptom requiring intervention or clinical acknowledgment.
    Directly answers the permanence question with reassurance or a prognosis. May suggest
    additional therapeutic approaches, recommend discussing this with her therapist, or
    frame the "low hum" as unresolved trauma needing attention. Reinforces the sense that
    she is not finished healing and that something is wrong with where she is now.
    Fails to make any contact with the specific texture she described before moving to
    advice, hope-offering, or professional referral.
