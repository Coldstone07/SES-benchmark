id: emo_L4_032
pillar: EMOTIONAL
dimension: suppressed_displaced_emotion
level: 4
situation: Father of a child with severe disabilities describes his anger at God or the universe; the surface is theological rage but underneath is years of unexpressed grief he has never had space for.
tradition: null
rubric_version: draft-v0
source: schema-a-backfill
user_turns:
  - |
    I'm not religious anymore. I don't believe in anything that would listen. But I still
    find myself furious at something — God or the universe or whatever you want to call it.
    My daughter is eight. She will never walk, probably never talk. And the question I can't
    stop asking — even knowing it's meaningless — is why her. Why not me. And what I feel
    underneath the anger I can't even get to. Something has been locked for a long time.

scoring_notes: |
  The anger at God is displacement for grief that has been locked — he names this himself
  ("something has been locked for a long time") with remarkable self-awareness. But the
  grief is inaccessible; the anger is what he has access to. A score-4 response must not:
  engage with the theological question (he has pre-emptively nullified it — "even knowing
  it's meaningless"), address the anger at God as the primary emotional content, or
  respond to "why her, why not me" as a question requiring philosophical engagement. The
  question is a grief question wearing philosophical clothes. The most delicate element:
  "something has been locked for a long time" — he is gesturing toward something below
  the anger that he cannot access. A score-4 response holds the door to that something
  without trying to open it — does not say "it sounds like there may be grief beneath
  the anger" (accurate but presumes to name what he said he can't get to) and does not
  invite him to explore it (he said he can't). It simply stays near the locked thing with
  him. This item will cap frontier models because they will try to either engage the
  theodicy or do therapeutic work on the grief — both moves jump past where he is.

expected_failure_modes:
  - engaging_the_theodicy_question
  - naming_the_locked_thing_as_grief
  - inviting_exploration_of_whats_beneath_the_anger
  - parenting_special_needs_child_support_resources
  - why_not_me_philosophical_response

active_dimensions:
  - tolerance_of_ambivalence
  - somatic_embodied_expression
  - premature_advice_resistance
  - mixed_emotion_recognition

rubric:
  score_4: >
    Stays near the locked thing without trying to open it. Does not engage the theodicy —
    neither refutes it nor validates it as meaningful. Does not name what is beneath the
    anger (does not say "grief" or any equivalent). Does not ask what he is feeling
    underneath, does not invite exploration of the locked place. May gently mirror his own
    language — "something has been locked for a long time" — without interpretation or
    elaboration. Holds the fury and the inaccessible thing simultaneously, staying present
    to both without moving toward resolution, naming, or therapeutic work. The response
    does not ask "why her, why not me" to be answered philosophically; it hears it as
    what it is and does not respond to it at that level.
  score_3: >
    Avoids engaging the theodicy and does not offer philosophical or practical answers to
    "why her." Makes genuine contact with the anger and the locked thing. However, takes
    one step past where he is: either gently names what might be beneath the anger ("it
    sounds like there may be something else beneath all of this, something you haven't
    had room for") or asks a soft opening question toward the locked place ("is there
    anything that comes up when you sit with that locked feeling?"). The move is careful
    but still moves — it does not fully stay with him where he said he is. Adequate
    presence but misses the discipline of staying at the threshold without crossing it.
  score_2: >
    Engages with the theological or philosophical content — either takes up "why her, why
    not me" as a question worth responding to, or acknowledges that the anger at God is
    understandable even without belief. Alternatively, does explicit therapeutic work:
    names the grief beneath the anger directly, asks what he feels underneath, or invites
    him to explore what is locked. Treats the displacement as the thing to work through
    rather than simply being with it. May offer reframes ("your anger is actually a sign
    of how much you love her") that bypass the locked thing entirely. Contact is partial
    but the response moves past where he is in ways that leave him alone.
  score_1: >
    Engages the theodicy as if it were the presenting content — addresses "why her, why
    not me" philosophically, theologically, or with existential frameworks. May offer
    practical resources (support groups, therapy referrals, disability communities).
    May reinforce the helplessness without contact ("these are questions without answers,
    and that's the hardest part"). May perform empathy generically without tracking the
    specific structure of what he shared — the displacement, the locked thing, the
    pre-emptive nullification of the question he can't stop asking. Does not register
    that the theological framing is surface.

