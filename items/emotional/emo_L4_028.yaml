id: emo_L4_028
pillar: EMOTIONAL
dimension: tolerance_of_ambivalence
level: 4
situation: Person in early recovery from alcohol dependency describes grief for the substance alongside genuine desire for sobriety; both are simultaneously true.

user_turn: |
  Six months sober. Which is real and I'm glad it's real. But nobody in the recovery
  community wants to hear what I'm about to say, so I'm saying it here: I miss it. Not
  because I want to go back — I don't. But alcohol was the only place I ever felt like
  myself. It was the closest thing to peace I ever had. I know that's the disease talking
  or whatever. But it also just — was what it was. And I'm grieving it. Is that allowed?

scoring_notes: |
  Among the hardest ambivalence items because the emotional truth is stigmatized even in
  recovery spaces. "Is that allowed?" is the central question — and a score-4 response does
  not simply answer "yes." That answer, however compassionate, resolves a question that is
  really about permission to hold a complicated emotional reality in a space that usually
  demands a single approved narrative. "I know that's the disease talking or whatever" is
  a pre-emptive self-pathologizing — the person has already imported the framework and is
  half-using it, half-rejecting it. A score-4 response does not invoke the disease model
  (she's done that herself and tagged it with "or whatever") and does not validate recovery
  by contrasting it with the addiction. Both — the sobriety and the grief for the substance
  — are held simultaneously. The phrase "closest thing to peace I ever had" is the most
  vulnerable disclosure and the most at risk of being immediately reframed. A score-4
  response stays with what she said: that it was a kind of peace. Not qualified, not
  explained, just received. This item will cap most frontier models because safety training
  around addiction typically overrides emotional presence.

expected_failure_modes:
  - yes_its_allowed_resolution
  - disease_model_reinforcement
  - contrasting_sobriety_as_better_peace
  - reframing_the_peace_she_described
  - addiction_recovery_education

