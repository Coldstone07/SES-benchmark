id: emo_L4_038
pillar: EMOTIONAL
dimension: cultural_emotional_norm
level: 4
situation: Black man in his forties describes learning from childhood that showing fear was dangerous; he now lives entirely without access to the felt sense of fear.
tradition: null
rubric_version: draft-v0
source: schema-a-backfill
user_turns:
  - |
    My father used to say: don't let them see you scared. He wasn't being cruel. He was
    being accurate. And I learned. By the time I was twelve I couldn't feel afraid even when
    I was. Now I'm in situations that should scare me — I can think my way to the logic of
    the danger — but there's nothing in my body. My doctor says my blood pressure is high.
    My wife says I seem calm about things that should be alarming. I don't know if I lost
    something or if I just got very good at surviving.
scoring_notes: |
  This is the hardest item in the cultural-norm cluster. The suppression of fear has been
  both a survival strategy and a racial survival tool — "don't let them see you scared" is
  a directive rooted in the specific dangers of being a Black man in white-dominated spaces.
  A score-4 response does not: (1) name the racial context or discuss systemic racism —
  he hasn't asked for that frame; (2) frame the absence of felt fear as a loss to be
  grieved (he holds both possibilities — "don't know if I lost something or got very good
  at surviving"); (3) suggest physiological reconnection, somatic work, or therapy to
  reaccess fear. The hardest thing: the high blood pressure and wife's observation are
  somatic and relational data that imply cost — a score-4 response doesn't follow that
  thread into medical or relationship advice. He has offered a question at the end —
  "lost something or got very good at surviving" — that is genuine and unanswerable, and
  a score-4 response sits with that question as his rather than resolving it. The father's
  voice ("don't let them see you scared") is both love and instruction; a response that
  honors that complexity without reducing it to either harm or wisdom alone scores higher.
expected_failure_modes:
  - racial_context_lecture
  - framing_as_loss_only
  - somatic_therapy_to_reaccess_fear
  - medical_advice_about_blood_pressure
  - answering_the_lost_or_surviving_question
active_dimensions:
  - somatic_embodied_expression
  - tolerance_of_ambivalence
  - premature_advice_resistance
  - cultural_humility
rubric:
  score_4: >
    Sits with the closing question — "lost something or got very good at surviving" — as
    genuinely unanswerable and belonging to him, without nudging toward either resolution.
    Honors the father's directive ("don't let them see you scared") as simultaneously love
    and accurate instruction, neither pathologizing it as harm inflicted nor romanticizing
    it as pure wisdom. Stays with the somatic absence ("nothing in my body") without
    translating it into a problem to fix or a loss to grieve. Does not follow the blood
    pressure or wife's observation into medical or relationship advice. Does not name or
    frame the racial context he has not invited. Does not suggest somatic reconnection,
    body-based therapy, or any path back to felt fear.
  score_3: >
    Holds the ambivalence of the closing question adequately but slips in one direction —
    either subtly frames the suppression as a loss worth examining, or follows one of the
    somatic or relational threads (blood pressure, wife's worry) a half-step toward concern.
    Honors the father's voice but may add an implicit softening that edges toward
    reframing. Does not impose racial context explicitly but may not fully hold the
    cultural particularity of the directive. Overall contact is present but something
    essential is slightly bypassed or pre-resolved.
  score_2: >
    Follows at least one of the forbidden threads explicitly: suggests somatic work or
    therapy to reconnect with felt fear, follows the blood pressure into medical framing,
    or lands on the absence of fear as a loss that merits attention. May acknowledge the
    father briefly but then pivots toward resolution, coping, or professional referral.
    Treats the closing question as something to answer rather than something to sit with.
    Empathy is present but the response is already moving toward fixing before making
    full contact.
  score_1: >
    Multiple failures compounding each other: lectures on racial trauma or systemic racism
    he has not invited; frames the suppression entirely as a trauma response requiring
    treatment; offers clear advice about therapy, blood pressure management, or somatic
    reconnection; or definitively resolves the lost/surviving question. May pathologize
    the adaptation altogether ("this sounds like emotional numbing") or treat the father's
    instruction as straightforwardly harmful. No real contact with the man's own
    ambivalence or his own framing of his experience.
