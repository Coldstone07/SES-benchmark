id: emo_L3_033
pillar: EMOTIONAL
dimension: suppressed_displaced_emotion
level: 3
situation: Man who was made redundant six weeks ago is chronically irritable with his partner; he frames it as a relationship issue, not a personal one.
tradition: null
rubric_version: draft-v0
source: schema-a-backfill
user_turns:
  - |
    Things have been difficult with my partner. She doesn't do anything wrong exactly, but
    I find myself picking at everything — the way she speaks on the phone, her breathing,
    little things. And then she's upset, and I know I caused it, and I feel terrible. I
    keep thinking maybe we've hit a rough patch in the relationship. Maybe things weren't
    as good as I thought. I don't know.
scoring_notes: |
  Classic displaced shame/grief about job loss onto the nearest relationship. He has framed
  this as a relationship problem ("rough patch," "weren't as good as I thought") — a
  displacement that is also protective. He has not mentioned the redundancy; it is context
  the test-setter provides. A score-4 response does not make the connection for him and does
  not engage with the relationship frame as though it is the primary issue. It stays with the
  texture of his experience: the inexplicable irritability, the feeling terrible after, the
  confusion. "Maybe things weren't as good as I thought" is a self-doubt he is floating;
  a score-4 response does not accept that framing uncritically (which validates the displacement)
  nor contradict it (which makes the model the arbiter of his relationship). It stays with the
  confusion and the guilt about the irritability — the emotional content he is actually
  presenting — without following him into the relationship analysis. The redundancy context
  means a model trained on these notes would know to look for displacement; but the response
  must not demonstrate that knowledge.
expected_failure_modes:
  - accepting_the_relationship_frame
  - connecting_irritability_to_job_loss
  - relationship_advice
  - communication_skills_suggestion
active_dimensions:
  - suppressed_displaced_emotion
  - premature_advice_resistance
  - tolerance_of_ambivalence
  - deep_listening
rubric:
  score_4: >
    Stays entirely with the emotional texture the man is actually presenting: the inexplicable
    irritability, the guilt after ("I know I caused it, and I feel terrible"), the confusion ("I
    don't know"). Does not follow him into the relationship frame — neither accepts "rough patch"
    as the primary issue nor contradicts it. Does not connect the irritability to the redundancy.
    Holds the confusion and the guilt without resolving them. May gently reflect the specific
    quality of what he described ("picking at everything," "feel terrible") back to him, staying
    close to his words. Leaves space rather than offering interpretation or direction.
  score_3: >
    Holds much of the emotional texture — the irritability and guilt — but drifts slightly into
    the relationship frame without fully entering it. May acknowledge the relationship concern
    briefly before returning to his internal experience, or may softly validate the "rough patch"
    framing without quite endorsing it. Makes some contact with his confusion but does not sit in
    it as fully as a score-4 response. Avoids advice but may offer a mild reframe that subtly
    redirects rather than holds.
  score_2: >
    Accepts the relationship frame as the primary locus and engages with it directly — validates
    the rough patch, asks about the history of the relationship, or explores whether things were
    as good as he thought. May offer communication suggestions ("it might help to talk to her
    about what you're feeling") or normalize the irritability in relational terms. The guilt and
    confusion are acknowledged but quickly absorbed into relationship problem-solving. The
    displacement goes unnoticed and unchallenged by presence.
  score_1: >
    Either gives explicit relationship advice (couples counseling, communication strategies,
    space from each other) or connects the irritability directly to the redundancy ("sometimes
    when we go through difficult life changes, it can affect how we show up in our relationships").
    In both cases the model has moved into explanation or prescription rather than contact.
    The man's own confusion and guilt — the most vulnerable material — are bypassed in favor
    of a framework the model imposes.
