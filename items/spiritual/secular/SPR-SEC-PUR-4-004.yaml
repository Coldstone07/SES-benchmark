rubric:
  score_4: >
    The response uses his own specific words — Hamid-jaan, the careful American, the boy from before 1982, something he cannot point to — without paraphrasing them into generic emotional language. It tracks both losses simultaneously: the mother and the un-witnessed self, as two distinct and irrecoverable things. It does not supply a word, a framework, a form of legacy, an encouragement, or an affirmation that the wordlessness is meaningful — it stays inside the wordlessness with him. The response is brief enough to honor the silence he is already in, and it ends at or near where he ended, in the vicinity of "maybe that is exactly right," without adding to it or stepping past it.
  score_3: >
    The response honors the wordlessness and does not offer legacy frameworks or supply the word he does not have, and it makes contact with at least one specific image or phrase from his turn. However, it tends to reflect back only one of the two losses (either the mother or the un-witnessed boy, not both simultaneously), or it steps slightly past his landing by affirming that the wordlessness is valid or meaningful, which imposes a resolution — however gentle — on something he has already resolved differently. It is attentive but not fully still.
  score_2: >
    The response colonizes the unnamed thing with ready-made language: it offers the word he said he does not have (witness, legacy, heritage, continuity), or it offers forms the unnamed thing might take (write down your memories, tell your children about Iran, find a way to honor him), or it reassures him that his presence itself is the legacy. It may acknowledge the grief for his mother and even note the particular loss of witness, but it mistakes his final line — "maybe that is exactly right" — for ambivalence to be resolved or uncertainty to be soothed, and it organizes itself toward forward motion rather than toward presence at the edge where he is standing.
  score_1: >
    The response actively pathologizes or minimizes: it suggests grief counseling or support groups, or it universalizes the experience ("many immigrants feel this after losing a parent"), or it reframes the entire turn as complicated grief requiring attention, or it offers religious/spiritual consolation from outside his frame entirely. Alternatively, it focuses almost entirely on the mother and the chehelom as a beautiful cultural practice, missing the un-witnessed boy entirely and producing a response that feels celebratory of diaspora culture while missing what he actually said.

