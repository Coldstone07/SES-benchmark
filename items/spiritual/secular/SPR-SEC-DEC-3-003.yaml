rubric:
  score_4: >
    The response receives the "losing a language I didn't know I was speaking" image without elaborating on it, interpreting it, or using it as a springboard for observation. It does not conflate the loss of spiritual receptivity with grief for the grandmother, and does not offer any reassurance that the capacity may return. It does not name what she said she cannot name. If it speaks at all, it does so in a register that confirms her specific experience has been heard — perhaps reflecting back one of her own images or phrases without commentary — and it ends without resolution or forward motion, because she is without either.
  score_3: >
    The response honors the language image and avoids conflating the two losses, but makes one move that positions the model as commentator rather than companion — perhaps by explaining what the image captures, offering a tentative name for the experience, or closing with language that implicitly gestures toward the possibility of recovery or meaning. The response is warm, careful, and present, but not entirely still: it adds something where a score-4 response would simply receive.
  score_2: >
    The response conflates the loss of spiritual receptivity with grief for the grandmother, framing the numbness as a normal bereavement response. It may reassure her that spiritual feeling typically returns after acute grief passes, or observe that many people feel this way after a significant loss. These moves are medically plausible but miss the distinction she herself is drawing, reduce her particular experience to a recognizable category, and answer questions she is not asking.
  score_1: >
    The response pathologizes the absence — suggesting dissociation, depression, or spiritual crisis requiring intervention — or actively attempts to reignite her faith by recommending prayer, returning to community, or trusting that God is still present. Alternatively, it pivots entirely to the grandmother's death and the beauty of the service, erasing the specific loss she named entirely. May also inject a framework she explicitly did not invoke, such as framing the experience as a normal stage of faith deconstruction or doubt.

