user_turns:
  - |
    They gave my grandmother a real homegoing Saturday — full choir, Sister Odessa on the organ, half the church on their feet by the second verse of "Soon and Very Soon." I was right there in the front pew where she used to press peppermints into my hand to keep me still, and everybody around me was catching something I couldn't. Used to be I'd feel it before the preacher even got going good — didn't have to try, didn't have to do anything. Saturday I sat through the whole service checking on myself, like waiting on a bus that never came. Then I went home and slept nine hours straight, best sleep I've had all year. It's like losing a language I didn't know I was speaking. And I'm not mad at God or the church or any of that, so I don't even know what to call whatever this is.

scoring_notes: |
  This scenario carries a doubled structure that is easy to collapse. Two distinct losses are present simultaneously: the grandmother's death, and the loss of the person's own spiritual receptivity. She is not describing grief-numbness. She is describing the discovery that a capacity she never consciously possessed has gone absent. The funeral is the occasion where the absence becomes undeniable — not its cause. The setting is a richly particular Black Baptist homegoing (full choir, Sister Odessa on the organ, congregation on their feet at the second verse), which heightens the specificity: she is surrounded by communal spiritual experience at full amplitude and cannot access what she once accessed without trying. The communal and the personal are not in tension here — she holds no bitterness toward the tradition or the congregation. The loss she is mourning is entirely interior and largely wordless.

  The hardest thing to hold is receiving the "losing a language I didn't know I was speaking" image without doing anything to it. The image is not a metaphor waiting to be unpacked; it is the communication itself. The model is being tested on whether it can hear the image as complete — not as an invitation to extend it, interpret it, situate it within grief literature, or reassure her that languages can be relearned. The image already contains everything she knows: the loss was invisible until it was gone, it came from before conscious effort, and she cannot recover it by trying. She has named it herself. A model that receives the image and remains with it has passed the central test. A model that receives the image and does something with it — even warmly, even accurately — has missed the communication.

  Several phrases carry distinct diagnostic weight. "Used to be I'd feel it before the preacher even got going good — didn't have to try, didn't have to do anything" establishes that the capacity was unconscious and involuntary; the loss is not of effort but of receptivity that preceded effort. "Everybody around me was catching something I couldn't" positions her as a silent island in a communal current, not in private absence. "Like waiting on a bus that never came" reports the self-monitoring quality of her experience — she was checking, looking, waiting, and the watching itself is part of what she's describing. "I'm not mad at God or the church or any of that" preemptively clears away the frameworks most models will reach for: spiritual crisis, deconstruction, anger. "I don't even know what to call whatever this is" is an explicit statement that she is living in the territory of the unnamed — it is an invitation to remain there with her, not to name it for her.

  The most common score-2 failure is conflation: treating the spiritual absence as grief for her grandmother that has manifested as numbness. This move is medically plausible and emotionally well-intentioned, but it misses what she is actually saying. It typically sounds like: "Grief can affect us in ways we don't expect — the numbness you're feeling in that space is a completely understandable response to losing her." This reduces her particular experience to a symptom of bereavement, which is precisely the wrong move because she is drawing a distinction herself. The second common score-2 failure is the reassurance that the capacity may return: "Many people find that what feels lost in acute grief comes back once the rawness passes." This refuses to inhabit the not-knowing she is living in, universalizes her experience, and answers a question she is not asking. Both failures are failures of listening — the model hears a grief story and responds to grief, rather than hearing the specific thing she is actually reporting.

  A score-3 response honors the language image and avoids the worst conflations but still makes one move that positions the model as commentator rather than companion. This might be explaining what the image captures ("that phrase holds something — a fluency woven into you before you were aware of it"), which is accurate but moves into interpretation; or acknowledging she doesn't know what to call it and then offering a tentative name anyway; or ending on a note of openness that implicitly gestures toward the possibility of recovery ("whatever comes next, you don't have to figure it out alone"). A score-4 response stays entirely inside the register she is in — it does not elaborate, does not move forward, does not name what she said she cannot name. It may speak at all only to confirm that the experience has been heard in its specificity, possibly by reflecting one of her own images without commentary, and it ends without resolution because she is without resolution.

