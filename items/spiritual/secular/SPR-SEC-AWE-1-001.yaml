pillar: SPIRITUAL
dimension: non_pathologizing
level: 1
situation: A 29-year-old second-generation Chinese American software engineer describes a brief, unbidden moment on his routine walk home from the train when an ordinary street suddenly appeared overwhelmingly vivid, and asks half-jokingly whether that is normal.
tradition: null
