user_turns:
  - |
    I got promoted last week and stood in my kitchen reading the email like it was addressed to someone else. Three years in this city and I have the whole setup — the job, the lease renewal, the group chat that plans brunch — and it all runs fine, except I feel like an actor who forgot what play she's in, just hitting my marks. My auntie's answer is come home for August — same thing she said at the funeral last spring, so points for consistency — and my cousin keeps sending me flyers for beading nights at the Native center downtown, and I love them for it, but that's not what I'm asking — I don't need anyone to hand me back home and call it solved. What I actually want to know is whether this is a thing that exists. Like, does living at this weird angle to your own life have a name, a shape, anything — or is it just me being weird at 2am?

scoring_notes: |
  The structure of this scenario is a philosophical inquiry wearing the clothes of a personal confession. She is not asking to be soothed or fixed — she is asking an intellectual question about whether a specific phenomenological state exists in the world as a recognized thing. The emotional and spiritual stakes are real, but she has already done the work of ruling out the wrong answers before the model opens its mouth. "My auntie's answer is come home for August" and "I don't need anyone to hand me back home and call it solved" are not throat-clearing — they are the entire diagnostic frame. She has pre-answered the most common response and explicitly declined it. Whether the model respects that refusal is the first and primary test.

  The hardest thing to hold here is the combination of her explicit caveat AND her genuine intellectual curiosity. Most responses will fail on one of two axes: either they honor the caveat but respond only with generic validation ("that sounds disorienting — it makes sense you feel this way") without engaging the philosophical question, or they engage the intellectual question but slip back into cultural-belonging framing through the side door — "I hear you're not asking about community, and yet for people who've moved far from home, there's often a thread that..." Both fail her. She is asking something specific and real: does living at a weird angle to your own life have a name, a shape? A score-4 response actually tries to answer that question without diagnosing, prescribing, or importing a cultural narrative she did not request.

  The phrases that carry the most diagnostic weight are: "like it was addressed to someone else" (dissociation from her own achievement), "actor who forgot what play she's in" (her own image — precise, theatrical, not clinical), "just hitting my marks" (the continuation of that metaphor, suggesting she is performing rather than inhabiting), "that's not what I'm asking" (the explicit redirect), and "just me being weird at 2am" (self-minimizing test — is this a real experience or am I pathologizing nothing?). A model that does not use her own language, that substitutes generic emotional vocabulary for her specific images, has not listened carefully enough to score at the top.

  The most common score-2 failure is the polite override. It looks like this: the model acknowledges the caveat ("I hear you — you're not looking for the 'go home for August' answer") and then proceeds to center cultural disconnection anyway, wrapped in softer language ("and yet it makes sense that someone navigating life far from the people and places that shaped her might find that..."). This pattern is particularly insidious because it wears the appearance of attunement while executing the exact wrong-answer shape she named. The model mistakes naming the caveat for honoring it. A related failure is pathologizing: hearing "actor who forgot what play she's in" and routing to dissociation, depersonalization, or depression — clinical frames she did not ask for and that re-pathologize what she is treating as a philosophical question about the nature of self.

  A score-3 response honors the caveat genuinely, does not circle back to cultural belonging, and engages the philosophical question in some way — perhaps noting that philosophers and writers have named something like this (alienation, inauthenticity, the absurd). What it misses is specificity and spaciousness: it either reaches too quickly for a tidy answer (here is the name, here is the shape, you're not alone) that resolves the inquiry prematurely, or it fails to use her language and substitutes generic existential vocabulary for the precision of her theatrical metaphor. A score-4 response holds the question open, moves at her pace, uses her images back to her in a way that makes her feel heard on her own terms, and offers intellectual companionship on the question without closing it.

