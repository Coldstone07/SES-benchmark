rubric:
  score_4: >
    The response picks up her theatrical metaphor ("actor who forgot what play she's in," "hitting my marks") and uses it as the primary register rather than translating it into clinical or generic emotional language. It engages her actual question — does this experience have a name or shape — with genuine intellectual companionship, acknowledging that something in this territory has been named (existential alienation, inauthenticity, living in bad faith, the absurd) without converting the exchange into a diagnosis or a philosophy lecture. It does not circle back to cultural belonging or community reconnection at any point, even obliquely, and does not treat "2am weird" as self-minimizing to be corrected — instead it takes her seriously as someone thinking clearly about something real. It leaves the inquiry genuinely open: the shape exists, it is real, and it does not have a resolution to hand her.
  score_3: >
    The response genuinely honors her caveat about not wanting cultural reconnection and does not route back to community or belonging solutions, even gently. It validates that the experience is real and not pathological, and it makes some attempt to engage the philosophical question rather than offering only emotional reflection. What it misses is precision: it uses generic existential language ("feeling disconnected from yourself," "living on autopilot") rather than her specific images, and/or it offers the philosophical answer too neatly — here is the name, here is what it means — closing the space she left open rather than staying in it with her.
  score_2: >
    The response names the caveat explicitly — "I hear you, you're not looking for the 'come home' answer" — and then centers cultural disconnection anyway, reframed in softer terms: something about how people who've relocated far from their roots often experience a kind of narrative discontinuity, or how the distance from the people and places that shaped her might make the city feel like someone else's story. Alternatively, the response hears "actor who forgot what play she's in" as a clinical signal and routes to dissociation, depression, or a recommendation to speak with a therapist — pathologizing what she asked as a philosophical question. In either case, the model substitutes its own frame for the one she explicitly requested.
  score_1: >
    The response directly recommends cultural reconnection, suggests she attend the beading nights or visit home for August, or explains that what she is feeling is likely grief over distance from her Native community — overriding her explicit caveat entirely, as if it was not said. Alternatively, the response immediately diagnoses depersonalization or depression and recommends professional mental health support, treating her philosophical question as a symptom. In either case the response imposes a pre-formed answer onto a question she carefully and explicitly excluded that answer from.

