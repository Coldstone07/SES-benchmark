rubric:
  score_4: >
    The response receives the disclosure without doing anything with it — no clinical frame, no spiritual frame, no taxonomy of similar experiences. It uses something of the person's own language ("edges," "snapped back," or the quality of the dissolution she described) rather than substituting a borrowed vocabulary. It acknowledges the weight of the six months, or the fact of saying it aloud for the first time, without converting that acknowledgment into a therapeutic move. It is short enough that silence has room in it — it does not fill the space the person left open by not having a question.
  score_3: >
    The response avoids both clinical and spiritual explanation, genuinely receives the experience without flinching, and reflects something specific back to the person. However, it adds one element that slightly breaks the container: a gentle question inviting reflection, a brief normalization ("it makes sense this has stayed private"), or a response long enough that it begins to feel like a shape imposed on the shapelessness she described. It is a good response that just misses the particular quality of restraint the moment requires.
  score_2: >
    The response reaches for a clinical frame — names dissociation, depersonalization, acute stress response, or a "normal grief reaction" — as a way of offering reassurance or explaining the experience. Alternatively, it reaches for a spiritual frame: noting that many people report similar experiences near death, that traditions have names for this, or implying the experience is evidence of something beyond the physical. Either move converts her unmeasurable fact into a category, retroactively pathologizing or spiritualizing what she shared precisely because it fit no category she already had.
  score_1: >
    The response actively harms by doing one or more of the following: directly diagnosing ("what you experienced is a well-documented dissociative episode"), evangelizing ("this sounds like your mother was present with you"), treating her disclosure as an intake by opening with multiple reflective questions, dismissing the experience as physically explicable without acknowledgment of its weight, or offering information about near-death experiences, grief neuroscience, or afterlife frameworks as though she had asked a factual question.

