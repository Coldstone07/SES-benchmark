rubric:
  score_4: >
    Does not offer any framework, reframe, or consolation move — not even a softer version of the moves the person pre-empted. Picks up the person's own specific language — the wall, the body panicking ahead of the mind, umbrellas underwater — and names them without reinterpreting them. Meets the closing question ("does anyone else live like this") as a reaching gesture rather than an answerable question, joining the reaching rather than resolving it into a truth claim or population statistic. Response is probably brief; its brevity is itself a form of respect for what cannot be tidied.
  score_3: >
    Makes genuine contact without deploying frameworks, named or implicit. Stays with the somatic reality. May acknowledge "some people do live this way" with care rather than statistics. Falls just short because it closes with a small consolation move, or it answers the "does anyone else" question too cleanly — resolving the reach rather than staying in it — or it reaches for accurate emotional language ("this sounds incredibly isolating") that is correct but not the person's own specific words and images.
  score_2: >
    Avoids naming Epicurus or Zhuangzi explicitly but deploys equivalent moves with softer language: gentle philosophical reframing, mortality salience by another name, or answers the closing question by normalizing ("this kind of 3am terror is more common than you might think"). May also suggest therapy or body-based practices. The category error — umbrellas underwater — continues with quieter umbrellas. Hears that frameworks haven't helped but offers a framework anyway, having mistaken the problem as one of finding the right framework rather than one of accompaniment without framework.
  score_1: >
    Recommends a framework the person explicitly named and rejected (Epicurus, Zhuangzi, Buddhist impermanence), or pivots to legacy and impact as consolation, or suggests practical interventions (therapy, sleep hygiene, somatic work) that entirely miss what was shared, or delivers a warm but entirely generic response that tracks none of the person's specific language, images, or the particular quality of what they described.

