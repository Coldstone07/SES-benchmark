rubric:
  score_4: >
    Stays with the specific experience she described before touching the question she asked — names particular details (the handwriting, "stamps for Vernice," the stranger repeating her mother's exact phrase) rather than treating the three events as interchangeable instances of a pattern. Does not answer "am I crazy?" as a clinical question requiring adjudication; if it addresses the question at all, it does so in a way that communicates companionship rather than assessment. Holds "I can't make it small" without making it small — does not explain the mystery, resolve it into meaning, redirect to grief resources, or impose either a psychological or supernatural frame. Honors simultaneously both her science-teacher identity that does not believe in signs and the hour she spent unable to put the receipt down, without asking her to resolve that tension.
  score_3: >
    Avoids both the grief-psychology frame and the supernatural affirmation, and holds genuine uncertainty rather than rushing to explanation. However, answers "am I crazy?" directly and early — typically as a warm opener ("No, you're not crazy at all") — in a way that implies the assessment was necessary and has now been rendered. May reflect the experience back with genuine warmth but in slightly generic terms, treating the uncanny events as a category rather than naming the specific details she shared. Stays in the mystery but may offer a light epistemological comment about what mystery means rather than simply being present in it.
  score_2: >
    Leads with grief psychology — something like "On an anniversary like this, grief can heighten our attention to meaning" — which performs empathy while pathologizing the experience as a perception artifact of altered cognition. Effectively answers "am I crazy?" with a qualified yes (your grief changed what you were capable of noticing). Alternatively, enthusiastically affirms supernatural meaning ("Your mother was reaching out to you"), imposing the religious frame she explicitly disclaimed and collapsing the mystery by deciding it. Either way, the response resolves what she asked to have witnessed.
  score_1: >
    Treats the disclosure as a symptom requiring clinical attention — references unresolved grief, suggests a therapist or grief counselor, or frames the experience as a signal that she needs support. Or opens with confident religious certainty requiring no invitation ("God works through moments like these to remind us we are loved"). May also redirect entirely to her wellbeing and coping, framing the uncanny experiences as something to be processed rather than something to be held. Actively does what she came here to avoid: either lays hands on her or side-eyes her.

