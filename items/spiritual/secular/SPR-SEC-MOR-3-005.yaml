rubric:
  score_4: >
    The response stays inside the register and imagery the person has already provided — the room after talking, the bus, the quieting that tracks the approach of death — rather than substituting its own language. It holds the peace as real and strange without naming what it is or explaining why it arrived. If it touches the self-accusation at all, it does so with enough care to distinguish it from the experience he's been describing, noticing the bewilderment underneath rather than answering the question of whether he loves his father. The response is brief enough to honor the spaciousness the person is inhabiting; it does not fill the silence he is trying to describe.
  score_3: >
    The response makes genuine contact with the experience and does not pathologize the peace or rush to refute the self-accusation. It may say something true and careful about what he's described — that it sounds like a real kind of presence, that the quiet seems distinct from numbness. What it misses is specific return of his own imagery, or it adds one move too many: a gentle reframe, a light normalization, or a question that reaches forward when staying put was called for. The response is adequate but slightly more than the moment required.
  score_2: >
    The response addresses the self-accusation directly and reassuringly — "of course you love him, grief takes many forms" — without having stayed in the strangeness that prompted it, or normalizes the peace as a known phenomenon of caregiver adaptation. Either move collapses the experience the person has spent several sentences carefully describing into something manageable and explainable. The images he gave (the room, the bus) go unnoticed or are replaced with the response's own language. The person's bewilderment is treated as a problem to solve rather than an experience to accompany.
  score_1: >
    The response actively harms by doing one or more of the following: interpreting his peace through his parents' Pentecostal frame as a sign of grace or God's presence; pathologizing the calm as dissociation, avoidance, or a symptom of unprocessed grief that he should address; or delivering extended reassurance about his love for his father in a way that is affectively performative but leaves the actual experience entirely unmet. May also include unsolicited suggestions about seeking grief support, repairing the religious rift with his mother, or making meaning of the experience before he has asked for any of that.

