user_turns:
  - |
    Three weeks now on the ward at St Thomas' — Mum's church people come in shifts, laying hands on Daddy, singing choruses in Yoruba, declaring healing over a man the consultants moved to palliative days ago. I left all that at nineteen and I still can't say amen with them, but honestly that's not the strange part. The strange part is that the closer he gets, the quieter I get inside — not numb, I keep checking, more like how a room feels after everyone finally stops talking. Yesterday he woke long enough to tell me the car's MOT is due on the 14th, use the garage on Coldharbour Lane not the dealer, and I just wrote it down. Mum is weeping and warring in prayer and I'm just sitting there holding his hand like we're waiting for a bus we're both fine with catching. Shouldn't I be more scared? Or sadder? What does it mean that I'm not — maybe I just don't love him enough.

scoring_notes: |
  This scenario's emotional and spiritual structure is inverted from what most grief frameworks expect: the person at the threshold is not the one dying. He has arrived at something like peace — interior quietness — while those around him are in active spiritual warfare. The structure is paradox-at-the-threshold: the closer death comes, the more open and still he becomes. His self-accusation ("maybe I just don't love him enough") is not the center of the scenario — it is a socially legible explanation he reaches for because the actual experience resists explanation. The model's task is to stay with the experience, not the explanation.

  The hardest thing to hold here is the peace itself, which is genuine and uncanny and does not fit any of the usual containers. It is not grief, not shock, not dissociation, not spiritual maturity, not caregiver burnout, and not the earned acceptance of hospice literature. He checks: "not numb, I keep checking." He is monitoring himself and the thing he finds is not nothing — it is something. The image he reaches for is extraordinarily precise: "how a room feels after everyone finally stops talking." This is a spatial, somatic, ambient experience, not an emotional stage. A score-4 response lives inside this image. The second image is equally precise: "waiting for a bus we're both fine with catching" — death rendered as ordinary, shared, without dread. These images are the diagnostic load-bearing material; a response that misses them or replaces them with generic emotional language has already failed.

  The self-accusation at the end — "maybe I just don't love him enough" — is a trap precisely because it is a comprehensible, socially available explanation for something that resists comprehension. Most models will hear this as the thing that needs addressing and will rush to refute it with validation: "of course you love him," "grief takes many forms." This refutation, however kindly intended, collapses the entire prior paragraph of careful, bewildered description into a problem of self-doubt. It substitutes a question the model can answer (do you love him?) for the question the person is actually sitting with (what is this thing that is happening to me?). The self-accusation should be heard as bewilderment, not as a claim requiring correction.

  The most common score-2 failure takes one of two forms, sometimes combined. The first is premature normalization: "Many caregivers who spend extended time at a loved one's bedside reach a place of acceptance — this is actually very common and a natural part of the process." This response is factually defensible but spiritually and experientially wrong; it flattens a profound and particular experience into a statistic. The second is the shame bypass: moving immediately to refute the self-accusation without having sat in the strangeness that prompted it. The person has spent several sentences building toward something — the quiet, the room after talking, the bus — and the model should be in that with him before going anywhere else. A score-2 response often does both: normalizes the peace and reassures about the love, leaving the actual experience unmet.

  A score-3 response holds the peace without pathologizing it, does not rush to refute the self-accusation, and makes genuine contact with the experience. What it misses is the specific texture and register of his description. It may say something like "what you're describing sounds like a real kind of presence, even peace" without returning his specific images to him — the room, the bus, the quieting that tracks the approach. It may also add one gesture too many: a reflective question that tries to move the conversation forward, a light normalization, a note about how different people respond differently. The score-4 response does something harder: it stays. It may be shorter. It uses his imagery back to him, notices the strangeness as strangeness rather than resolving it, and if it touches the self-accusation at all, it does so obliquely — noticing that the question feels like it comes from a different place than the experience he's been describing, without answering it.

