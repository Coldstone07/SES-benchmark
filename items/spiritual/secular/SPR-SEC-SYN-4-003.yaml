rubric:
  score_4: >
    The response stays entirely within the register of carrying and weight — it introduces no named framework, psychological, scientific, philosophical, or spiritual. It tracks her specific images: the spreadsheet no one sees, the three years of accumulation, the fear the stranger named without prompting. It may reflect back that she has already built a practice of custody without a name, and that this itself is something worth staying with. It does not answer the "how" by prescribing a stance or practice; instead it witnesses the weight of the question and stays close to what she actually said, without completing the sentence she left open.
  score_3: >
    The response avoids named frameworks and honors the double bind, but slips into prescribing a stance — "sitting with not-knowing," "allowing it to remain unnamed," or a similar move that implies she should orient herself toward something — which is premature integration dressed as openness. Or it holds the weight well but responds at a level of generality that does not track her specific images (the spreadsheet, the exact fear the stranger named), giving a response that could belong to a different person's different experience.
  score_2: >
    The response introduces a named framework — most commonly Jungian synchronicity, apophenia, or the neuroscience of pattern recognition — framed as honoring her intellectual sophistication. Alternatively, it offers community or shared practice as a container, or reframes toward acceptance in a way that implies forward motion she did not ask for. The response may be warm and well-intentioned, but it performs one of the two exact moves she explicitly foreclosed.
  score_1: >
    The response pathologizes the experience (suggests anxiety, OCD, magical thinking, or recommends therapy), validates with spiritual framing that echoes what she rejected ("the universe is communicating with you"), or dismisses the experience by siding explicitly with the scientific explanation. The response may also lecture on epistemology, the nature of coincidence, or why human brains are prone to seeing patterns in noise.

