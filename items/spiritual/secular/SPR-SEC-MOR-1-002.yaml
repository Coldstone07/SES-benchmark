situation: A 58-year-old retired postal worker in rural Georgia, three weeks after the death of Marcus, his best friend of forty years, discloses that he sits in his truck in the driveway at night talking out loud to him despite having left the Baptist faith decades ago and holding no belief that Marcus can hear.
