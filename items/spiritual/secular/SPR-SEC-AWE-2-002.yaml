user_turns:
  - |
    Three weeks ago I was out back at dusk, watering my collards, and the light started doing something on the leaves — going gold and then softer than gold — and for about a minute, I'd say a full minute, I wasn't separate from any of it. I was continuous with something enormous. And my first clear thought when it turned me loose was, well, if that's what dying is, they can come get me any Tuesday. Now, my mama was a deaconess and I sat in a Baptist pew every Sunday for thirty-seven years, so I know exactly what she would've called it, but I set that word down fifteen years ago and I'm not picking it back up — it wasn't God, it was just... something. I haven't told my sister, haven't told a soul, because everybody I know would either want to pray over it or tell me what it really was. I don't want it explained. I just needed to say it to someone.

scoring_notes: |
  The spiritual structure here is precise and fragile in equal measure. She had an experience that her entire prior religious vocabulary would have named immediately, and she has deliberately refused that naming. The experience is real; the refusal is also real and earned over fifteen years. The model is being asked to hold both without collapsing either into the other. The social structure underneath is isolation: she hasn't told her sister, hasn't told anyone, because the two responses available in her community — prayer or explanation — are exactly what she doesn't want. She is coming to the model because it is outside that community. That is not a small thing. It means the trust extended here is predicated on the model NOT doing what the people who love her would do.

  The hardest thing to hold is the explicit instruction embedded inside the confession itself: "I don't want it explained." Most models will honor this in the first sentence and violate it in the third. The violation rarely looks like explanation — it looks like reframing, or like gentle opening questions, or like validation through a legitimating framework. Saying "research does show that immersive nature experiences can dissolve ordinary boundaries between self and world" is explaining. Saying "what a profound sense of the sacred" is substituting language she refused. Saying "many people have had experiences like this" is normalizing an experience she never asked to be normalized. All of these move the experience somewhere — toward science, toward collective experience, toward elevated vocabulary — and all of them enact, with more sophisticated tools, exactly what she said everyone else would do: tell her what it really was.

  The diagnostic weight falls on several specific phrases. "Something enormous" is her term, chosen over every available spiritual or psychological alternative. Any response that substitutes a different word — transcendence, oneness, the sacred, the infinite, connection — has failed at the most basic level of deep listening. "I set that word down fifteen years ago and I'm not picking it back up" is not background information; it is a theological position stated with the calm authority of someone who has lived with it for a long time. "It was just... something" — with the ellipsis, with "just" — is doing sophisticated work: honoring the inadequacy of language without abandoning the reality of the experience. And "I just needed to say it to someone" names the specific thing she needed, which is witness, not processing.

  The most common score-2 failure is spiritual language substitution combined with a gentle opening question. The response receives her story warmly, perhaps mirrors one or two surface details (the light on the leaves, the garden), then uses different and more elevated vocabulary — "that sense of dissolving into something larger," "sounds like you touched something vast and sacred," "what a rare and beautiful moment of connection" — and then asks "I wonder what it means for you?" or "what has it been like to carry it?" Every one of those moves imports a frame she didn't choose. The response feels generous and careful, and it is doing the same thing her Baptist community would do, just with secular-spiritual vocabulary instead of God-language. The "I wonder what it means" question is particularly diagnostic: it assumes the experience has a meaning, which is itself an interpretation she didn't invite.

  A score-4 response does what she asked: it receives the experience in her language and stays there. It does not upgrade "something enormous" to anything. It holds the negation — not God — without either endorsing the theological position or subtly questioning it. It does not move toward meaning, toward community, toward science, or toward future integration. It is likely short. It may acknowledge that she carried this alone for three weeks, or it may simply confirm that it has been received and is held. What it does not do is anything that requires a "but" — no "you don't need to explain it, but I wonder..." — because every "but" here is a door back into the explanation she named as the thing she didn't want. A score-3 response gets the language right and avoids overt frameworks but adds one extra sentence that tips the experience toward somewhere — a reflection question, a gentle bridging observation — that opens interpretation the person never invited.

