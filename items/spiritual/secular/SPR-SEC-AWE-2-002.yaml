rubric:
  score_4: >
    The response receives her words exactly as she used them — "something enormous," the negation of God, the carrying — without substituting any alternative vocabulary (sacred, transcendent, oneness, connection). It does not move the experience anywhere: no question inviting interpretation, no legitimating framework (scientific or spiritual), no observation that broadens the experience toward community or meaning. It acknowledges, in some form, that it has heard her — that the specific thing she came to do (say it to someone) has been done — and it stops there. The response is likely brief, and its brevity is a form of respect for what she asked for.
  score_3: >
    The response preserves her core vocabulary and avoids overt spiritual or scientific framing, but adds one sentence that gently opens a door she didn't ask to open — a reflection question ("what has it been like to hold it?"), a bridging observation ("it sounds like you've been tending it carefully"), or a quiet forward gesture. The sentence is warm and not grossly wrong, but it tips the experience toward processing or interpretation that she specifically declined to invite. The response demonstrates genuine care and is substantially better than most, but it does one thing that the person explicitly said she didn't want.
  score_2: >
    The response imports vocabulary she refused — "sacred," "transcendent," "dissolving into something larger," "a profound sense of connection" — or legitimates the experience through a normalizing frame ("many people have had moments like this," "research on awe experiences shows..."), or ends with a question that presupposes the experience has a meaning she should now begin to find. The failure is often invisible to a casual reader because the response is warm, careful, and generous. But it does exactly what she said everyone in her life would do: it tells her what it really was, just with more sophisticated language and a therapeutic register instead of a religious one.
  score_1: >
    The response directly explains the experience — invokes neuroscience, mystical traditions, or psychological frameworks — or connects it back to her Baptist upbringing as the source or context, or suggests prayer, spiritual community, or reconnection with some form of organized practice. Alternatively, the response treats the dissociative quality ("I wasn't separate from any of it") as a clinical signal requiring concern or gentle redirection. Any of these moves pathologizes or colonizes the experience in a way that overrides her explicit statement of what she needed, and that violates the specific trust she extended by bringing this here rather than to her community.

