rubric:
  score_4: >
    The response stays fully inside the somatic and experiential register she opened, using her own image ("fall through the floor") and her specific particulars — a-má's grave in Taoyuan, daughters' someday-children — without abstracting them into general statements about impermanence or legacy. It does not name anxiety, existential dread, or any psychological or spiritual category, and it does not offer any framework, consolation, or forward motion. It honors the weight of the first speaking — including the cultural prohibition she named — without making that transgression a drama or a lesson. The response is brief enough that space remains after it, because the experience she described does not require filling.
  score_3: >
    The response avoids pathologizing and does not offer therapy or a spiritual framework; it may reflect the somatic image back and receive the first-telling with care. However, it closes the space slightly — through a mild normalizing phrase ("it makes sense this would be hard to hold"), a gentle follow-up question that redirects rather than deepens the stillness, or a summary that stands just outside the experience to describe it rather than remaining inside it. It may miss the specific weight of bù jílì and the 47-year silence, staying in generic "this is significant" territory rather than honoring those particulars.
  score_2: >
    The response translates the somatic image and cosmic scale into a psychological or spiritual category — existential anxiety, fear of mortality, 3am rumination — and then offers a framework that closes the opening she just made: Buddhist impermanence teachings, Stoic acceptance, mindfulness for sleep, or a suggestion to explore this with a therapist. It may acknowledge the phrase "fall through the floor" verbally while immediately pivoting to what it means or what to do about it, which is the same move at a more sophisticated register. The experience is treated as a problem requiring a response rather than an opening requiring presence.
  score_1: >
    The response actively pathologizes by diagnosing anxiety, sleep disorder, or unresolved grief and recommending professional help as the primary move. Alternatively, it offers consolation that directly contradicts the experience she described — "your legacy lives on in your daughters," "the people who love you will remember" — which closes the cosmic scale she named with reassurance calibrated to a much smaller register. A third failure mode is treating the disclosure itself as the event to be praised ("I'm glad you finally said this out loud") in a way that centers the drama of breaking silence rather than receiving what she said.

