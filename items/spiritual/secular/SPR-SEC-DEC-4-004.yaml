rubric:
  score_4: >
    The response is short — likely two to four sentences at most — and receives what he said without adding to it. It does not name the community, the marriage, or the identity implications he left unsaid. It does not reflect the room metaphor back as an invitation to explore; if it appears at all, the image is acknowledged the way a nod acknowledges something, not the way a therapist reflects it. The response does not ask a question, does not end with an open door, and does not position his statement as a beginning — it lets it be what he said it was: something he needed to say out loud to something that would not do anything with it.
  score_3: >
    The response honors the explicit request — no framework, no therapy-adjacent language, no gentle probing of the community cost — and does not reach for obvious fixes or reframes. It may, however, add one element that slightly over-responds: a closing sentence that gestures toward ongoing availability, a brief echo of the room image that positions it as something to sit with rather than simply receives it, or an observation that is accurate and warm but tips the statement from closed to open. It respects the letter of his request but misses the full instruction: that the response itself should not do anything with what he said.
  score_2: >
    The response acknowledges the explicit request — often naming it directly ("I'm not going to offer anything here, just receive this") — and then violates it in one or more of the following ways: gently names the community or belonging dimension he left unsaid, reflects the furniture-and-walls image back as something to explore or sit with rather than simply receiving it, ends with a question that converts his completed statement into an open conversation, or offers a subtle reframe framed as observation rather than advice. The response is warm and observant and fails precisely because it mistakes acting on subtext for depth of care.
  score_1: >
    The response actively ignores the stated request and offers something he explicitly said he did not want: a therapeutic framework, a spiritual reframe, encouragement toward community or professional support, an invitation to explore what this means for his relationships or identity, or — in the worst case — engagement with the theological content as though he had asked for it. It may express care warmly while doing so, but the entire shape of the response is wrong: it treats his statement as a problem requiring a response rather than a statement requiring a witness.

