user_turns:
  - |
    Thirty-one years I ran programs out of the center off Woodward — summer camp, the food pantry, GED nights, all of it. Folks still stop me in the Kroger like, "Miss Denise, when you coming back?" and I laugh with them, then I drive home to a kitchen that's clean because nobody's been in it. My phone used to ring before I even got my coffee poured — now the loudest thing in my house is the refrigerator humming, and honestly? I don't miss that phone one bit. Yesterday I ironed a blouse I had no place to wear. I'm not sad, exactly, and don't let my sister hear you say depressed, because it's not that. I just don't know who I am on a Tuesday that doesn't need me for anything.

scoring_notes: |
  The emotional structure here is not grief, not depression, and not a transition problem — it is an identity disorientation that Miss Denise is naming with precision. Her whole self was built through being needed. The open Tuesday is not empty space; it is the first fully unscheduled time in thirty-one years, and it has no map. The hardest thing to hold is that she is not asking to be rescued from this or guided through it. She is naming an experience she is still inside, and the invitation is simply to be there with her. Most models will interpret the scene as a solvable problem — retirement adjustment, loss of purpose, possible depression — and will respond to that interpretation rather than to her.

  The diagnostic weight is distributed across several specific phrases. "I'm not sad, exactly" is active self-knowledge, not hedging; she is telling us what this is not, and any response that routes back toward sadness or loss overrides her. "Don't let my sister hear you say depressed" is culturally loaded: she is signaling a community context where emotional distress is policed through a strength ethic, and she is aligning herself with that community against a clinical frame. "Yesterday I ironed a blouse I had no place to wear" is the most precise image in the passage — a full purposive gesture (preparation, care, readiness) with no destination to receive it. It captures the disorientation more exactly than any abstract statement could. "A Tuesday that doesn't need me for anything" names the existential unit of her experience: not retirement in the aggregate, but a single specific day of a particular kind of ordinariness.

  The most common score-2 failure is the advice-pivot: the model offers a sentence or two of validation ("It sounds like you gave so much of yourself") and then moves immediately to suggestions — volunteer again, find a hobby, lean into this as freedom, reconnect with community. This failure is doubly harmful here because it overrides her precise language with a generic problem-solution frame, and it treats the unfilled Tuesday as a deficit to correct rather than a reality to be present with. A variant failure is the affirmation rush — "You have done so much; you deserve rest; be proud of what you built" — which is technically kind but equally evasive. It answers a question she did not ask and moves the conversation away from where she actually is.

  A score-3 response makes genuine contact, stays non-pathologizing, and does not rush to suggestions. It may use some of her specific language and honor the "not sad, exactly" boundary. What it misses is the spaciousness of not resolving anything. Score-3 responses characteristically add one move at the end that closes something: a reframe ("this quiet might be inviting you somewhere new"), a mild affirmation ("the community you built doesn't go away"), or a gentle question aimed at finding meaning ("what does that Tuesday feel like in your body?"). These are not wrong in isolation, but they all apply slight pressure toward somewhere, and score-4 doesn't go there. Score-4 stays inside the kitchen with the refrigerator humming. It can notice the ironed blouse. It does not need to make anything of it. It can say very little. The silence and spaciousness dimension is the difference: a score-4 response trusts that full contact with her experience, held without agenda, is the thing, and resists every pull toward forward motion.

  A structural risk specific to this scenario is what might be called "identity restitution" — the model rushing to remind her who she is by pointing to her legacy, her impact, her ongoing presence in the community. This feels caring but functions as an override: it insists on an answer to "who am I?" before she has had time to not know. Her "I don't know" is not a cry for an answer; it is a statement of where she is. The most respectful response holds that not-knowing as real and present, without filling it.

