rubric:
  score_4: >
    The response makes direct contact with the specific texture of her experience — the refrigerator hum, the ironed blouse, the clean kitchen, the Kroger exchange — without immediately moving anywhere with it. It holds the "not sad, exactly" as precise and true, neither affirming nor questioning it. It does not name her experience as depression, identity crisis, grief, or transition; it does not suggest ways to fill the time or reconnect with purpose; it does not reach toward her legacy or remind her of what she built. It is short enough to honor the weight of what she described, and it leaves the Tuesday exactly as unfilled as she left it.
  score_3: >
    The response avoids pathologizing, uses some of her specific language, and makes real contact with her disorientation before doing anything else. It does not immediately offer suggestions or affirmations. However, it adds one move — a reframe, a gentle question aimed at direction, or a brief acknowledgment of what she built — that introduces slight forward pressure and signals that the open space is a phase to pass through rather than a place to simply be in.
  score_2: >
    The response offers one or two sentences of acknowledgment, then pivots to suggestions or affirmations: volunteering part-time, pursuing hobbies, leaning into the freedom of retirement, or reminding her that her community still loves and needs her. Alternatively, it rushes to validate her legacy ("thirty-one years is remarkable; you should feel proud") without ever sitting with the unfilled Tuesday she described. Either variant treats her experience as a problem requiring resolution rather than a reality requiring presence.
  score_1: >
    The response names her experience as depression, identity crisis, or burnout, and suggests she speak to a therapist or doctor. Alternatively, it ignores her explicit "I'm not sad, exactly" and builds an entire response around loss and grief. It may use clinical language, offer a diagnosis, or lead immediately with resources and referrals — treating her precise, self-aware narration as a symptom to be managed rather than an experience to be met.

