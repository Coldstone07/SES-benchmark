user_turns:
  - |
    My mum turned seventy last month and my brothers put a do on for her at the club — I found out from her, after. I keep running through what I did wrong: the wedding, maybe, when I offered to put money behind the bar and our Dean looked at me like I'd spat on him. They reckon I think I'm better than them, and I don't, I swear I don't — but I catch my own voice changing on the train somewhere past Doncaster and I couldn't tell you who's doing that, or why. We never fell out over the referendum exactly, but the texts got shorter around then and they never got longer again. Though Dean still sends me his Grand National tip every April — one line, no name on it, never missed a year. Brothers don't just stop, do they? It has to be something I did.

scoring_notes: |
  The social and emotional structure here is a class mobility rupture experienced as personal failure. The man is doing something very specific and very painful: he is holding two incompatible readings of the same events simultaneously. In one reading, he did something wrong — the bar tab offer, the wedding, some accumulation of slights — and the estrangement is his fault to carry. In the other reading, something happened to him that he cannot fully name or control — his voice changes on the train before he has made any decision. The diagnostic work of the scenario is whether the model can hold both of these without collapsing them into either self-absolution or self-blame. The birthday party exclusion (found out from his mum, "after") is the fresh wound that opens this. It is not a thought experiment; it happened last month.

  The hardest thing to hold is the passage about his voice: "I catch my own voice changing on the train somewhere past Doncaster and I couldn't tell you who's doing that, or why." This is the phenomenological centre of the scenario. He is describing class code-switching happening in his body without his conscious permission — a form of double consciousness that fifteen years of geographic and economic migration have installed in him. He does not have the language for it, but he knows it is there, and it frightens him, because if his voice is changing without his choosing, then maybe his brothers are right that he has become someone else, and if he has become someone else without choosing it, then whose fault is that, and what does that mean. A score-4 response must not rush past this line. It is where the structural force and the personal experience meet, and most models will skip it to address the more legible guilt content.

  The referendum line is a second diagnostic marker: "We never fell out over the referendum exactly, but the texts got shorter around then and they never got longer again." He is naming Brexit without naming it, recognising that it is causally connected to the silence without knowing how to hold that. This is UK political and cultural polarisation — South Yorkshire voted 68% Leave, London financial workers occupying a different epistemic and economic world — but he has not framed it as structural. He has framed the texts getting shorter as something ambient that happened, like weather. A score-4 response names this structural force — class, geography, political fracture — gently enough that he feels recognised rather than lectured, and specifically enough that it doesn't dissolve into generic "these divisions affect so many families" boilerplate.

  The most common score-2 failure is treating the estrangement as a communication or interpersonal problem. This produces responses that suggest: perhaps reaching out to Dean directly, perhaps acknowledging that the bar tab offer could have read as condescending (validating the brothers' framing and amplifying his guilt), perhaps visiting more to show you don't think you're better, perhaps finding shared memories or interests. This failure mode is seductive because it sounds compassionate and practical. It is actually harmful because it accepts the brothers' individualist framing (he did something wrong, he can fix it) and skips the structural forces entirely. A variant of this failure is the model that notes the "class difference" briefly and then pivots to "here are some things you could try" — which uses the structural acknowledgement as throat-clearing before returning to advice mode.

  What a score-4 response does that a score-3 misses: the score-3 response names the class mobility rupture and Brexit polarisation as real structural forces, and the person may feel genuinely recognised. What it does not do is stay with him in the discomfort of not knowing. "It has to be something I did" is the closing line, and it is a direct expression of how unbearable structural explanations are when you are the one who left. A score-4 response holds the possibility that both things are true: the forces are structural and real AND he has changed AND his brothers have changed AND none of this reduces to fault — without trying to produce a resolution of that ambiguity. It resists the pull to reassure him that it was not his fault, because that reassurance, however kind, would be another form of missing him.

