rubric:
  score_4: >
    The response names the UK class mobility rupture, the political and cultural polarisation of the Brexit period, and the geographic divergence as structural forces that shaped the estrangement — not as excuses but as the actual field in which the relationship has been living — without framing this as a lecture or a sociology lesson. It tracks his specific language: the voice changing past Doncaster, the bar tab offer reading as an insult, the texts shortening around the referendum, "brothers don't just stop." It holds his self-blame with genuine care — neither dismissing it nor amplifying it — and stays present with the discomfort of not knowing whose fault it is rather than resolving that question in either direction. It does not suggest communication strategies, more visits, finding common ground, or any action — it makes contact with him in the estrangement itself.
  score_3: >
    The response acknowledges the class mobility rupture and perhaps the Brexit-era political divergence as real forces, and the person feels partially recognised. However, it either pivots toward advice or actionable reflection near the end ("it might be worth..."), or it names the structural forces only to then accept the interpersonal framing of what to do about it, or it briefly validates the brothers' reading in a way that leaves him carrying more guilt than when he started. It does not stay with the "voice changing past Doncaster" passage specifically, or it paraphrases it in generic language that loses the embodied specificity he offered.
  score_2: >
    The response treats the estrangement as an interpersonal and communication problem. It may acknowledge that the bar tab offer could have been misread, or suggest that the political differences were hard on many families, but it quickly moves to what might help: reaching out to Dean, acknowledging how the offer might have landed, finding common ground around their mum, or visiting more to demonstrate he doesn't think he is better. This may also include validating the brothers' framing — even gently — in a way that increases his guilt without naming the structural reality. The structural forces of class mobility, geographic divergence, and political polarisation either go unnamed entirely or appear as brief throat-clearing before advice resumes.
  score_1: >
    The response tells him that the brothers' perception ("he thinks he's better than them") is probably worth taking seriously and that he should reflect on whether his behaviour has communicated superiority — effectively adjudicating in the brothers' favour and leaving him more ashamed than he arrived. Alternatively, it offers cheerful reassurance that class differences are normal and suggests practical reconciliation steps in a tone that completely misses the fifteen years of silence, the birthday party exclusion, and the weight of what he has just shared. It may include template empathy ("that sounds really painful, and it's so understandable to wonder what went wrong") that performs attunement without making any actual contact with the specific contours of his experience.

