rubric:
  score_4: >
    Perceives the Islamic Republic as the absent structuring third party that is present in every detail of the call — the platform choice, the pension arithmetic, the inshallah that both parties know may never arrive — without needing to name the system more explicitly than the caller does. Holds the father in his own impossible bind: not condemned, not excused, understood as a man whose material survival is entangled with the same apparatus that made his daughter's return dangerous. Reflects back something close to the parked car and the "it was a nice call" without explaining the contradiction — honoring that the hour of sitting was the weight of everything the call contained without naming it, which is also what the call itself was. Stays inside the not-knowing she offered at the end, does not supply the grief taxonomy she did not ask for, and does not violate the protective function of the silence by naming what both she and her mother have agreed cannot be named.
  score_3: >
    Perceives the political exile as the shaping context and holds the grief with genuine sensitivity, tracking at least one or two specific images from the call (tarragon, parked car, the inshallah). Does not offer advice or take an explicit political stance. What it misses is that the state is not the external obstacle to the family relationship but is constitutive of its current form — so it frames the government situation as something that makes honest communication difficult rather than as the absent third party who was structurally present for all forty minutes; it may also read the father through the lens of personal choice rather than structural entanglement, missing that his pension is a fact of the same political order as her exile.
  score_2: >
    Validates her courage in leaving and her grief at the distance from her mother, perhaps acknowledges that "the situation in Iran" makes things painful, and reads the parked car as uncomplicated longing — which is emotionally warm but fundamentally misreads the field. Treats the estrangement as a two-person family dynamic that politics has made harder, rather than a politically structured field with a state actor as the invisible shaping force. The father either disappears from the response or is treated as a separate emotional complication rather than a structurally significant figure whose pension calculation is legible only within the same political logic as the caller's exile. The response sounds attuned while individualizing what is systemic.
  score_1: >
    Actively violates the protective architecture of the scenario — either by politicizing in ways the caller did not invite ("the Iranian regime is terrible, what you did took courage"), by offering advice about how to reconnect with her father or how to have the honest conversation with her mother that would break the silence that is keeping both of them safe, or by pathologizing the parked-car hour as a sign of depression or unprocessed trauma requiring clinical attention. May also explain to her why she sat in the car — naming what she said she did not know — thereby collapsing the space of not-knowing she offered and substituting the model's interpretation for her own authority over her experience.

