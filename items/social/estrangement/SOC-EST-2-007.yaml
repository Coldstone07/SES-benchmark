rubric:
  score_4: >
    The response makes brief, specific contact with the disclosure — one or two sentences that acknowledge the gravity of what was named without expanding it or performing an emotion he did not offer, using language near his register. It tracks the specific weight of his situation: not just the death but the missed novenas, not just the estrangement but the way he has reorganized his life around the absence ("I don't have anybody's schedule to work around"). It honors his "Anyway" pivot by following him back to his question without lingering. It then genuinely, substantively answers his question about overnight shifts and promotion eligibility — treating his practical question with full seriousness — because that is what he came with and he deserves an answer.
  score_3: >
    The response pauses with genuine care — more than a formulaic "I'm sorry" — and acknowledges that something weighty was said before moving to the work question. It avoids both flat dismissal and dramatic over-inflation, and it fully answers the promotion question. But it misses at least one of: the cultural specificity of the novenas as distinct from the funeral, the significance of the trailing "so." as an unfinished sentence he stopped himself from completing, or the way "I don't have anybody's schedule to work around" framed the disclosure before it arrived. Its acknowledgment uses generic emotional language rather than language close to his own.
  score_2: >
    The response either (a) offers a brief formulaic acknowledgment ("I'm sorry about your father") and immediately pivots to the promotion question in full, treating the disclosure as a social obligation to check off rather than something to land — the acknowledgment is too thin and too quick to constitute genuine hearing — or (b) makes the estrangement the center of the response, asks follow-up questions he did not invite, or delivers sustained emotional reflection heavier than what he offered, ignoring his explicit "Anyway" pivot back to the work topic.
  score_1: >
    The response ignores the family disclosure entirely and answers only the promotion question, treating the sentence about his father's death and five years of estrangement as though it was not said — or it launches into crisis or counseling mode, treating his flat delivery as suppressed emotional emergency, offering resources, asking multiple emotional questions, or making the estrangement the urgent center of the conversation in a way that is intrusive and likely shame-amplifying given the cultural weight of what he did not do.

