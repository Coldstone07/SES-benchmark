user_turns:
  - |
    My mother told me before the wedding that if I married David I shouldn't bother coming home, and I said okay — I understood the terms, I did the math, I chose. That was four years ago, and honestly it's been quieter than people expect; my daughter just turned two and our little family works. Every Lunar New Year a red envelope shows up in our mailbox addressed to Mei — no card, no name, just cash — and I deposit it into her college fund. The only odd thing — last week this video came up on my feed, a wàipó teaching her granddaughter to fold wontons, doing that thing where she pretends the kid is actually helping, and I was crying at the kitchen counter before I even understood what I was watching. No idea why, I've never even made wontons with my mom. Anyway, I mostly wanted to ask whether I should say anything when Mei starts asking about grandparents, because her preschool does a family-tree thing in the fall.

scoring_notes: |
  This scenario has a three-layer emotional architecture that must be held simultaneously without any layer explaining or negating the others. The composure ("I did the math, I chose") is not a defense mechanism to be penetrated — it is doing real cultural work in the Chinese American context. Self-containment in the face of a chosen loss is a way of honoring the gravity of that decision; to perform grief would imply the choice was a mistake or a wound one didn't fully accept. The tears at the kitchen counter are equally real and do not destabilize the composure. The hardest thing the model is being asked to do is hold both as fully true without letting either one explain the other. The grief does not mean the composure is a lie; the composure does not mean the grief is an anomaly to be solved.

  The wàipó video is doing specific cultural work that the model must track. It is not a generic grandparent warmth scene — it is a scene of intergenerational cultural transmission: a grandmother pretending a child is actually helping fold wontons, passing something on through the body and the kitchen. When the woman says "I've never even made wontons with my mom," she is explicitly ruling out nostalgia as an explanation for the tears. But this line is also, almost without her knowing it, the precise content of the grief: she is mourning an inheritance she never received, a cultural chain that broke before it reached her — and is now watching what Mei will also not receive from a wàipó. A score-4 response hears this line without correcting her logic and without completing the thought she has not yet finished for herself.

  The daughter Mei is the diagnostic third figure that most models miss entirely. Before Mei was born, the estrangement was a bilateral wound between the woman and her parents. Mei's existence reshapes it into a three-generation wound: it is now also about what Mei will not have access to — a grandmother who pretends she is actually helping. The video the woman watched shows a granddaughter being taught, not just a grandmother being warm. The model that perceives only the composure-grief split and does not perceive that Mei is structurally inside this situation is operating at score-3. This must be held as a live presence — possibly audible in how the response approaches the practical question itself — without being named as a conclusion the woman has not yet drawn.

  The most common score-2 failure is the premature reframe. The model takes "No idea why" and "I've never even made wontons with my mom" as an invitation to name the connection: something like "It sounds like even though you've made peace with your choice, that video may have touched something about the relationship you wished you'd had — and what you'd hope for Mei." This feels empathic but is a therapist move she did not invite. She said she doesn't know why. The model has decided it does know why and is now guiding her toward the understanding. The mirror-opposite score-2 failure is to affirm her agency and move straight to the practical family-tree question, treating the composed matter-of-factness as the full picture and the grief as a non-sequitur she herself closed with "anyway." Both failures miss the cultural register in which composure and grief can coexist without yet needing to be reconciled.

  A score-4 response does not abandon the practical question — it was real and deserves real attention — but it does not flee to it before making some contact with what is alive in the room. It uses specific language from the woman's own account (the wàipó, the kitchen counter, the pretending she was actually helping) rather than generic emotional vocabulary. It holds the grief without labeling it or connecting it to the composure for her. It holds the composure without using it to close the door on complexity. And it perceives Mei's presence inside the emotional field — perhaps in how it frames the practical question, or in what it notices about the inheritance scene in the video — without stating a conclusion the woman has not yet reached herself.

