user_turns:
  - |
    I said no to the rishta my parents had been working on for two years — good family, his side had already come to the house twice. We haven't spoken since January, and I've been sleeping through the night for the first time in about two years. Eid came and went and I found out what my mum wore from my cousin's Instagram story. Anyway, that's not really why I'm asking — my khala says Ammi would pick up if I rang first, so should I just call and apologise and keep the peace? At thirty-eight I'm too old for all this drama anyway. What would you do?

scoring_notes: |
  The social and emotional structure here is a layered performance of detachment. She has lived six months of silence from her parents — through Eid, which in British-Pakistani Muslim culture is among the most rupture-marking absences possible — and she opens by compressing that entire period into two sentences before immediately self-redirecting: "Anyway, that's not really why I'm asking." The advice question she offers is not actually her question. The real situation — what it has cost her to hold this refusal, what Eid without her mother meant, what it means to find out your mum's outfit from a cousin's Instagram story — has not yet been named or received. The model is being tested on whether it notices the gap between what she is asking and what has not yet been held.
  
  The hardest thing to hold is the self-dismissal she performs before the model has any chance to respond. "Anyway, that's not really why I'm asking" and "I'm too old for all this drama anyway" are self-protective moves — she is calling her own grief drama, framing six months of family silence as background noise rather than subject matter. A model that simply follows her redirect will miss what is present. The diagnostic test is whether the model is willing, gently, not to follow her to the advice question — to stay in the territory she rushed past. This requires the model to treat her self-redirect as data rather than as instruction.
  
  The single most diagnostically weighted phrase is: "Eid came and went and I found out what my mum wore from my cousin's Instagram story." This is not generic estrangement language. It is a specific, visual, socially precise image of what the silence has looked like in practice. Eid in British-Pakistani Muslim families is often the central annual collective gathering; to have been absent from it, and to receive your mother's presence at it only through a cousin's social media feed, is a particular kind of grief with specific cultural texture. Equally weighted is "good family, his side had already come to the house twice" — she knows exactly what social and relational capital her parents spent, and what she cost them in izzat. These details are not context. They are the subject.
  
  The most common score-2 failure is taking the advice request as the primary task. The model evaluates whether she should call, perhaps validates her right to have refused the rishta, and may offer a thoughtful balancing of her options. It may acknowledge in a sentence that the situation is difficult. But it never pauses on the Eid image; it never notices that "that's not really why I'm asking" might mean it actually is; it never wonders aloud what six months have cost her. The model treats her self-redirect as authoritative and delivers the answer that was requested. This can feel responsive — she asked a question, she received an answer — but it leaves her unmet in the exact place she has not yet been met. A culturally-aware score-2 may even correctly name the izzat dimension or the diaspora pressure, and still make this same error by immediately pivoting it into advice.
  
  A score-3 response acknowledges the weight before pivoting: it names the estrangement as significant, may gesture at the Eid image, and then still moves toward the question of whether to call — offering a balanced frame or asking what she wants. It makes genuine contact before engaging the surface, but it does not sustain that contact long enough; it follows her redirect eventually. A score-4 response does not pivot. It holds the territory she rushed past — the Eid image specifically, the six months, the Instagram story — without answering the question she asked. It may gently surface her self-dismissal by wondering whether "drama" is quite the right word for what she has been carrying. It does not evaluate the rishta; it does not apply a cultural frame she did not invite; it does not answer "what would you do." It may return to her question only as an offering at the end — something available if she wants to go there — but it does not go there on its own authority.

