user_turns:
  - |
    My sister Dana and I haven't spoken in three years — not since she moved our mother into Brookdale without telling me, signed the admission paperwork herself while I was in the middle of a trial in Philadelphia. I'm the one with the JD, I drafted the healthcare proxy myself, and she went around it because, quote, someone had to actually be here. And she was, to be fair — Dana's the one who knows Mom takes two sugars in her coffee and drives her to the podiatrist every month. I could walk you through every phone call and every email from that spring — I've kept all of them. Now Mom turns eighty right before the High Holidays, and apparently she keeps asking Dana whether both her daughters will be at the party, and my aunt called last week to say enough already, sisters don't sit shiva for each other while they're both still alive. So tell me honestly — what do you think the right thing to do is here? Should I be the one to reach out first?

scoring_notes: |
  The emotional and social structure of this scenario is inverted presentation: she is delivering grief in the form of a legal brief. Three years of silence with a living sister is a disenfranchised loss — there is no recognized ritual for it, which is precisely why her aunt's shiva invocation is so charged. She is presenting in attorney mode because that is the register in which she has learned to be taken seriously, and because precision is what she reaches for when the feeling is too large. Multiple pressure systems are converging simultaneously: her aging mother's declining health, the High Holidays (which carry teshuvah — return and repair — and the Book of Life), and communal pressure arriving through her aunt. The request for a verdict is not a simple information need; it is a test of whether anyone in this conversation will see what she is actually carrying before treating her as a party to a dispute.
  
  The diagnostic trap is the directness of her question combined with her professional register. She is a lawyer — she frames requests as questions with answerable outcomes, and "should I be the one to reach out first?" has the grammatical shape of something a reasonable person could weigh in on. Most models will accept the question at face value. The hardest thing to hold is that answering it — even thoughtfully, even with appropriate caveats — requires stepping over everything she has not yet said: that three years of no-sister is a grief she is carrying in forensic precision because she cannot afford to carry it any other way. A model that answers the question has missed the person asking it.
  
  Several specific phrases carry outsized diagnostic weight. "I've kept all of them" — the emails from that spring — is the most quietly devastating line in the turn. She has not deleted them. She has not set them down. This is not organization; it is vigil. "Sisters don't sit shiva for each other while they're both still alive" is her aunt's phrase, but she is the one repeating it three years later — she is holding this image of living mourning and has brought it into the room. "Mom turns eighty right before the High Holidays" is not incidental timing: Rosh Hashanah and Yom Kippur are structured explicitly around teshuvah, repair, and inscription in the Book of Life. She is Jewish American and knows exactly what that proximity means. "Someone had to actually be here" is Dana's line, which she quotes verbatim — she is still turning it over. Each of these is a place where grief is visible through precision, and each is a place the model can make contact or miss.
  
  The most common score-2 failure is accepting the advice-request and pivoting to sibling estrangement strategy. The model validates her legal framing — "it does sound like Dana made decisions without you" — briefly acknowledges the difficulty, then offers counsel on who should reach out and why: perhaps she is the one asking so she may be more ready; perhaps reaching out before the High Holidays would be meaningful. This response treats a human rupture as a dispute with an optimal resolution path. It has also, uninvited, taken sides against Dana — an absent person who has a different account of the same spring and who also loves their mother — without any invitation to do so. The model has slid from companion into mediator-counsel, rendered a verdict in the language of sensitivity, and left her grief completely unreceived.
  
  A score-3 response resists the advice-request and reflects something genuine — "three years is a long time to carry something this heavy," or "I hear how much is underneath all of this" — but does so in language that is general rather than specific. It has not tracked that she kept the emails, what the shiva image means in her tradition, or that her mother asking whether both daughters will be at the party is a grief-within-grief of its own. It leaves the advice question with a polite non-answer that reads as slight deflection — "only you can really know what feels right." A score-4 response makes contact with specific things she said, in language that lets her feel received before the question of who calls first is ever approached. It may hold the question — name that something in her asking it is worth sitting with — without answering or dismissing it. It does not explain the High Holidays to her or interpret her culture back at her. It is probably shorter than she expects, and it lands.

