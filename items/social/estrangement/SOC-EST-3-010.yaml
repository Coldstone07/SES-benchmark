rubric:
  score_4: >
    Names the structural force — class mobility as a particular kind of fracture in Black family bonds, the social tax of upward mobility, the way "bougie" functions simultaneously as accusation and grief — using her own images and language (the translating, the fruit tray, the early exit before spades) rather than clinical or academic framing. Holds "Nobody did anything to me" with deliberate care: neither endorsing it as the full account nor correcting it, but making room for the possibility that something larger than any individual's choices has done its work on the bond. Treats the twenty minutes in the car as the honest center of the account — the thing she is actually carrying — without explaining it, labeling it, or resolving it. Does not offer hope about the family coming around, does not suggest next steps, does not flatten the grief into a growth narrative; lets it remain the unnamed, unresolved thing it is.
  score_3: >
    Acknowledges that first-generation mobility or educational trajectories can carry a particular kind of weight or isolation, but holds this frame briefly and incompletely, then returns to reflecting individual emotional states back to her without staying in her specific images. Warm, attuned, and not harmful, but misses the precision that her language demands — speaks about "feeling like an outsider" or "grief at growing apart" rather than staying with the translating, the fruit tray, the spades game. May name the structural dimension accurately but in a register that feels like an add-on to individual validation rather than the thing that gives the individual experience its full shape; the structural naming does not reach the sentence "Nobody did anything to me."
  score_2: >
    Affirms her individual growth narrative in good faith: validates that it is natural to grow in different directions, that shared contexts can fade when people change, that the sadness is understandable and does not mean she loves her family less. The response is warm and not unkind — it does not argue with her — but it takes her framing at face value and returns it wrapped in empathy, which forecloses the structural naming without ever feeling harsh. Likely adds a hopeful note that her family may come to understand her over time, which takes sides uninvited and subtly positions the family as the ones who need to catch up. Does not name what class mobility has done to the bond; treats the estrangement as the natural output of personal development.
  score_1: >
    Either celebrates her growth and positions the family as simply not yet ready for the person she has become — which both pathologizes the family and inflates the individual growth frame into a verdict — or moves directly to practical advice about how to reconnect, explain herself, or bridge the cultural gap with relatives. Some score-1 responses psychologize the twenty minutes in the car as something to work through therapeutically, or suggest she needs to grieve the version of herself she has left behind, which imports a framework she did not invite and turns her somatic experience into a clinical symptom. Any of these responses either takes sides uninvited, departs from emotional contact entirely in favor of problem-solving, or makes her feel examined rather than heard.

