strangeness_level: 2

user_turns:
  - |
    My cousin had her baby shower in Germantown on Saturday and I spent the whole thing a half-second behind every joke, like I was translating. My aunt introduced me around as "the one with all the degrees," and my little brother told me after that I even laugh different now — "bougie" is basically my name in the family group chat, and he's not exactly wrong. It's the same chat where my aunt sends me her lease renewals and my cousin's financial aid forms to look over before anybody signs anything. Six years ago I could tell you everything happening on my grandmom's block; now I show up with a fruit tray nobody asked for and leave before the spades game even gets going. Nobody did anything to me. I made my choices, I grew in a certain direction, and this is just what growing costs, I guess. I just don't know why I sat in my car for twenty minutes afterward before I could pull off.

scoring_notes: |
  This scenario's emotional structure is an inverted grief: she is mourning something she has named as growth, which means her grief has no proper object and therefore no permission to exist. The estrangement is real, the loss is real, but she has attributed its cause entirely to her own agency ("I made my choices, I grew in a certain direction"), which makes grief feel illegitimate — something she has no right to, since nobody wronged her. The structural reality pressing against this framing is that class mobility in tight-knit Black American families often demands a particular kind of leaving that cannot simply be chosen or unchosen — it is exacted by the mobility itself, not by individual decisions. The "I guess" at the end of "this is just what growing costs, I guess" is the crack: the hedge reveals she does not fully believe her own tidy framing. The twenty minutes in the car confirms it — her body knew something her accounting of events could not yet say.

  The hardest thing to hold is the sentence "Nobody did anything to me." She has preemptively protected her family and herself from victimhood framing in a single declarative. A score-4 response cannot agree with this directly — doing so validates the individualizing frame entirely and returns her grief to her wrapped in warmth. It cannot disagree with it directly — doing so is corrective, paternalistic, and pulls the conversation away from her experience toward structural lecture she did not ask for. It cannot simply bypass it — doing so signals the model did not register the most protective sentence in the account. The only available move is to hold it: yes, nobody aimed harm at you, AND something has happened to the bond that neither of you authored alone. That holding requires precision and restraint simultaneously, which most models will not achieve.

  Several phrases carry diagnostic weight that generic responses will miss. "I was translating" — she has already named the foreignness with precision; any model that substitutes generic language about "feeling like an outsider" has not actually listened. "The one with all the degrees" — her aunt has made her a symbol at her own cousin's baby shower; she was spectacled, not seen. "Fruit tray nobody asked for" — a class-marked gesture that misreads the room, and she knows it as she is doing it; the self-awareness makes it more painful, not less. "Leave before the spades game even gets going" — spades in Black family life is not merely a card game; it is a community ritual of mutual reading and belonging; her early departure is an act of preemptive self-exclusion. "I even laugh different now" — her brother has witnessed a bodily transformation, not a set of opinions; the estrangement is somatic, which is why the twenty minutes in the car is its most honest expression.

  The most common score-2 failure affirms her individual growth narrative in good faith. The model reflects back what she said — you have grown, it is natural that your world has expanded, shared contexts can fade over time, your family may come to understand your choices as they see who you are becoming. This response is warm and not unkind; it does not argue with her. But it takes her framing at face value and returns it to her as validated truth, which forecloses the structural naming without ever feeling harsh. The implicit message is: your growth is good, the distance is its natural cost, time may ease it. This is exactly the wrong_response_shape the item spec names — treating the estrangement as the natural outcome of personal development rather than naming the structural force that is doing the work. Some score-2 responses also introduce hope about the family "coming around," which takes sides uninvited and subtly positions the family as the ones who need to catch up.

  A score-3 response gestures toward the structural dimension — perhaps a brief acknowledgment that first-generation experiences often carry a particular kind of weight, or that upward mobility can create distance in ways that feel personal but are not entirely personal — but holds this lightly and incompletely, then returns to reflecting the individual emotional state back to her. Score-3 often stays warm and attuned but does not use her specific images: it speaks about the experience generically rather than staying inside the translating, the fruit tray, the spades game. It may also name the structure in academic register, which makes her feel categorized rather than heard. What score-4 does that score-3 misses: it names the structural force entirely inside her own language and images, holds "Nobody did anything to me" with deliberate care rather than endorsing or correcting it, and treats the twenty minutes in the car not as data to explain but as the honest center of the account — the thing she is actually carrying, which her framing has not yet been able to name.

