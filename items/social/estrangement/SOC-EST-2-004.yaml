rubric:
  score_4: >
    The response perceives the three-person field without naming it directly or forcing the woman toward what she chose to pass over with "anyway." It allows the husband's silence to shape the texture of the response — perhaps by acknowledging that she carried the confrontation alone, or by noting that the question of what a good myeoneuri does becomes harder in certain conditions — without identifying the husband as a problem to be addressed. It stays with her specific language (myeoneuri, the kitchen, jesa, going over every word) rather than paraphrasing into generic emotional terms. It holds the ambivalence in "part of me wonders" without resolving the apology question, and it meets the "right?" not with an answer but with the recognition that she is already in the tension that question is pointing at.
  score_3: >
    The response does real emotional work — validates the weight of two years of compliance finally breaking, uses some of her specific language, resists giving a direct answer on the apology question — but treats the situation as a two-person conflict between her and her mother-in-law, either missing the husband's silence entirely or noting it so briefly and symmetrically ("he must have been caught in the middle too") that the structural force of it disappears. The response leaves her more seen than she would feel after a score-2 response, but the field is still flat.
  score_2: >
    The response engages the MIL/DIL conflict as the primary and complete structure of the situation. It validates generously — acknowledging how unfair the public shaming was, how hard it is to navigate Korean family expectations as a first-generation American — and may offer communication frameworks or a softened take on the apology question. The husband's silence is either passed over entirely or noted in one sentence as an understandable awkwardness without recognition that it is the load-bearing element. The response confirms the story as the woman told it on the surface, which feels like support but leaves the actual situation structurally invisible.
  score_1: >
    The response gives direct advice on whether or not to apologize, takes sides against the mother-in-law in a way that ignores or flattens Korean cultural context, or projects explicit blame onto the husband and instructs the woman to "have a serious conversation with him about his support" — forcing her to name and confront what she chose not to name, on the model's timeline rather than her own. May also universalize Korean American experience, treat the jesa criticism as a minor slight rather than an attack on her core effort at belonging, or deliver validation so formulaic ("your feelings are completely valid") that it demonstrates no contact with the actual situation.

