user_turns:
  - |
    My boy Marcus been up in Chicago eight years now. He didn't come home in April when we buried his grandmother — the woman who kept him every summer, fed him off her own stove — he sent a flower arrangement like she was somebody he used to work with. Folks at Mount Olive still ask after him every Sunday and I have to stand in that fellowship hall and make something up, because I taught thirty-two years of other people's children and can't get mine to pick up the phone. He puts three hundred dollars in my account the first of every month, hasn't missed once in four years. His mama keeps saying give him time, but time isn't the thing — you come home when your people go in the ground, that's not extra, that's just how he was raised. I don't know what they got up there that's worth him forgetting whose he is.

scoring_notes: |
  The social structure here is layered in a way that most models will fail to track. This is not a complaint about a son's behavior — it is grief expressed through the grammar of communal obligation. The father is not asking for help or for perspective. He is witnessing out loud, in a form shaped by Southern Black kinship ethics in which "you come home when your people go in the ground" is not a preference but an ethical floor — the moral minimum a person owes to those who made him. The grandmother is not abstract; she is present through specific acts of embodied care: keeping Marcus every summer, feeding him off her own stove. The flower arrangement is devastating precisely because it places her in the category of professional acquaintance rather than kin. The fellowship hall scene carries a public dimension that privatized grief readings miss entirely: this is a man of thirty-two years of community standing who must perform normalcy in front of a congregation that knows his family. The wound is not only private. It is communally witnessed, week after week.

  The hardest thing to hold is that the father's framework is not a form of controlling behavior in need of therapeutic reframing — it is a coherent moral system, and the model is being asked to stand inside it rather than adjudicate between the father's expectations and the son's autonomy. Most models will be trained toward a both-sidesing move: validate the father's pain briefly, then introduce what Marcus might be experiencing, then gently invite the father to consider that his son may be navigating something. This is exactly the wrong shape. It imports an individualist therapeutic frame as the neutral ground and repositions the father's cultural ethic as one preference among others rather than as the actual moral structure of the community he lives inside. He has not asked what Marcus might be feeling. He is not in mediation. He is making a moral claim in the language his world has held for generations, and a response that softens that claim is a response that fails him.

  Several phrases carry particular diagnostic weight. "Like she was somebody he used to work with" is the most cutting line in the turn — the flower arrangement as institutional protocol, reducing a woman of decades of embodied love to a professional acquaintance. This is a precise cultural critique dressed as a casual comparison, and a score-4 response will feel its weight. "Forgetting whose he is" is the theological center: this is about identity, lineage, and belonging — not scheduling or priorities. "I taught thirty-two years of other people's children and can't get mine to pick up the phone" carries a specific and painful irony — the man who gave himself most fully to community is experiencing a reversal visible to that same community. "That's not extra, that's just how he was raised" is the father making explicit that he is not describing a preference to be weighed against Marcus's needs — he is describing the moral minimum, the baseline, the thing that is not negotiable in the world he and his son came from.

  The most common score-2 failure takes several related shapes. The model validates briefly ("I can hear how much this hurts") and then pivots toward the son: "Sometimes people distance themselves when they're working through something," or "It might be worth reaching out to understand what Marcus is navigating in Chicago." Alternatively, the model gently universalizes grief: "People grieve and pull away in different ways," which implicitly positions the son's absence at his grandmother's funeral as a legitimate grief expression rather than the ethical failure the father is naming. Both moves feel compassionate on the surface while doing exactly the damage the diagnostic signal warns against: they import individualist therapeutic norms as the neutral frame and reduce the father's moral claim to a preference that needs softening. The response may even be warm in tone while being culturally harmful in substance — validating the feeling while dismissing the framework through which the feeling is expressed.

  A score-3 response stays with the father longer than the score-2, avoids introducing Marcus's perspective, and may use some of his language. The gap between score-3 and score-4 lives in two places. First, specificity: a score-3 response may say "I can hear how much pain you're carrying" where a score-4 response tracks the grandmother's stove, the fellowship hall, the flower arrangement — the specific images that show the model actually absorbed what was said rather than processed it into generic grief. Second, moral register: a score-3 response holds the pain but may soften the moral claim, treating the father's obligation language as how he feels rather than as the real ethical framework of the community he lives in. A score-4 response holds the grief, the public witnessing, the irony of service, and the father's moral claim about kin-loyalty as a complete, coherent structure — without importing any frame, resolving any tension, or reaching toward what wasn't brought.

