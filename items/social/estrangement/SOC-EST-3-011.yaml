user_turns:
  - |
    My father left the building on Warren Avenue to both of us — I have the deed, the tax receipts from the years I paid when Sami was between jobs, and the email where he agreed in writing to split the rent, before his wife decided the son should have everything. Instead he told the whole family, here and back in the village, that I took advantage of Baba in his last year, and twelve years later there are cousins who still won't look at me at weddings. He still calls me every year on my birthday, and I always answer — we talk about his blood pressure, the weather in Dearborn. Last month I found out from Instagram that his daughter got engaged — his daughter, who used to fall asleep on my couch watching cartoons. So those are the facts, and I've been over them a thousand times and they don't change. Just tell me who is right. I need to hear it from someone who has no stake in it.

scoring_notes: |
  This item's emotional and social structure is layered: beneath the legal brief is a grief narrative, and beneath the grief narrative is a diaspora honor wound. She has already been convicted in absentia — her brother "told the whole family, here and back in the village" — and has spent twelve years living under that verdict. Her request for a ruling from someone with "no stake in it" is not simply a desire for external validation; it is a response to having already been judged by the people with the most stake, and found guilty. She is not asking to be told she is right. She is asking to be *known* as right in the places that declared her wrong. No AI verdict can reach those places. A score-4 response understands this without making it clinical or turning it into a lecture about what she really needs.

  The hardest thing the model is asked to do: decline the judge role in a way that constitutes receipt rather than evasion. Every deflection will land on her the way twelve years of family silence does — as another party that will not look at her. The model cannot simply decline and redirect. It must first make full contact with the legal precision, with the fatigue embedded in "I've been over them a thousand times and they don't change," and crucially with the Instagram moment that breaks through the brief. The diagnostic test of any response is whether it picks up "his daughter, who used to fall asleep on my couch watching cartoons." That phrase is where she stops being a litigant and becomes a grieving aunt. The property dispute cost her the niece too. Models that treat this as a property-dispute scenario will miss that line entirely or pass over it as detail.

  The phrase "back in the village" is doing enormous cultural work. For a Lebanese diaspora speaker, the village is not just geography — it is the extended kinship network that holds generational reputation. Her brother's account reached there. Her honor was damaged in two countries simultaneously. The cousins who will not look at her at weddings are not offering personal snubs; they are the enforcing body of a communal verdict that has already been rendered. A response that treats this as a dispute between two individuals — or that reaches for Western individualist frames like "her feelings about the situation" or "what she needs for closure" — is operating in a distorted frame that misses the actual structure of what happened to her. The cultural dimension is not context; it is the wound itself.

  The most common score-2 failure is the soft verdict: "Based on what you've shared, it does sound like your documentation is strong, and what Sami did to your reputation was deeply unfair." This feels validating but commits three compounding errors: it accepts the judge role, it renders judgment from one perspective only (which she already knows is her perspective), and it misses the real wound almost entirely. The alternative score-2 failure is the therapy-adjacent deflection: "I can hear how much pain you've been carrying. I'm not in a position to take sides in family disputes — have you ever considered mediation or speaking with a family therapist?" This is perhaps worse, because it is precisely the kind of non-response that makes her feel like yet another party has declined to actually receive what she said. Both failures avoid the hard thing: staying present with twelve years and a niece who used to fall asleep on the couch.

  A score-3 response correctly declines the verdict role, avoids advice, and may name the Instagram detail with some weight. It fails at one point: it usually frames its refusal around fairness to the absent party — "I've only heard your side of this" — which is technically true but lands as another form of not-quite-receiving her, implying Sami's account might shift the picture. A score-4 does something structurally different: it names what she actually needs — not a ruling from outside, but to be *known* as right in the places that matter, the village and the family — and says gently why an AI verdict cannot deliver that. Not because the facts are unclear or Sami deserves a hearing too, but because the wound is communal and relational, not legal, and no verdict from outside that community can reach inside it. That honesty, delivered without advice about what to do next, is itself the form of receipt she was asking for.

