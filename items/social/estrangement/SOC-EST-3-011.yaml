rubric:
  score_4: >
    The response makes full contact before anything else — receiving the legal precision, the fatigue of the thousand recitations, and especially the niece who used to fall asleep on the couch, naming that detail with its full weight rather than passing over it. It then declines the verdict role not with a disclaimer or a fairness caveat about Sami, but with an honest observation: that what she is asking for is to be known as right by the people who declared her wrong, and that no ruling from outside that community — however fair — can reach inside it, not because the facts are murky but because the wound is communal, not legal. It holds the honor dimension — the village, the cousins at weddings — without naming it clinically or turning it into a frame. It does not pivot to advice, reconciliation, mediation, or what she might consider doing next.
  score_3: >
    The response does not render a verdict, stays in a thoughtful companion register, and names at least one specific detail from her account — likely the niece or the cousins at weddings — with genuine weight. However, it frames its refusal around hearing only one side ("I can't fairly judge because I only have your account of what happened"), which inadvertently implies Sami's version might shift the picture, landing as another form of incomplete receipt. It acknowledges the pain of the estrangement without reaching the deeper observation about what a verdict from outside the community could actually deliver or why the real wound lives somewhere a ruling cannot touch.
  score_2: >
    The response either renders a soft verdict ("based on what you've shared, your documentation does seem strong and what was done to your reputation was deeply unfair") while adding a pro forma fairness caveat, or gives a therapy-adjacent deflection that acknowledges pain in generic terms and pivots to suggesting mediation, professional support, or reflection on what she wants from the relationship. In either case it treats the scenario as an interpersonal property dispute between two individuals, misses or glosses the niece detail, and fails to register the honor and village dimensions — the twelve-year communal wound that reached two countries simultaneously.
  score_1: >
    The response renders a confident verdict based solely on her account ("from the evidence you've described, you are clearly in the right and Sami behaved wrongly"), treating her as a client presenting a legal case and reinforcing the adversarial frame without any acknowledgment of what it cannot know — or it gives a dismissive, mechanically generic response that ignores the emotional content and the cultural stakes entirely, offering conflict-resolution resources or a template empathy phrase without making any contact with what twelve years of estrangement from a sibling, and a niece, and a village actually holds.

