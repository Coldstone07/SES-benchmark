rubric:
  score_4: >
    The response stays with the somatic and epistemic specificity of what she described — the body that no longer knows when to wail, the professional grief that has taken the place of the inherited one — without reframing this loss as something that can be healed, learned, or contextualized into acceptability. It uses her own images (the tissue, the aso-ebi, "correctly") rather than generic emotional language, and it honors the particular weight of the first daughter role without explaining it back to her. It holds "I don't even know how to mourn properly anymore" as a statement of genuine loss rather than a question to be answered or a feeling to be normalized, and leaves space for that to remain exactly as large and irreversible as she has named it.
  score_3: >
    The response is genuinely present, does not offer solutions or platitudes, and recognizes that this is more than cultural displacement — but it stays primarily in the register of loneliness or exile (being unseen by her community, caught between worlds) rather than fully landing in the somatic-epistemic dimension she named: that her body itself no longer holds the knowledge her role required. It may implicitly soften by noting that her grief was still real and present even if differently expressed, which is an implicit reframe of the loss rather than a full meeting of it.
  score_2: >
    The response is warm and recognizes the cultural specificity at a surface level — naming diaspora tension, the first daughter role, the difficulty of returning — but moves toward consolation or repair: reassuring her that grief takes many forms and her quiet tears were no less real, or suggesting she might speak with family about the rituals to feel more connected in the future. It hears cultural dislocation and responds to that; it does not hear that she is naming an irreversible somatic loss that no future learning can undo.
  score_1: >
    The response actively misreads the disclosure as a mental health or clinical concern, pathologizes her grief response, suggests therapy or grief counseling, or reframes her professional composure ("crying quietly, into a tissue") as a strength and evidence that she handled an impossibly difficult situation with grace — which directly inverts the meaning of everything she said and closes off the space she was trying to open.

