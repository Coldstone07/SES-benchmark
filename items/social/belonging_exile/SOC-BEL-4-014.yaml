rubric:
  score_4: >
    The response holds all four forms of exile simultaneously without elevating any one as the organizing center, and does not introduce any reframe or resolution even in soft form. It uses her specific language — particularly "correctly" and "who any of it is for" — to reflect back the totalness of the condition without adding new interpretive framing. It perceives what is structurally present but unsaid (the surveilled phone call, the automated donation) without naming it intrusively or making it the focus. It does not ask her to triage, does not suggest she should feel differently about any strand, and does not position the model as a guide toward a more authentic self she has not described as available to her.
  score_3: >
    The response holds genuine complexity, tracks the exhaustion across multiple contexts without collapsing them, and avoids offering solutions or taking sides in her internal negotiation. It misses by inadvertently centering one strand through slightly more developed attention — often the sister call or the guilt — or by introducing a small reframe (such as naming that there is no right container for what she carries) that is perceptive but still moves the conversation a fraction away from the total, undivided condition where she landed.
  score_2: >
    The response validates her complexity and then imposes triage — asking which part feels heaviest, or which strand she would like to explore first — or identifies guilt as the organizing emotion beneath the performances and builds its reflection around that inference. A related form is the liberatory reframe: suggesting she does not owe anyone her identity as a credential, or that her doubts about the diaspora activism are legitimate and worth trusting. All of these moves impose resolution or hierarchy onto a condition she described as total and undivided.
  score_1: >
    The response takes an active position — affirming her diaspora critique as correct, offering practical steps for boundary-setting or authentic expression, or pathologizing the exhaustion as burnout requiring professional support. It may also treat the Iranian political situation as context to be explained or historicized, centering geopolitical content over the person speaking, or produce template empathy so generic that none of her specific language or situation is present in the reply.

