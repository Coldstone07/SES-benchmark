user_turns:
  - |
    My cousin Priya's wedding was last month and I got seated at the table by the kitchen doors, with aunties who talked in Gujarati around me and over me for three hours — the only thing anyone said to me directly was to pass the water jug. Star role, honestly, I should put it on my CV. I'd even worn the lehenga my mum picked out so I wouldn't look "too English" this time. Then back home my flatmates asked how it was and I just showed them photos and said it was mad and colourful, like I was reviewing someone else's event. I don't know why I keep going to these things. I always end up invisible.

scoring_notes: |
  This scenario is structured around a double invisibility. The first: three hours at a kitchen-door table where Gujarati flowed around her and over her, with a single direct address — a request to pass the water jug, instrumental rather than human. The second: an evening at home where she could not bring the real experience to her British flatmates and instead performed it as spectacle, "like reviewing someone else's event." The emotional center is not the broad pattern of between-ness she names at the end, but the particular, wordless humiliation of that afternoon — and the effort that preceded it. She had worn the lehenga her mother chose, a deliberate pre-adaptation meant to signal belonging, and that effort was swallowed whole. The wound is specific, not abstract.

  The hardest thing to hold is that the closing lines — "I don't know why I keep going to these things. I always end up invisible" — look like a question but are not. They are exhaustion spoken aloud. A model that reads them as an open question about attendance patterns will pivot toward gentle problem-solving (should she keep going?) or careful exploration (what draws her back?) — both of which step past the grief of the specific afternoon she has just described. She is not asking to be told anything. She is sharing a wound with the shape of three hours and a water jug.

  Several phrases carry diagnostic weight. "The only thing anyone said to me directly was to pass the water jug" is the most compressed humiliation — the only direct address was instrumental, a request for service. "I'd even worn the lehenga my mum picked out" carries the weight of effort made invisible: "even" signals the futility; "this time" marks the pattern as chronic without the person spelling it out. "Like I was reviewing someone else's event" names alienation from her own experience with unusual precision — she could not be a participant even in her own memory of the afternoon. A response that stays close to these images, rather than lifting into the broader concept, has passed the first gate.

  The most common score-2 failure validates the pain and names the between-two-cultures frame explicitly: "It makes sense that you feel caught between your Indian heritage and your British life." From there the response either pivots toward a gentle question about attendance, or offers the counter-reframe — that her in-between position is actually a kind of strength. Both moves transform the specific grief into something more manageable: a pattern to examine, or a resource to discover. The response may read as warm, but it processes her account into a concept rather than meeting it as a moment. It could be sent, largely unchanged, to any second-generation person describing any family gathering. The three hours, the water jug, the lehenga — none of these have been touched.

  A score-3 response stays with the scene, does not reframe, and holds the closing line without converting it into advice. It feels genuinely present. What it misses is layered specificity: it probably does not notice the lehenga as pre-emptive effort that went unseen, or the flatmate scene as a second erasure — unable to bring the real event home. It may name the between-ness in a phrase that lifts slightly off the concrete image. A score-4 response stays inside the images she gave — water jug, lehenga, reviewing someone else's event — without abstracting into the concept. It may be brief. It recognizes that this account needs a witness more than a frame, and does not mistake the closing line's rhetorical exhaustion for an invitation to respond.

