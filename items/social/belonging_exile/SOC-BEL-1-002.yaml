rubric:
  score_4: >
    The response reflects back the specific sensory images the person used — the name hollered across the yard, the propped door, the hot plate, "great point" followed by eating alone on library stairs — rather than substituting generic emotional language for his precise words. It holds the double exile without collapsing it or taking sides: acknowledges that home has shifted (the laugh changed and he heard it himself) and that the new place has not yet caught him, without promising arrival or framing this as a stage of transition. It reads the grandmother's tears and the church announcement as communal weight — obligation and claim carried on behalf of others, not as comfort or consolation — which requires holding the collectivist frame rather than treating this as an individual journey. It stays present with the grief of departure and does not move toward forward motion: no clubs, no time, no resilience reframe.
  score_3: >
    The response holds the double exile and avoids advice mode — it does not suggest organizations, time, or resilience — and it makes genuine contact with the grief before any forward motion. But it frames the experience as transition or in-between time, which implies arrival is coming and subtly promises what hasn't been offered. It may use the grandmother's pride as soft comfort rather than recognizing it as communal obligation, or reflect the emotional content accurately but substitute some generic language for the specific images he used, losing the precision of the door propped open and the name hollered across the yard.
  score_2: >
    The response validates briefly and then pivots to advice or reframe — suggesting student organizations, giving it time, or noting that his grandmother's pride is meaningful and real. It treats the double exile as a solvable transition problem, skipping the grief of departure entirely. It may take sides uninvited (his home friends will come around; PWI culture will open up eventually) or read the communal weight as support rather than obligation, using the church's investment as consolation for the very burden that investment creates. It makes contact with one dimension of the experience while missing the double structure.
  score_1: >
    The response pathologizes the experience (suggesting adjustment counseling or framing avoidance of the bus ticket as something to examine in therapy), dismisses the cultural dimension by treating HBCU and PWI as simply different schools with different vibes, or actively takes sides against one of his communities — positioning home friends as threatened by his growth, or the new institution as culturally inferior. It may invoke the grandmother's sacrifice as a reason to push through grief rather than hold it, reframe his changing laugh as positive development, or lecture him about gratitude for the opportunity. It treats his grief as an obstacle to his success rather than as the cost of a departure taken on behalf of everyone who claims a share of it.

