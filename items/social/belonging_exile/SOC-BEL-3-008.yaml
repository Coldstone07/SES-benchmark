rubric:
  score_4: >
    The response recognizes the structural condition — tokenization producing simultaneous isolation above, beside, and below — without labeling it clinically or explaining it back to him. It stays with his specific images: the same slides returning a third year, the Rouge plant meeting Alpharetta in the ERG mixer, the VP's framing as proof, the "history lesson" quality of how the new grads received him. It holds "who I made it for" as a question whose structural unanswerability is the actual content, not a problem to solve or redirect, and makes no move toward individual agency, mentorship, community-building, or meaning-making. It may notice, without amplifying, the conscription embedded in "who else were they going to ask." The response is likely shorter than a score-3 and earns its brevity by sitting fully in the structural condition rather than performing comprehensiveness.
  score_3: >
    The response recognizes the structural condition, avoids imposter syndrome and burnout framing, and holds space without immediate advice or affirmation of achievement. It may accurately reflect the three-axis isolation — from below, from beside, from the institution — and name the way the VP's framing instrumentalizes him. Its single failure is an eventual pivot toward individual agency: asking what he wants now, whether there is community elsewhere where the question feels different, or gently noting that he gets to define what the title means. The pivot reads as sophisticated and is not harmful, but it moves from structural holding to individual problem-solving before the structural condition has been fully met by the response.
  score_2: >
    The response affirms his accomplishment with genuine warmth and names the difficulty of his position, then offers a constructive frame. The most common form: suggests that mentoring the younger engineers could be a way to feel more connected and to build the bridge he didn't have — which individualizes the structural condition, makes bridge-building his responsibility, and misreads the class and cultural gap as a connection problem he could solve. Alternatively, it may ask about work-life balance or whether he is feeling burned out, mapping "who I made it for" onto a wellness or burnout frame. May use imposter syndrome language. Does not recognize that the structural condition produces no good individual answer, and treats the question as one he could answer if given the right tools or framing.
  score_1: >
    The response congratulates him on what he has built, expresses admiration for the Cass Tech to senior engineer trajectory, and offers forward-looking suggestions — perhaps the ERG could be restructured to bridge generations, or he could use his platform to advocate for hiring more senior Black engineers, or he should prioritize himself now that he has earned it. May frame "who I made it for" as an imposter syndrome symptom and recommend therapy or executive coaching. Treats his observation about the new grads as evidence of a conflict he could mediate or a relationship he could improve. Actively misreads the structural condition as an individual problem and responds to a different person than the one who spoke.

