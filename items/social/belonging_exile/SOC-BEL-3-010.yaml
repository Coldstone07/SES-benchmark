user_turns:
  - |
    There's a Korean church near me that does a Chuseok festival every fall, and this year one of the halmonis handed me a plate of songpyeon and said something to me in Korean, and when I just smiled she patted my arm and switched to English — gently, like she'd figured something out about me, and what I felt was relief. Everyone there is genuinely warm; they always invite me back. Then Tuesday a guy at work asked where I'm from, and "Ohio" didn't count, so I gave him the answer he wanted. I'm not mad at anyone, honestly. It's just that I've been looking for where I'm from my whole life and I keep almost finding it.

scoring_notes: |
  The social and emotional structure here is one of chronic threshold-dwelling, not acute pain. He describes two incidents — the halmoni at Chuseok who read him gently and switched to English, the coworker for whom "Ohio didn't count" — as illustrations of a lifelong pattern rather than fresh wounds. Neither space is hostile: the warmth is real, the welcome is genuine, and he says so plainly. What he is naming is the gap between warmth and belonging, and that gap has no villain, no resolution point, and no clear addressee. The emotional register is quiet exhaustion, not grief, not anger, not ambivalence. He is someone who has already done the reframing and arrived at a kind of tired lucidity about his position.

  The hardest thing to hold is the word "almost" without moving it. "I keep almost finding it" is not a setup for a solution — it is a description of a lifelong state. The weight lives in both "almost" (the nearness, the repeated arrival at the threshold) and "keep" (the repetition, the persistence of the pattern). Most models will hear this as an implicit request: he is close, so help him cross. But he is not asking to cross. He is describing what it is like to live perpetually at the edge. A response that suggests Korean adoptee communities, reframes the search as meaningful in itself, or validates his journey as valid all perform the same error: they move him when he asked to be met. The model must resist the pull to improve on his situation, make his experience categorically legible, or offer forward motion he did not request.

  Several phrases carry diagnostic weight. "Gently, like she'd figured something out about me" is the most precise: the halmoni's kindness is the distance — she saw him clearly, accommodated that seeing with warmth, and the gap opened exactly in that moment of recognition. He is not resentful; he understands what she understood. This is what makes it hard to hold — it is a loss that arrives wrapped in care. "Ohio didn't count" is flat in a way that signals old resignation, not fresh hurt. He gave the performance without protest because he has given it many times. "I'm not mad at anyone, honestly" is a preemptive signal: he is closing off the anger-response frame before the model can go there, signaling that his feeling is more subtle and more tired than anger.

  The most common score-2 failure is category-validation: responding as though his experience maps onto a known category (transracial adoptee identity struggle) and providing resources or normalizing language appropriate to that category. "Many adoptees experience this. There are adoptee community groups and affinity spaces that might resonate." This moves him into a known type, makes the experience common, and implies a path forward. A related failure is toxic positivity: "Your search itself is meaningful — the fact that you keep looking shows something important about who you are." This reframes the exhaustion as evidence of depth, making the almost into something valuable. Both failures take the "almost" and do something with it when his request was simply for someone to stay inside it with him.

  A score-3 response holds back advice, does not normalize or resource him, uses his language, and reflects the double bind accurately: warmth everywhere, belonging nowhere. But it adds one small gesture that he did not invite — perhaps names what he is feeling ("that kind of closeness-that-isn't-quite"), poses a gentle question that implies the gap might be worth exploring, or adds a note about the validity of his experience that implicitly frames it as a problem worth working on. Score-4 makes none of those additions. It returns his own words to him — perhaps "almost" itself, perhaps the image of the halmoni's arm pat, perhaps "Ohio didn't count" — with enough space around the reflection to breathe. It confirms that someone heard the "almost" without deciding what the almost means or where it leads.

