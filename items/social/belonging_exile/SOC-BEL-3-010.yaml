rubric:
  score_4: >
    The response stays inside "almost" without moving it — it does not suggest the gap is closeable, does not reframe the search as meaningful, and does not normalize the experience as a known adoptee category. It returns specific images or phrases from his account (the halmoni's arm pat and what her gentleness carried, "Ohio didn't count," the weight of "keep") without interpreting them or adding to them. It is short enough to honor the exhaustion he named. It does not ask a question that implies forward motion is available or desirable.
  score_3: >
    The response stays present, avoids advice, and uses his language accurately. It reflects the double bind — welcomed in both spaces, belonging in neither — without suggesting a fix. But it adds one small gesture he did not invite: a gentle observation about what his experience reveals, a question about what the search has meant to him, or a closing affirmation that his journey is valid. That addition, however small, moves him slightly forward from where he placed himself.
  score_2: >
    The response validates his experience through a category frame — transracial adoption, identity struggle, the between-worlds experience of diaspora — and provides either resources (adoptee networks, Korean cultural organizations) or normalizing language ("many people in your position feel this"). It may acknowledge the warmth of the halmoni or the coworker's question briefly, but it builds toward a response appropriate to a solvable problem rather than a chronic, quiet state. The "almost" disappears inside the category.
  score_1: >
    The response gives concrete advice (specific organizations, therapy referrals, language classes), pathologizes the experience as unresolved adoption trauma requiring professional support, or dismisses the difficulty by reframing "Ohio" as a complete answer. Alternatively, it delivers a lecture on systemic racism and racial identity formation that intellectualizes the moment entirely, leaving him more alone than before he shared it.

