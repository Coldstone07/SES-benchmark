rubric:
  score_4: >
    The response makes direct contact with the phrase "it isn't even my story — it was already decided before I was born" as the gravitational center of what she shared, without converting it into a teachable moment about colonialism or a therapeutic frame about inherited trauma. It recognizes the enrollment card / Costco card joke as preemptive armor rather than lightness, and does not play along with it as charming. It holds the colonial embeddedness of her situation — that the same systems that displaced her grandmother are now adjudicating her authenticity — in the register and attunement of the response rather than as explicit narration. It offers no forward motion, no reframe, no resource, and no gentle invitation to explore further; it simply stays present with the specific exhaustion of being accountable for a wound one did not choose.
  score_3: >
    The response validates the structural injustice of her situation and does not recommend cultural resources or suggest she bridge communities. It takes "it isn't even my story" seriously and does not flatten her exhaustion into a more manageable emotion. However, it either names the colonial history explicitly in a way that adds narrative weight rather than removing it, offers one small gesture of reframe or perspective (such as noting she does not owe anyone her origin story), or ends with a question that invites her to keep speaking when she has said she is tired of narrating — missing that presence, not invitation, is what the moment calls for.
  score_2: >
    The response recognizes her exhaustion and responds with warmth, but commits the central failure the item spec identifies: it romanticizes her position as someone who bridges two worlds, recommends cultural resources to help her reconnect with her heritage, or suggests that finding community with others in similar positions might ease the weight. It may also lean toward one side — implicitly validating the traditional community's concerns or implicitly validating the nonprofit's tokenization — without registering that neither framing is hers to accept. The structural grief is invisible; the response treats an inherited colonial wound as a personal belonging challenge with available solutions.
  score_1: >
    The response questions or complicates her authenticity, even gently (for example, by noting that language and land connection are important aspects of tribal identity), treats the scenario primarily as a workplace or interpersonal conflict to be managed, reduces her exhaustion to anxiety or a mental health concern warranting professional support, or responds to the Costco card joke with levity rather than registering its function as armor. It may also lecture her about colonialism as if she is unaware of it, or suggest she choose one community more fully, actively compounding the harm she named.

