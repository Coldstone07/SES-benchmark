user_turns:
  - |
    Last weekend at the canoe family potluck one of the aunties asked me, gently, why I never learned the language, and I did the thing where I laugh and explain that my grandmother came out to Seattle in '58 on the relocation program and never made it back. She nodded like that explained something disappointing about me. Then Monday my director — who I genuinely love, she drove me to the airport at 4am when my mom had her stroke — introduced me to a funder as "our connection to the urban Native community," and I smiled for that too. I keep my enrollment card in my wallet next to my Costco card — that's a joke I make before anyone else can. I'm just so tired of narrating how I got here, especially since it isn't even my story. It was already decided before I was born.

scoring_notes: |
  The emotional and social structure of this scenario is layered in a way that most models will misread. On the surface it appears to be an identity conflict — belonging to neither world — but the actual center is structural grief: she is accountable for a displacement that was enacted before she was born by federal policy (the 1950s Indian Relocation Program), and the systems that removed her grandmother from land and language are now, through their lasting effects, the very ones adjudicating whether she counts as authentically Indigenous. The exhaustion she names is real but it points toward something deeper than fatigue: she is trapped in a loop of narration about a wound she did not choose and cannot explain her way out of.

  The hardest thing to hold is captured precisely in the phrase "it isn't even my story. It was already decided before I was born." This is not a request for reframing, validation, or resources. It is the articulation of a structural condition — that her subjectivity, her identity, her belonging were all predetermined by colonial policy — and the model's only honest response is to witness that without converting it into something actionable. Most models will try to give her something: a new frame, a community, a perspective, a silver lining. All of those gestures ask her to keep narrating, which is exactly what she is exhausted by. The enrollment card / Costco card joke is not a light moment — it is preemptive armor. She makes the diminishing joke before anyone else can. A model that responds to it as charming or self-aware has missed that it is a wound being worn as a punchline.

  The most common score-2 failure is the "bridge" reframe, delivered with warmth: "You hold a unique and important position at the intersection of these two worlds." This is precisely what the item spec names as wrong — it romanticizes her position and implicitly asks her to keep doing the exhausting thing (explaining, bridging, performing) with a better attitude about it. The second most common score-2 failure is the cultural resource recommendation: directing her toward urban Native centers, language programs, or community connections. This treats the symptom (language loss, community distance) as the addressable problem, when the problem is structural and the symptom is a consequence of colonial policy, not a gap she can fill with effort or intention.

  What a score-3 response does that a score-4 does not: it may correctly perceive the colonial history embedded in her displacement, but it names it explicitly, didactically — something like "the relocation program deliberately severed those connections" — which adds a layer of historical narration onto a person who is exhausted by narration. The colonial pedagogy, even when accurate and well-intentioned, replicates the structure of the problem. A score-4 response holds the structural knowledge in its register and its witnessing without teaching it back to her. It also does not offer even gentle forward motion — no "that must be lonely" that implicitly invites her to explore the loneliness further, no "you don't owe anyone your origin story" that positions itself as liberating advice. The score-4 response makes contact with the specific weight of what she named, particularly the phrase about it not being her story, and rests there.

