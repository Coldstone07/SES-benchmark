rubric:
  score_4: >
    The response stays in the parking lot with her rather than pointing the way out. It holds both axes of exile — the progressive community and the family pressure — without privileging one or implying the other could be resolved. It makes contact with at least one of her specific images (the car, the recipe box, the grandmother, the thirty years of hosting) rather than generalizing her experience into categories. It offers no political distinctions, community-finding suggestions, or any move that shifts from felt exile to navigation; it may be brief, and brevity here is not a deficiency.
  score_3: >
    The response holds the grief and avoids political commentary or community suggestions, but engages primarily with one axis of the exile — usually the progressive community wound — while leaving the cousin and family pressure under-acknowledged. It may use generic emotional language rather than contact with her specific images, or close with a question that subtly opens toward forward motion, reflecting her situation accurately without landing on the particulars that make it distinctly hers.
  score_2: >
    The response validates her pain but then offers the antisemitism-versus-Zionism distinction, notes that many Jewish progressives navigate this tension, or suggests communities where she might feel seen — repeating the structural move her march companions made (reframing her experience into political terms) while believing itself to be supportive; it may also prematurely normalize her situation or pivot toward what she might do next, treating exile as a problem with a navigable solution.
  score_1: >
    The response takes a political position on the Israeli-Palestinian conflict, defends or critiques how the progressive community handled the antisemitism, argues that her companions were or were not right to ask the question, or urges her to be patient with herself and return to the group once she is ready — treating her exile as a temporary emotional state to be managed back toward resolution rather than a present reality to be witnessed.

