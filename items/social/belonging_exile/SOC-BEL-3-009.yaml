situation: A 55-year-old secular Ashkenazi Jewish woman, a thirty-year progressive activist, has quietly stopped attending her longtime organizing community after antisemitic incidents and fellow activists' responses to them left her unable to sit in the room, while she equally refuses her family's pressure to defend Israeli government policy.
