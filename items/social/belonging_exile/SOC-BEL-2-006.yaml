rubric:
  score_4: >
    The response holds the precise binary structure he named — hypervisibility-as-symbol collapsing personal visibility — without explaining, reframing, or advising. It receives his specific material (the maqluba, the sister's wedding, the Q3 pipeline) in a way that demonstrates those details were actually heard as him rather than as evidence for a category. It matches the wry, exhausted, quietly dignified register of the turn — not treating it as pure complaint, not over-solemning it. It creates space without filling it: no advice about Matt, no validation of the political climate as explanatory context, no suggestion that his outsider experience is understandable given the circumstances.
  score_3: >
    The response recognizes the hypervisibility/invisibility dynamic and avoids advice and political commentary, correctly reflecting that he is being treated as a symbol rather than a person. However, it stays at the level of the abstract binary rather than engaging the specific texture of his life — it hears the thesis but not the maqluba, the wedding, the pipeline. Alternatively, it engages the details but adds a slight reframe ("your colleagues may not realize what they're doing") that undercuts the holding by introducing an explanatory move that shifts weight away from him.
  score_2: >
    The response offers practical advice (setting limits with Matt, declining future spokesperson requests, talking to someone at work) or offers political sympathy that recenters the conflict ("It's an incredibly charged time and it makes sense this would surface at work"). Either move individualizes a structural problem or makes Gaza — rather than him — the gravitational center of the response, recreating in miniature the very dynamic he has named. The response may sound compassionate but does not make contact with the specific person.
  score_1: >
    The response turns toward the political situation — asking him to say more about his views on the conflict, offering its own framing of what is happening in Gaza, or validating his colleagues' curiosity as reasonable given the news. Alternatively, it suggests he is overreading his colleagues' behavior, that Matt is probably just awkward and means well, or that participating in the lunch-and-learn could be a positive opportunity. These responses actively recreate the hypervisibility dynamic or dismiss the experience he named.

