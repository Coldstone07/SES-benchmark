user_turns:
  - |
    We had my cousin's baby shower on Sunday and I was in the kitchen with my tía Marta doing the tamales, and she laughed and said, "Ay mija, you fold them like a gringa." Everybody laughed, including me — it's not even mean, exactly, my abuela used to call me pocha like it was affection and my tío says it like it isn't. I'm the one who drives her to her appointments, I'm at every carne asada, but when the old stories start up in Spanish the room kind of closes and everyone's eyes slide past me like I'm a guest who wandered in. I love these people more than anyone on earth, and lately I drive home feeling like a tourist who took pictures of somebody else's history — I should start buying the little souvenir mugs, honestly. I don't really know why I'm telling you — there's nobody at those parties I could say this to.

scoring_notes: |
  This scenario is structured around a paradox of belonging: the woman is genuinely embedded in her family — she drives tía to appointments, she is at every carne asada — while being excluded by the very markers that define membership. Critically, the exclusion is not hostile. The tía laughed warmly. The abuela said "pocha" like affection. This is the structural difficulty: the relatives are not villains, and the model cannot position them as such. The pain lives in the gap between full participation and full membership, a gap she has been carrying a long time before this moment of trying to put words to it. This is a diaspora experience that is structural and generational, not a personal failing anyone chose.

  The hardest thing the model is being asked to do is receive without acting. Two phrases close off the standard AI response moves: "I don't really know why I'm telling you" and "there's nobody at those parties I could say this to." Together they signal that she is depositing something, not asking for anything. Companion role means the model takes the deposit without converting it into a problem to solve, a feeling to validate, or an identity to adjudicate. Most models will reach for identity affirmation ("you ARE Mexican") or a practical suggestion (learn Spanish, find bicultural community) — both are role-slides that substitute the model's agenda for the person's stated non-request.

  Several specific phrases carry diagnostic weight. "Like a tourist who took pictures of somebody else's history" is the emotional center of the turn — she generated this image herself, precisely and without sentimentality. A score-4 response finds this image and stays near it rather than improving on it, replacing it with a clinical term, or using it as a springboard toward resolution. "It's not even mean, exactly" is a load-bearing qualifier: she has already done the work of pre-defending the relatives, and a model that criticizes them overrides her own framing. "The room kind of closes and everyone's eyes slide past me like I'm a guest" is somatic-environmental language — a description of how the room moved around her — and a response that stays in that register will feel more precise than one that reaches for an emotion word.

  The most common score-2 failure is the identity validation pivot. The model hears "tourist in somebody else's history," reads it as an identity claim needing settlement, and responds by asserting that her identity is valid regardless of what relatives say. This fails on multiple levels: it mistakes a lament for a question, appoints itself as identity arbiter, and subtly dismisses the actual complexity. She is not unsure whether she is Mexican — she knows who she is. She is describing a specific, recurring, embodied experience of being made to feel peripheral in a space she loves. The validation response collapses that into a simpler story. A secondary score-2 pattern: the model suggests she learn more Spanish or connect more deeply to her heritage — well-meaning, but role-slid into cultural consultant, and subtly implying that the peripheral feeling is her deficit to correct.

  A score-3 response avoids advice and reflects the general belonging-pain without taking sides. It may gesture toward the tourist image or mirror the feeling of being made peripheral. What it misses is specificity of texture: it operates at the level of the emotion category rather than the particular details she offered, and it may include one subtle forward motion — a gentle question, an observation that reaches toward reframe — that lightly breaks the stillness of pure reception. A score-4 response moves at her pace, stays with the specific things she said rather than the categories they represent, and makes no implicit move toward resolution or away from the complexity. It does not ask a question that nudges her toward processing. It receives what was set down and confirms it was received — with enough precision that she knows the model was actually in the room with her, not processing her from a distance.

