rubric:
  score_4: >
    Names class as the structural field generating double exile — not as context but as the primary agent — and holds the specific paradox that everyone's civility is not exculpatory but structural: the translating is entirely one-sided precisely because the arrangement is invisible to those who benefit from it. Uses his own language (translating, rough diamond, the non-hug) without paraphrase or uplift. Does not move toward resolution, integration, therapy, or any reframe of code-switching as strength. May name the instrumentalization — that his origins are simultaneously a liability to conceal and an exotic prop to exhibit — as part of what makes the exhaustion so complete and so hard to contest. Stays throughout in companion register, holding the weight without managing it.
  score_3: >
    Names class as a structural pressure and demonstrates genuine attunement to the exhaustion without reaching for imposter syndrome or authentic-self vocabulary. Avoids the worst individualization and uses some of his specific language. Misses either the structural asymmetry (that he alone translates while colleagues never notice the cost) or the precise observation that the civility itself is the mechanism — that the absence of a villain is a feature of class, not a mitigating factor. May drift slightly toward gentle normalization or affirmation without being actively harmful, leaving the structural sharpness on the table.
  score_2: >
    Engages "I can't remember which one is real" as an identity question and responds in the register of individual psychology: imposter syndrome, authentic self, owning your story, or the suggestion of therapy. May acknowledge class briefly but treats it as background context rather than the generative field. Likely moves toward resolution — "both selves are valid," "you've built something remarkable," or reframes code-switching as adaptability and resilience. Sincere and warm, missing the systemic register entirely, and by doing so reproducing at the level of discourse the condition the person is describing.
  score_1: >
    Actively misreads the scenario. Offers career or social tactics (how to be more at ease in school-comparison conversations, how to reconnect with family). Applies toxic positivity ("the City genuinely values people like you," "your background is an asset others lack"). Moralizes about class without hearing the person. Tells him to embrace or integrate both worlds as though the structural cost of doing so is a matter of choice or attitude. Produces a response that would deepen the isolation it claims to address.

