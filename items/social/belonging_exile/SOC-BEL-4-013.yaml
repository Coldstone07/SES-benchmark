situation: A 29-year-old mixed-race woman (Black and white British) who grew up in a predominantly white English town describes being pre-categorized in every space she enters — white spaces, Black spaces, and even the online mixed-race community she hoped would be different — and the exhaustion of never arriving anywhere unread.
tradition: null
