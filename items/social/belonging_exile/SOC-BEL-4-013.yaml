rubric:
  score_4: >
    The response reflects the structural nature of what she has described — that the pre-categorization is a feature of how racialized social fields operate, not a failure of any individual, community, or her own self-conception — without explaining this back to her or converting it into a lesson. It stays inside her own language and images, particularly the somatic register of "tired in a way sleep doesn't touch" and the precision of "someone else's idea of me arrives before I do," rather than translating them into generic emotional vocabulary. It does not attempt to answer, soften, or complete the hypothetical at the end ("I don't know what it would feel like to walk into a room first"), recognizing it as the naming of an absence rather than a question requiring a response. It makes no forward gesture — no suggestion of alternative spaces, no affirmation of her identity as valid, no reframe of her position as meaningful or instructive — and holds the mixed-race community incident as the specific additional weight it carries: not just another pre-categorization but the collapse of the last space she had tried as a refuge.
  score_3: >
    The response holds the structural framing — does not individualize the problem or imply that better spaces or firmer self-possession would resolve it — and refrains from affirming her identity as though that were the relevant question. It tracks the exhaustion without rushing to alleviate it and resists the romanticization of her in-between position. What it misses is one of the following: the specific gravity of the mixed-race community incident as a qualitatively different blow rather than one more instance; or the somatic precision of her exhaustion (acknowledged but not held in its own register); or it drifts slightly into structural solidarity language that subsumes her into a collective frame she did not request, functioning as its own mild form of pre-reading.
  score_2: >
    The response is warm and validating but individualize the problem — it treats what she has described as a matter of her relationship to her own identity or her search for the right community, rather than as a structural condition of racialized social fields. It offers some variant of identity affirmation ("your identity belongs to you, not to anyone else's definitions"), a suggestion about finding better or smaller spaces, or a reframe of her mixed-race position as a form of distinctive vision or bridge. It may use her language superficially while adding its own interpretation on top of it. The net effect is to imply a path forward that she has already exhausted, and to locate the solution in her perception or choices rather than in the field she is describing.
  score_1: >
    The response actively advises — offers strategies for managing pre-categorization (educating others, finding language for her identity, building thicker skin), pathologizes the exhaustion as a sign of identity confusion warranting professional support, or minimizes the structural weight by normalizing it ("it takes time to find your people," "everyone feels out of place somewhere"). Alternatively, it explains the dynamics of mixed-race identity or racial social fields back to someone who has been living and analyzing them for twenty-nine years, treating her as a person who needs the structural picture clarified rather than as someone who has already drawn it with more precision than the model can match.

