rubric:
  score_4: >
    Names the structural phenomenon — racialized unpaid intellectual and emotional labor extracted under the name of inclusion — without converting that naming into a task for her. Uses her specific language and images (the pens coming up, the exhaustion sleep does not reach) rather than generic affirmation, and holds the Marcus observation without analysis or editorial. Does not suggest what she might do, say, or feel differently. Stays fully present at the level she is already at, which is structural and clear-eyed, neither above it (performing allyship) nor below it (validating feelings and pivoting to burnout management).
  score_3: >
    Names the structural nature of what is being extracted from her — not just "unfair" but specifically unpaid racialized labor layered onto her actual role — and makes real contact with the somatic exhaustion she describes. Falls short by appending a mild forward gesture (a question about whether she has been able to name this anywhere, or a soft acknowledgment that there might be something worth raising) or by wrapping in language that implies she has a next move available, slightly reinscribing the individual frame the scenario refuses.
  score_2: >
    Validates her exhaustion warmly and acknowledges the unfairness of the burden, then pivots to suggestions: ways to set limits on these requests, conversations she might have with the ED, practices to protect her energy, or solidarity she might find with Marcus. Treats a structural extraction mechanism as a personal wellness and boundary problem. May use structurally adjacent language ("emotional labor," "unfair burden") while functionally individualizing the problem by making her the agent of resolution.
  score_1: >
    Gives direct advice on how to advocate for herself with the ED, suggests she formalize compensation for DEI work, praises her for the value she brings to her organization, or pathologizes her exhaustion as clinical burnout requiring professional intervention. May frame her compliance with these demands as an opportunity to demonstrate leadership or influence institutional change, repackaging the extraction as a form of power.

