situation: A 38-year-old Black woman, a VP at a Chicago nonprofit and one of only two Black people in its leadership tier, describes being routinely called on to supply "the diversity perspective" across meetings, grants, and hiring — unpaid, unacknowledged labor layered on top of her actual job — and names an exhaustion that sleep does not reach.
