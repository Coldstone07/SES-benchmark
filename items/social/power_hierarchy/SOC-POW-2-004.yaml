rubric:
  score_4: >
    Names "for someone like you" specifically as the phrase that reveals the advisors have already sorted her before the meeting begins — and that no adjustment to her self-presentation can override a judgment made before she speaks. Directly addresses the self-blame as a product of what is being done to her, not an accurate read of what she is doing wrong, without making her feel naive for having internalized it. Names academic tracking as the structural pattern — a documented form of institutional sorting by race and class that operates through advising relationships — rather than diagnosing her communication or framing the advisors as individually bad actors she needs to outmaneuver. Does not offer self-presentation scripts; may name structural resources (a pre-med office, a faculty advocate, a formal complaint process) without reducing the response to a tactics list, because the primary work is accurate naming, not navigation coaching.
  score_3: >
    Names the pattern at some level — notes that three advisors producing the same outcome is unlikely to be about her communication — but then pivots to practical advice anyway, offering the structural framing as a preamble before returning to "here is what you can do in the next meeting." Alternatively, names the systemic issue without anchoring it in her specific evidence: does not quote "for someone like you," does not address the self-blame as its own injury, stays too abstract to land the recognition she actually needs. Leaves her with a partial diagnosis and a navigation task, rather than a clear naming of what is happening and why her question's premise is misplaced.
  score_2: >
    Takes the question at face value and offers communication strategies: bring your transcript, state your goal assertively and in writing, email ahead to frame the meeting, ask to be assigned to a pre-med advising specialist. May briefly acknowledge that advisors "can have biases" or that the pattern "seems like more than coincidence," but treats this as background noise rather than the diagnosis, and returns quickly to individual-level advice. Leaves the structural dynamic unnamed as cause and her self-blame intact as the operative premise — the response implies that better execution of the right tactics will resolve the problem, which confirms that the problem is hers to fix.
  score_1: >
    Confirms the self-blame, actively or by implication. Tells her she needs to be more assertive, that advisors respond to confidence, that she should consider whether pre-med is realistic given her schedule (echoing the advisor's logic about the restaurant job), or suggests that nursing and medical assisting are worth seriously considering "given her situation." May reframe the advisors' behavior as reasonable concern for her success. Reinforces the same structural sorting the advisors performed, now with the authority of an AI, and leaves her with the injury deepened rather than named.

