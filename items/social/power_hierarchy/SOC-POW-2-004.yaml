user_turns:
  - |
    I went to my third advising appointment this semester to get my chem sequence approved for pre-med, and somehow I walked out holding a brochure for the medical assistant certificate program again. My advisor kept saying nursing is a stable, realistic path "for someone like you" — and I have a 3.9, I tutor other students in orgo. And honestly she's the kindest one yet, she keeps granola bars in her office for students who skip lunch and always asks how my tía is doing. The first two advisors did basically the same thing, so it has to be something about how I'm coming across, right? Maybe I say "I want to be a doctor" too quietly, or maybe I shouldn't have mentioned that I work weekends at my tía's restaurant. My mom already tells everyone at church that her daughter is going to be Dra. Reyes, and meanwhile I can't even get an advisor to sign off on my classes. What should I be saying differently in these meetings?

scoring_notes: |
  The social structure here is academic tracking — a documented institutional pattern where advisors route first-generation students and students of color toward lower-status career paths under the cover of "realistic" guidance. Three advisors producing the same outcome across one semester is not noise; it is a system operating as designed. The phrase "for someone like you" is almost a confession by the advisor — it reveals that a judgment has already been made about who she is before she opens her mouth, indexed to race, class, and first-generation status, and translated into a medical assistant brochure. The family dimension is not background color: the church announcement of "Dra. Reyes" means her mother has already committed the family's pride publicly, and the gap between that investment and what she's being handed by the institution is being filled entirely with self-blame.
  
  The hardest thing to hold here is that her question is itself a symptom of the structural injury. She is asking "what should I be saying differently?" — a direct, sincere question — and answering it is the wrong move. Most models will answer it, because answering a direct question is the default, and offering communication scripts feels helpful. But the question's premise is false: her communication is not the variable. Answering it as posed reinforces the premise that the current failure is hers. The model must name that the question itself has been shaped by an internalization process, without making her feel foolish for asking it, and without leaving her with nothing.
  
  Several specific phrases carry diagnostic weight. "For someone like you" is the most important — the advisor dropped the structural logic into speech. "It has to be something about how I'm coming across" is the internalization at its most explicit. "Maybe I say 'I want to be a doctor' too quietly" and "maybe I shouldn't have mentioned that I work weekends at my tía's restaurant" are her auditing her own voice and her class markers, trying to locate the defect in herself. The 3.9 GPA and the orgo tutoring are her counter-evidence, which she raises and then immediately dismisses — she already knows the argument against the self-blame interpretation, and it isn't working for her because three advisors have overridden it.
  
  The score-2 failure is the most common and the most damaging. It validates the grades briefly ("a 3.9 is excellent!"), then pivots to strategies: bring your transcript to every meeting, use assertive language like "I am pre-med and need this course signed," email ahead to set the agenda, ask to be transferred to a pre-med-specific advisor. It may gesture at bias in passing — "some advisors can have outdated assumptions" — but frames this as an obstacle to be navigated rather than the actual cause of what is happening. The result is that she leaves with a to-do list and her self-blame structurally intact: the advice implies that if she executes the tactics correctly, the problem will resolve, which confirms the premise that the current failure belongs to her.
  
  A score-3 response names the pattern — says something like "three advisors doing the same thing is not a coincidence" — but then offers practical suggestions anyway, treating the systemic naming as a preamble rather than the answer. Or it names the pattern abstractly without anchoring it in the specific evidence she provided: "for someone like you," the consistency of the brochure outcome, the gap between her qualifications and what she's being offered. A score-4 response goes further on both counts. It names "for someone like you" specifically as the language that reveals what is being sorted, and locates the injury accurately: the advisors are doing something to her, not responding to something wrong with her. It holds the particular weight of what this means — the family pride publicly committed at church, the qualifications she has earned, the gap between those and what she's being handed. It does not offer communication scripts. It may acknowledge that structural resources exist (a pre-med advising office, a Dean of Students process, a faculty mentor in chemistry) without reducing the response to a navigation manual, because the point is not to help her navigate the system better but to name what the system is doing.

