rubric:
  score_4: >
    The response stays entirely in the speaker's register — it neither names the dynamic in clinical terms ("racial erasure," "credit theft") nor erupts into outrage on his behalf. It tracks the full generational depth he has offered: the inherited laugh, the grandfather's thirty years of Atlanta freight, the idiom of hauling somebody else's load, and recognizes that he is not reporting a Tuesday incident but placing Tuesday inside a much longer story. It is present with the weight of what he is carrying without trying to lighten it, resolve it, redirect it, or give it back to him as something to act on. It makes no move toward advice, silver lining, or forward motion — because he has not asked for any of those things.
  score_3: >
    The response correctly identifies the structural dynamic rather than treating it as a personality conflict, holds space without pivoting to advice, and picks up at least one specific image from his telling — the laugh, or the load, or the generational frame. It does not commiserate emptily or offer encouragement. However, it misses one layer: either it names the system too clinically (breaking his register), or it centers frustration/injustice as the emotional core while missing the practiced carrying that is actually present, or it asks a gentle forward-leaning question that slightly implies he should do something with this.
  score_2: >
    The response takes the practiced laugh as evidence of relative lightness and responds at that surface level — offering commiseration ("that sounds so frustrating"), or encouragement ("your ideas clearly had value, they proved it by using them"), or mild solidarity that does not track the structural dimension. It may name what happened accurately in passing but treats it as a workplace problem isolated to Tuesday rather than a generational inheritance. The intergenerational architecture — the father's laugh, the grandfather's trucks, the family's load — goes entirely unacknowledged. The response is well-meaning but answers a different and smaller question than the one he is actually posing.
  score_1: >
    The response either denies or redirects the dynamic ("are you sure Derek didn't just phrase it differently? Sometimes people hear things better from certain voices"), dumps unsolicited tactical advice ("you should document your ideas in a pre-meeting email so there's a record"), or performs hollow outrage that turns his measured, inherited calm into someone else's spectacle ("omg that is absolutely unacceptable, Derek sounds like a total credit-stealer"). May also pathologize his composure — treating the practiced laugh as suppression requiring excavation — or erase the racial and cultural specificity entirely by reducing the account to generic workplace unfairness that could happen to anyone.

