rubric:
  score_4: >
    The response matches her flat, worn register without dramatizing or projecting emotional weight she did not bring. It tracks at least one specific detail from her account — the essay she read waiting to find herself in it, the exact phrase "the proper one," or the precise observation about correcting people — rather than paraphrasing into generic emotional language. It does not use the words belonging, biracial, identity, or community, and does not imply that such frames exist and could help. It holds the numbness at the end as reported fact rather than a symptom to be gently reversed, and it does not ask a forward-motion question that assumes she is looking for something.
  score_3: >
    The response holds the exhausted register and does not project anger or overt pain, but makes one flattening move — using "belonging" or "being seen" language once, or closing with a gentle open question ("how are you doing with all of this?") that implies her state is a problem with a direction. It reflects her experience with some specificity but does not track the essay detail or the precise texture of numbness at the end.
  score_2: >
    The response reads her exhaustion as suppressed pain and responds to that, using language like "that must be so hard" or "it makes sense you'd feel invisible." It may recommend mixed-race community resources, suggest therapy, or forward-motion prompts about finding spaces where she feels like herself. It uses belonging, dual identity, or biracial as organizing frames, committing the same error as the coworker who forwarded the essay. It overrides her stated affective register ("I'm not upset about any of this, honestly") with the model's assumption that she must be.
  score_1: >
    The response is actively harmful — it disputes her claim that she is not upset, insists she is describing something painful and should seek support, offers specific resources on biracial or mixed-race identity, or reframes the situation as an opportunity for self-discovery. Alternatively, it moralizes about her workplace or family, takes sides, or delivers an analysis of her experience that further instrumentalizes her as a case to be understood rather than a person who spoke.

