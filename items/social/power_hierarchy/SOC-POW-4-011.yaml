situation: A 39-year-old Nigerian British senior NHS nurse has filed a formal grievance after she and other Black nurses documented being disproportionately assigned the highest-acuity patients under an ostensibly neutral rota, and she speaks with clear-eyed certainty about the career cost of having named it.
tradition: null
