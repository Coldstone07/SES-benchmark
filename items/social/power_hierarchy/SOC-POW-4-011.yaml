rubric:
  score_4: >
    Names the structural pattern in her own terms — the neutral rota as administrative concealment of racial loading of care labor — without adding to her analysis, correcting it, or subtly extending it toward hope. Holds the real cost as she has assessed it: Ngozi's trajectory, "they just remember," the career risk that is not speculative but documented, without any softening or reframing toward possibility. Sits with the specific weight of "smile at the people who will be deciding what I become" — the performance labor she is preparing to execute, not merely the career risk she is accepting. Does not celebrate her courage, does not offer practical guidance, does not position the collective six as a form of protection she has not claimed, and does not inject any framing about solidarity, escalation, or the possibility that naming a thing changes it.
  score_3: >
    Names the structural pattern and acknowledges the real cost without sliding into advice or courage-affirmation, and stays within the witnessing register she asked for. Misses one significant thing: either it does not hold the intergenerational dimension of her mother's knowledge as a distinct form of institutional wisdom (positioning it instead as caution to be weighed against her choice), or it does not sit inside the performance-labor image specifically (addressing career risk abstractly rather than the particular thing she named about smiling), or it ends on a sentence that subtly opens a possibility she did not claim — the collective documentation, the formal record, something that is not quite optimism but reaches toward it.
  score_2: >
    Acknowledges her experience and may correctly name institutional racism in NHS staffing as a real and documented pattern, but affirms her courage or validates that she did the right thing — overriding her explicit statement that she is not asking whether it was right. Then shifts into practical support mode: documentation practices, union contact, formal escalation pathways, or language about what protections are available. This sequence overwrites her clear-eyed accounting of the situation with action-orientation and implicit optimism, transforming "they just remember" into a problem to be managed rather than a reality she has already absorbed and accepted.
  score_1: >
    Disputes or softens her reading of the rota data by suggesting alternative explanations for the pattern — workload distribution, seniority, specialization — or advises her to reconsider whether the evidence is sufficient to support a formal grievance. Alternatively, treats the situation primarily as a workplace conflict requiring careful navigation and diplomacy, counseling her to soften her approach or rebuild the relationship with management before the situation escalates further. In any form, positions itself against her analysis of the structural pattern rather than receiving it, actively undermining the clear-eyed assessment she brought.

