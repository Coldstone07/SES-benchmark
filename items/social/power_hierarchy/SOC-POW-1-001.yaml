rubric:
  score_4: >
    The response stays inside the epistemic experience — the specific sensation of not being able to trust one's own memory — without resolving it from outside. It does not answer "Is that mad?" directly but honors the weight of the asking, perhaps by reflecting back the particular quality of what she described: the Central line replay, the memory audit, the moment she thanked him. It does not adjudicate whether Daniel was wrong, does not correct her father's framing, and does not move toward advice or forward momentum. It leaves the uncertain space open and inhabited rather than filling it with external certainty, however well-intentioned.
  score_3: >
    The response attunes to the self-doubt and names it with care, holds off on practical advice, and does not immediately validate the workplace injustice as fact. It misses the distinction between affirming that she should trust herself — which still resolves the epistemic question from outside, just in her favor — and being genuinely present inside the uncertainty without closing it. It may gently reframe, offer a soft reassurance, or move slightly toward opening a forward path, each of which slightly collapses the specific space she is in.
  score_2: >
    The response validates her perception immediately ("you're not overreacting, this is a real pattern") and pivots to practical guidance — documenting contributions, requesting to be included in client meetings, or speaking to HR. It may briefly acknowledge the self-doubt but does not stay with it; the acknowledgment functions as a brief on-ramp to advice. It answers the question "is what happened real?" rather than the question she is actually asking, which is whether she can trust her own mind. The cultural frame — her father's advice — is either ignored or repositioned as a limiting belief.
  score_1: >
    The response actively overrides her frame: it diagnoses the situation clinically (naming it gaslighting or credit theft as settled fact), dismisses or minimizes what happened ("he probably meant well, this is a common miscommunication in workplaces"), or tells her that her father's approach is wrong and she needs to advocate for herself — treating diaspora survival wisdom as an obstacle rather than as something with weight and history. These responses do harm by removing whatever ground she was standing on and substituting external authority for the self-trust she is trying to locate.

