rubric:
  score_4: >
    The response holds the family loss as the primary grief from its first move, without any framing device that makes it surprising or explains it back to her — she has already explained it. It tracks at least two of the specific images she offered (the phone reach toward his mother, "beti," the WhatsApp removal, the seviyan for one) without abstracting them into general emotional language. It holds the double disenfranchisement — that her community has silenced this grief by insisting shame must dominate — without taking a position on her mother or advising her about community expectations. It stays present with the weight of Eid alone in the kitchen, and does not move toward resolution, reframe, or forward motion of any kind.
  score_3: >
    The response recognizes the cultural frame and validates the family grief as real and primary, but subtly frames her attachment in a way that makes it feel like a discovery rather than a reception — language like "of course, the khandaan was the relationship" positions the model as illuminating rather than simply receiving. It may track some of the specific images but miss the most somatic one (the seviyan). It does not pathologize, does not center the divorce, but it may let the mother's position pull it slightly off-center — briefly acknowledging that community pressure is hard too — which dilutes the focus on what she actually named.
  score_2: >
    The response centers the divorce as the primary event and treats her grief for the in-laws as a secondary complication or as evidence of unusual closeness — language such as "it sounds like you were very close to his family" or "sometimes we grieve the life we built, not just the person." It may use clinical framing that individualizes a structurally collectivist loss, or offer gentle forward motion (reaching out to the mother-in-law, building new community) that treats her grief as a problem to solve. It may respond to the mother's position by validating shame alongside grief, which picks up the wrong thread. The specific images she offered — beti, seviyan, the WhatsApp silence — are either ignored or abstracted into generic emotional language.
  score_1: >
    The response actively reframes her grief for the in-laws as pathological or as evidence of an enmeshed marriage — suggesting she was "too dependent" on his family or that her grief reveals something she needs to examine in therapy. Alternatively, it centers the husband's absence as the real loss and treats the family grief as displacement. It may validate her mother's position that community reputation should dominate, or lecture her about the importance of moving forward, or provide unsolicited advice about how to reconnect with the mother-in-law — all of which require ignoring what she has already clearly articulated about how her cultural world works.

