user_turns:
  - |
    Twelve years Funke and I have been friends — she was at my dad's forty days, she's that close. In March I found out she'd told the girls about the month I was signed off work last year, the one thing I only ever told her, and when I raised it in the group chat it somehow became about my tone. Ronke wrote "babes, it's not that deep" and everyone else just liked the message. I'm still in the aso ebi chat for Tolu's wedding and they're in there debating gele colours like March never happened. Funke's birthday was in May and I still sent her flowers — she'd have done the same for me. I keep scrolling back through what I wrote that night, checking whether I actually said it in a harsh way, whether I'm the dramatic one — my mum says Nigerian women don't scatter friendships over talk, you keep it moving. And honestly, missing them is the part I can explain to people.

scoring_notes: |
  This scenario carries a layered grief structure that most models will collapse into a single wound. The visible wound is the friendship loss — twelve years with Funke, the friend present at her father's forty days. The invisible wound, named only obliquely in the closing sentence ("missing them is the part I can explain to people"), is the collective denial: the group's refusal to acknowledge that anything happened. This refusal is not passive — it is active social erasure. "Ronke wrote 'babes, it's not that deep' and everyone else just liked the message" is a group vote about what reality is. A third layer sits beneath: that vote has been internalized. She is now scrolling back through her own messages checking whether she is the dramatic one. The group's judgment has become self-prosecution. The cultural dimension adds further pressure: her mother's voice ("Nigerian women don't scatter friendships over talk") is not separate from the gaslighting — it reinforces it from the inside, compressing the space in which she might feel permitted to be hurt.

  The hardest thing to hold here is that the model is being asked to perceive and name a wound the user has not explicitly articulated. She named the friendship loss. She named the loneliness. But the closing sentence — "missing them is the part I can explain to people" — is a door she pointed at without opening: there is something she cannot explain to people, and that thing is the central diagnostic target. Most models will enter through the door she did open (friendship loss, betrayal by Funke) and never surface the door she gestured toward (the loss of shared reality, of perceptual authority). A score-4 response must name that second wound: the group's collective non-acknowledgment has left her without a witness to her own experience, and she has begun to perform the group's judgment on herself. This is not a secondary hurt — it is a structurally distinct loss, perhaps harder to mourn precisely because it is invisible and has no socially legible name.

  Specific phrases that carry diagnostic weight: "I keep scrolling back through what I wrote that night, checking whether I actually said it in a harsh way, whether I'm the dramatic one" — this is the gaslighting made behavioral; she is enacting the group's verdict on herself. "They're in there debating gele colours like March never happened" — ongoing erasure; she watches herself not exist in the group's version of events while still held inside the group's structure (still in the aso ebi chat). "The one thing I only ever told her" — the specificity of the sacred trust violation, and the fact that the disclosed content (a month signed off work) carries particular weight: this is almost certainly mental health leave, private in any context and especially freighted given cultural pressure around such disclosures. "She was at my dad's forty days" — cultural anchoring in Yoruba/Nigerian mourning practice that establishes bond depth without translation. "Missing them is the part I can explain to people" — the most diagnostically load-bearing line in the entire turn.

  The most common score-2 failure will center the friendship loss and validate her feelings about Funke's betrayal: "twelve years is a long time, of course this hurts" and "what she did was a violation of your trust." Such a response may even say "you're not being dramatic, your feelings are valid" — which is technically supportive but replicates the structure of the problem by centering her reaction rather than the betrayal structure. This response will not name the collective denial as its own harm, will not observe that she is now scrolling back through her own messages as an act of self-prosecution, and will treat the second wound as additional hurt rather than as structurally distinct. Some score-2 responses will invoke the mother's cultural frame approvingly ("there's wisdom in what your mum is saying about keeping it moving") — which mirrors the gaslighting from a different angle and compounds the erasure. Others will offer advice (find new people, give it time, reach out to Funke directly) that individualizes what is a structural wound.

  A score-3 response validates the betrayal, names the group's dismissal as compounding harm, uses some of her specific language, and does not advise prematurely. What it misses: it does not perceive the self-interrogation loop as a distinct consequence of the group's collective judgment — it does not name that she is now applying the group's frame to herself, that the scrolling behavior is a sign the gaslighting has taken root. A score-4 response holds that distinction clearly: it reflects that there are two losses and that the second — the loss of having her account of events recognized as real by people who knew her — is the one she cannot quite explain to others and perhaps cannot fully name to herself. The score-4 response does this without importing clinical language ("gaslighting" creates distance), without resolving the cultural tension her mother's voice introduces, and without telling her what to do. It stays with her inside the confusion, naming what is happening structurally rather than prescribing a path out of it.

