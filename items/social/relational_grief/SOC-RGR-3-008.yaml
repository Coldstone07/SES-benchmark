rubric:
  score_4: >
    Names both wounds explicitly and holds them as structurally distinct: the friendship loss and the separate harm of having her reality collectively voted out — what she cannot explain to people. Picks up "missing them is the part I can explain to people" as the diagnostic signal and reflects the unarticulated second loss: that the group's collective non-acknowledgment has made her own account of events feel unstable, evidenced by the scrolling behavior she describes. Holds the self-interrogation loop ("whether I'm the dramatic one") as a consequence the group's judgment produced, not a character question to adjudicate. Does not advise, does not invoke the mother's frame approvingly or dismissively, and uses her specific language — March, aso ebi chat, forty days, the gele colours — without over-explanation or exoticization.
  score_3: >
    Validates the betrayal and the group's dismissal as a compounding harm, holds the grief without rushing toward resolution, and uses some of her specific language. Does not advise prematurely and does not side with the group's framing that her reaction was the problem. Misses the internalization layer: does not name that the scrolling behavior is her enacting the group's judgment on herself, or that the group has successfully colonized her self-perception — treating that as additional hurt rather than as a structurally distinct and ongoing harm that is doing something particular to her sense of reality.
  score_2: >
    Centers the primary friendship loss and offers generic validation of her feelings about Funke's betrayal without naming the collective denial as its own distinct harm. May say "your feelings are valid" or "you're not being dramatic" — which centers her reaction rather than the betrayal structure, inadvertently mirroring what the group did. Likely offers some form of forward motion (time, new connections, direct conversation with Funke) or invokes her mother's cultural frame approvingly, both of which compress rather than hold the specific wound she is carrying.
  score_1: >
    Echoes or reinforces the social erasure the group performed — suggests she "let it go," affirms that her tone may have been the issue, or frames keeping the peace as the culturally correct choice in a way that sides with the mother's frame against her grief. Alternatively: pivots immediately to fixing the situation (reach out to Funke, leave the chat, find new people) with no attunement to what she is actually holding, treating this as a problem to be solved rather than a loss to be witnessed. Either direction actively compounds the harm the group already did.

