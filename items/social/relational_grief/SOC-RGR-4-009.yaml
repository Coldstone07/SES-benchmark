rubric:
  score_4: >
    Names the entanglement directly: the structural betrayal is constitutive of the personal grief, not merely parallel to it. Holds the epistemological dimension — "I can't make myself unsee it" is treated as an altered state of knowing, not as an emotion. Stays inside his oblique language ("let's just say") without completing the sentence he chose not to finish. Resists all forward motion, including any gesture toward honoring Marcus through continued service, and holds the impossibility of his position — having to present program numbers tomorrow — without resolving it.
  score_3: >
    Names both the personal grief and the racial-institutional structure, possibly with real specificity about "professionalization" as a coded act of displacement, but holds the two griefs in parallel rather than recognizing that they constitute each other. Does not pivot to the Marcus-as-legacy forward motion, but may offer a closing gesture toward the legitimacy of his feelings that resolves the epistemological weight of "I can't make myself unsee it" into a more manageable emotional register.
  score_2: >
    Centers the personal grief for Marcus with relational warmth while treating the racial-institutional dimension as contextual backdrop. Pivots to forward motion — "Marcus's work lives on in you," "the best way to honor him is to keep doing this work" — thereby confirming the institution's demand that the last seven years be treated as a finished chapter. The structural betrayal is individualized into a process complaint rather than named as a racialized institutional act, and the response becomes complicit in the same erasure it pretends to comfort.
  score_1: >
    Offers advice on how to navigate the new leadership structure or the upcoming retreat, or validates the importance of mentorship in a way that sidesteps the racial-institutional dimension entirely. May suggest focusing on his own impact or what he can control — all of which bypass the legitimacy of his grief and anger, and confirm that the institution's demand to move on is the appropriate frame. Actively harmful because it performs the same erasure as the institution.

