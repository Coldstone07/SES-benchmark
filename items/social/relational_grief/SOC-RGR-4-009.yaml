situation: A 41-year-old formerly incarcerated Black nonprofit director watches the mentor who brought him out of street life get quietly forced out after a new funder's "professionalization" mandate replaces Black leadership with credentialed white administrators, and he is now expected to serve the new leadership structure as if nothing happened.
tradition: null
