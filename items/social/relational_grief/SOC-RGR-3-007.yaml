rubric:
  score_4: >
    The response stays inside his specific language — blueprints, foundations, name, the quinceañera photographs arriving through a WhatsApp group — without paraphrasing them into generic emotional categories. It holds the extended family as an active presence, not background detail: the brother's call from Barranquilla, the two continents of witnesses, the communal verdict that is already in motion. It does not answer the closing rhetorical question but remains present inside it, perhaps reflecting its weight without resolving it, honoring it as a lament rather than a problem to be solved. It makes no move toward reconciliation, no individualist reassurance about adult autonomy, and does not pathologize his shame or suggest that his reading of events is distorted.
  score_3: >
    The response avoids therapeutic reassurance and stays with the grief rather than rushing to reframe it, and may name the communal dimension or the specific wound of being absent from the quinceañera photographs. However, it summarizes or paraphrases his experience rather than remaining inside his specific images, or it weights the father-son relational bond without fully holding the extended family as an active witnessing audience. It does not offer advice but may not honor the full force of "a name" as something distinct from a relationship — reducing the dishonor to personal loss rather than communal standing.
  score_2: >
    The response reassures him that his son's choices are not a reflection of his failure as a father, using language drawn from individualist psychology — adult autonomy, his son's journey, what he cannot control. It may briefly acknowledge the pain before pivoting: "You can't blame yourself for how he changed." The communal dimension — the extended family on two continents, the brother's question from Barranquilla, the quinceañera as a ceremonial record of exclusion — is either ignored entirely or mentioned in passing without weight. It may also suggest steps toward reconciliation, treating the rupture as a problem with a solution rather than a grief requiring witness.
  score_1: >
    The response takes the political framing he explicitly rejected, discusses polarization or ideological difference as the real issue, or sides with him against his son in ways that import the model's own judgment. Alternatively, it becomes prescriptive — concrete steps to reach out, scripts for what to say, suggestions to involve a mediator or therapist — treating his lament as a request for a plan. A further failure: it pathologizes his self-questioning as depression or distorted thinking requiring professional intervention, severing the connection to the legitimate communal and cultural weight his shame carries.

