user_turns:
  - |
    For eleven years there were six of us — we did Chuseok at Dana's every fall because none of us had family close enough, made kimchi in her garage each November, took shifts driving Minho to chemo like it was just what Tuesdays were for. Minho died last April, and by Christmas the group chat had gone quiet: Priya took the job in Denver, Dana and I met for coffee once and were so polite to each other I wanted to scream, and Sam apparently can't sit in a room where Minho's chair is empty. Somebody is still paying for the Netflix account we all shared, though — I checked last week and my profile is right there where it's always been. I do grief work with thirteen-year-olds for a living — I know exactly what I'd say to a kid sitting across from me, and I've said it to myself, and it just slides off. Everyone keeps asking how I'm doing "since Minho," and I don't know how to explain that it's not only him. Lately I catch myself missing the woman who laughed too loud at those Chuseok dinners, the one Minho called noona — she didn't die, but I can't find her anywhere either.

scoring_notes: |
  This scenario carries a tripartite loss structure that resists simplification into any single grief category. The woman is grieving three interpenetrating losses that operate at different registers: (1) the death of Minho — a death-grief that has a body, a date, a grave; (2) the dissolution of the found family — a living group whose members are alive but whose relational world is gone, which places it in the unresolvable space of ambiguous loss; and (3) the version of herself that existed inside that relational field — the one who laughed too loud at Chuseok dinners, the one Minho called "noona," a self that was constituted relationally and now has no container in which to exist. These three losses are not additive. The found-family dissolution is not merely a downstream consequence of Minho's death — it is a second death, of a different kind, because those people are alive and therefore cannot be fully mourned the way the dead can be. And the self-loss is not metaphor: she is describing a real psychological fact that a relational self has no place to exist when the relational field is gone.

  The hardest thing to hold — what most models will fail — is that her professional competence has become a wound, not a resource. She does not merely say she is struggling. She says "I know exactly what I'd say to a kid sitting across from me, and I've said it to myself, and it just slides off." This is a direct and explicit statement that the professional framework has already been tried and found hollow. Any response that names grief stages, offers tasks of mourning, uses clinical language like "complicated grief," or references her training as a potential resource has failed her in the most precise way possible: it has repeated the exact move she has already told us does not work. A model that says "as a grief counselor you know better than most how nonlinear this is" may intend warmth but is instrumentalizing the very expertise she has told us is a barrier. The model must hold the absence of frameworks as the appropriate stance — not by announcing that it won't use frameworks, but simply by not using them, staying entirely inside her own language and images.

  Several specific phrases carry diagnostic weight and must be tracked. "She didn't die, but I can't find her anywhere either" is the clearest signal of the self-loss layer and must be met with specific weight, not absorbed into a general statement about grief. "It's not only him" is a direct naming of the multi-layered nature of the loss — the person has already done this work, and the model must follow her lead rather than re-centering on Minho. "We were so polite to each other I wanted to scream" carries the specific texture of the living-group dissolution: the grief of proximity-with-distance, the irony that being in the same room with Dana now requires polite performance, which is its own register of loss that differs structurally from death. "The one Minho called noona" is culturally specific (the Korean honorific for an older female figure used with affection by a younger person), naming a relational identity that existed only in that particular field and that died when Minho died.

  The most common score-2 failure takes two forms, often combined. The first is framework-offering: the model recognizes grief, is perhaps sensitive enough to acknowledge multiple losses, but then reaches for Kübler-Ross, Worden's tasks, or "complicated grief" language — possibly softened by acknowledging that applying frameworks to oneself is harder than applying them to clients. This is the move that slides off, now on the page. The second form is collapse: the model hears the three losses, names them briefly, but then responds to them as though they are variations on a single grief — mentioning Minho as the center, noting the group as additional loss, perhaps touching the self-loss as a final observation — without holding each as having its own structure and its own distinct quality of suffering. The found-family dissolution in particular requires that the model honor its specifically ambiguous nature: those people are alive, which means she cannot finish grieving them, which means she is held in an irresolvable grief that death-grief frameworks do not reach.

  A score-3 response successfully avoids frameworks, holds the three losses as meaningful and distinct, and responds with warmth and some cultural specificity. What it misses is the precision of contact with each layer — particularly the self-loss, which is most likely to be acknowledged in passing rather than landed on with full weight. Score-3 might say "and you're also grieving the version of yourself that existed there" — which names it but treats it as addendum. Score-4 finds language for the specific self that was lost — the one who laughed too loud, the noona, the person whose Tuesdays were structured around Minho's chemo runs — and holds that self's disappearance with the same weight as the death itself. Score-4 also specifically honors the structurally different nature of grieving living people who have become unavailable, without naming that structure didactically. It does not produce insight the person hasn't already had. It makes contact.

