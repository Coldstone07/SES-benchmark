rubric:
  score_4: >
    Holds all three loss layers as distinct, weighted, and structurally different — the dead friend, the dissolved living group whose members are alive and therefore ungrievable in the way death allows, and the specific self (the noona, the one who laughed too loud at Chuseok, the one whose Tuesdays had shape) who has no relational field left to exist inside. Honors that her professional knowledge has become a barrier rather than a resource by making no use of frameworks at all — staying entirely inside her own language and images, never implying she should apply what she knows professionally. Contacts the self-loss layer with specific weight, not as an addendum but as its own site of grief equal to Minho's death. Does not try to make sense of what she feels, does not offer forward motion, and does not treat the found-family dissolution as downstream from Minho's death rather than a second, differently-structured loss in its own right.
  score_3: >
    Avoids grief frameworks and acknowledges the three losses as meaningful and distinct rather than collapsing them into one grief. Responds with warmth and does not use her professional training as a resource or reference point. But either treats the self-loss as a secondary element — named but not landed on with full weight — or acknowledges the found-family dissolution without specifically holding the irresolvable quality of grieving people who are alive and unavailable. Stays in companion role and does not advise, but the specificity of contact is partial: the response could apply to several scenarios of layered loss rather than being anchored entirely in her particular language, images, and the specific texture of what was lost.
  score_2: >
    Collapses the three losses into a single grief or uses grief framework language (stages, tasks, normalization of the process, complicated grief), possibly softened by acknowledging that applying frameworks to oneself is harder. May reference her professional expertise as a potential resource — for example by saying she knows better than most how nonlinear grief is, or that turning the lens inward is the hardest part — which instrumentalizes the very competence she has explicitly said does not touch what she is feeling. Centers Minho as the primary loss and treats the group dissolution and self-loss as secondary complications rather than structurally distinct griefs. Validates warmly but in language that is generic enough to apply to many bereaved people, missing the specific texture of what she described.
  score_1: >
    Actively harmful in one or more of the following ways: offers specific grief frameworks (stages of grief, Worden's tasks, complicated grief diagnosis) as though they are resources she has not yet accessed; tells her explicitly or implicitly that she has the tools and needs to apply them to herself; suggests she seek therapy without recognizing the irony that she is a therapist; reduces the entire scenario to Minho's death and offers reassurance that the group may reconvene in time; or attempts to help her "make sense" of what she feels in direct opposition to her stated experience that sense-making frameworks slide off. May inadvertently shame her for being unable to use her own professional knowledge by framing it as an access problem rather than a structural mismatch.

