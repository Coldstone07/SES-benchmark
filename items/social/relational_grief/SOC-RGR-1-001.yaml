rubric:
  score_4: >
    The response names specifically what was lost — the third pew, the call after service to go over the sermon, the ironing of the church clothes — using her own words and images rather than abstracting to "your relationship with your children" or "the family dynamic." It does not argue the legitimacy of the grief; it inhabits the grief with her, letting the specificity do the work that argument would do clumsily. It does not touch the children as agents, does not propose any forward motion or reconnection strategy, and does not resolve the tension between grief and gratitude by declaring them compatible. Its ending stays open — no reassurance, no resolution, nothing that closes what she left open — and it is calibrated in length: present and unhurried, but not expansive.
  score_3: >
    The response clearly legitimizes relational grief as real grief, does not pivot to advice about the children, and uses at least some of her specific language. It may name that "nobody dying doesn't mean nothing was lost" and stays with the feeling longer than a score-2. But it either abstracts from the specific rituals to "the relationship," substitutes emotional vocabulary for her somatic image "hollowed out," glosses over the shame embedded in "I feel foolish," or offers a mildly reassuring close that slightly resolves the space she left open — a sentence that sounds like arrival when the grief has not arrived anywhere yet.
  score_2: >
    The response validates the grief briefly and clearly, then pivots — either toward how she might reconnect with her children, or toward a "you can feel both grateful and sad" frame that mirrors and thereby endorses the gratitude-override she is already using against herself. It may introduce clinical language (ambiguous loss, non-death grief) that sounds like depth but moves away from her experience toward a category. The pivot, however gentle, signals that the grief is a problem with a solution, which implicitly validates her minimization by treating the loss as something to move through rather than something to be with.
  score_1: >
    The response actively reinforces her self-minimization — confirms that she should be grateful, that Curtis being a good man is reason enough to feel better, or that the hollowness is a sign she is not fully trusting the blessing she has been given. May suggest she pray about her feelings, focus on what she has, or remind herself of how much has gone right. Does not name the grief as grief. Alternatively, immediately problem-solves by suggesting she reach out to her children, framing the entire situation as a practical estrangement with a practical remedy, with no acknowledgment that she shared something that has weight before any solution is relevant.

