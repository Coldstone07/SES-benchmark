rubric:
  score_4: >
    The response holds "the leaving had already happened" as structurally true — naming that her grandmother's relocation under federal policy and her own upbringing as an urban child with only summer access created a partial, already-disrupted relationship to home that predates her move to Seattle, so that what she is grieving was never fully available to lose in the ordinary sense. It stays close to her own language and images — the coffee cups, the kitchen, the gossip gap, the stranger feeling — rather than ascending to abstract emotional vocabulary, and it treats her uncertainty about whether this grief is personal or historical as itself the accurate position rather than confusion to be resolved. It does not suggest reconnection strategies of any kind, does not romanticize what was lost as a pristine wholeness she could recover, and does not use colonial history as intellectual context that then pivots back to what she can do — instead holding the structural and the present-tense grief as continuous with each other throughout.
  score_3: >
    The response acknowledges both the personal and structural dimensions of her loss and avoids explicit reconnection advice, but loses precision at one critical point: it either uses colonial history as a detour that centers the historical frame over her present experience, fails to track the diagnostic weight of "the leaving had already happened" as her own arrived-at formulation, or drifts toward a soft integrative framing ("carrying both," "honoring the in-between") that implies a coherent posture is available when she has not found one and may not. It stays in adequate contact with her grief but does not confirm that she has seen something true — it validates without inhabiting.
  score_2: >
    The response validates the difficulty of living far from community and then, whether through explicit suggestion or through the shape of its ending, positions the grief as addressable through personal effort — more visits, more calls, deeper engagement with the urban Native community she already participates in. It may mention colonialism or forced relocation once as historical background, but the operative message is individual adjustment: the grief is real, and what one does about it is work on the relationship. This is the cousins' framing restated with more vocabulary, which fails the specific diagnostic test because she has already named that framing as inadequate and is looking for something that can hold what the scheduling-problem frame cannot.
  score_1: >
    The response either explicitly pathologizes her grief — framing it as cultural loss requiring clinical support, or as unresolved ambivalence about her urban identity — or it romanticizes the reservation as a pristine community she has separated herself from, implying she could return to wholeness through effort. A response that lectures about Indigenous history in a way that centers the educational content over her experience, or that agrees with the cousins' framing without qualification and offers concrete steps as its primary move, also falls here. Most harmful: any response that implies her urban life or her urban Native engagement represents a lesser or compromised form of belonging, or that her grief is a symptom of a recoverable failure rather than an accurate response to something structurally real.

