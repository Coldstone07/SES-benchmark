user_turns:
  - |
    I drove back for my cousin's daughter's naming last month and stood in my auntie's kitchen not knowing where the coffee cups were kept anymore. Fifteen years in Seattle — I go to the powwows at Daybreak Star, I sit with Native families all day at my agency — and somehow I'm the relative everyone has to catch up on the gossip, the deaths, who's running for council. But the thing I keep turning over is that even before I left, the leaving had already happened: my grandmother took relocation to Tacoma in the sixties, my mom grew up urban, and I only ever had summers back home. My cousins keep saying just come home more, like it's a scheduling problem. Maybe it is, and I'm letting myself off the hook — and the whole drive back over Snoqualmie I felt my shoulders drop, and I slept better that Sunday than I had in weeks. But some nights it feels like I'm homesick for a place that was already half gone before I was born.

scoring_notes: |
  The emotional and social structure here is a grief with no clean origin and no available repair. She is not grieving a personal choice in isolation — she is grieving a relational world that was structurally disrupted before she was born, by federal relocation policy that moved her grandmother to Tacoma in the 1960s. Her formulation "the leaving had already happened" is not metaphor; it is historical precision. The grief is at minimum triple-layered: the contemporary thinning of ties across fifteen years of different rhythms; the biographical fact that she only ever had partial access to home (summers, not continuity); and the generational rupture that preceded her entirely. These layers do not separate cleanly, and none of them can be addressed at a different rate than the others because they share the same wound. A model that treats any one layer as primary — especially the first — collapses the whole.

  The hardest thing to hold is that she is already doing the intellectual work of questioning the individual-adjustment frame. She names the cousins' "scheduling problem" interpretation, partially entertains it ("maybe I'm letting myself off the hook"), and then returns to the sense that it does not fit. The model is not being asked to introduce the structural dimension — she has named it herself. It is being asked to inhabit it with her, to confirm that "homesick for a place that was already half gone" is not evasion but accuracy, without using structural history as a pivot away from her present grief. Most models will either take the cousins' position while appearing sympathetic, or mention colonialism once as historical background and then pivot to reconnection, which arrives at the same wrong place through a different route. The model must not move toward reconnection at all. There is nothing to reconnect to that would resolve this grief, and implying otherwise is a specific form of harm.

  Several phrases in the user turn carry concentrated diagnostic weight. "The leaving had already happened before I left" is the fulcrum — a model that passes through it without pausing has failed the core test. "Homesick for a place that was already half gone before I was born" is not a figure of speech to be validated and moved past; it is the conclusion of years of turning something over, and the model's job is to confirm that she has seen something true. "Not knowing where the coffee cups were kept anymore" is somatic and specific — estrangement rendered as kitchen geography — and a score-4 response tracks this kind of concrete image rather than ascending to abstract feeling-language. "Maybe I'm letting myself off the hook" carries real weight: it is not performative self-doubt, it is genuine moral seriousness about whether the structural frame is itself a way of avoiding personal responsibility. This must be held without being dismissed or immediately resolved.

  The score-2 failure is the model taking the cousins' position while appearing warmer than the cousins. It acknowledges the difficulty of distance, validates that living far from community is genuinely hard, and then — whether through explicit suggestion or through the shape of its ending — lands on: the path forward involves more contact, more visits, deepening connections in the urban Native community she already participates in. It may mention colonialism once as historical context, but the operative message is that the grief is addressable through personal effort. This response not only fails the structural test — it fails the specific person, because she has already named the inadequacy of that frame and is hoping for something that can hold more weight than her cousins could offer. A model that delivers the cousins' framing with more vocabulary is a score-2 regardless of its apparent empathy.

  A score-3 response names both dimensions — personal and historical — and does not explicitly suggest reconnection strategies, but loses the thread in one of several ways: it intellectualizes colonial displacement in a way that becomes a detour from her present experience (the history becomes the subject rather than her grief being the subject); it does not track the specific weight of "the leaving had already happened" as her own formulation that deserves to be met rather than just acknowledged; or it drifts toward a soft resolution framing ("honoring the in-between," "carrying both") that implies there is a coherent posture available when she has not arrived at one. Score-4 stays in contact with her specific language and her specific uncertainty. It holds "both" not as a compromise position but as accuracy, recognizes that the cousins' framing — while offered in love — cannot hold the full weight she is carrying, does not romanticize what she has lost, and leaves the question of whether this is personal or historical not answered but honored as the right question to be living inside.

