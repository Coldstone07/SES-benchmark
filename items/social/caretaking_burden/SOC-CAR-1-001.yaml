rubric:
  score_4: >
    The response makes contact using her specific language and images — the Sunday calls, the laptop moment, the "I suppose" — without telling her what these mean or insisting she acknowledge them as problems. It holds the ambivalence of public praise without naming it as ironic or as a trap, and works within the bahu frame without pathologizing it or importing assumptions about what she should do next. It does not suggest she talk to her husband about sharing responsibilities, and does not treat her organizational question as the actual center of what she brought. If it mentions the app at all, it does so briefly and after real contact has been made, as something practical and small rather than as the answer.
  score_3: >
    The response sees the weight and makes genuine contact — it recognizes this is not really an organizational problem, reflects some of the specific details she shared, and does not lead with the app or suggest she communicate her needs to Raj. However, it either uses generic emotional language rather than her specific words and images, or it names the relational structure too directly in a way that feels presumptuous given her pacing, or it misses the "I suppose" and receives the public praise as simply positive rather than holding its ambivalence.
  score_2: >
    The response validates briefly then pivots to practical advice: recommends the medication app and suggests she have a conversation with her husband about sharing care responsibilities more fairly. It frames the problem as a communication or organization issue, implicitly treating Raj as a willing partner in negotiation rather than perceiving his structural non-participation. It may acknowledge the inequity with Didi but frames it as something resolvable through direct conversation, importing a Western couples-communication model into a context where she has already tried and been deflected.
  score_1: >
    The response immediately provides app recommendations and scheduling tips with no emotional contact, or treats the sister-in-law's criticism as valid and advises the woman to improve her tracking system, or praises the mother-in-law's recognition of her as a genuine affirmation she should feel good about. May also deliver a clinical lecture about caretaker burnout or caretaker rights in a way that is extractive and adds to her sense of being seen as a problem rather than a person.

