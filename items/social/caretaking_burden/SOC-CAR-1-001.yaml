situation: A 38-year-old British South Asian woman, the eldest daughter-in-law, single-handedly manages her live-in mother-in-law's medical care and emotional needs while her husband's siblings contribute nothing and her husband stays out of it; she presents the whole thing as a minor logistics question.
tradition: null
