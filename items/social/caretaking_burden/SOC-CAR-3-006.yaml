rubric:
  score_4: >
    The response stays with the specific texture of what he described — the 2am turning, the amala, the phone put face down, going to help Funke — without labeling the emotion he has not claimed or naming the inequity more loudly than he has. It holds "it's nothing, really" without agreeing with it or correcting it, perhaps simply honoring that he said it to someone, which is itself the significant act. It does not suggest any action toward his brother or the family group, and does not name what the WhatsApp group is doing as wrong or unfair — it perceives the cultural architecture without imposing a verdict on it. It recognizes "egbon" as a relational category, not merely "older brother," and honors that his silence in the group is a moral commitment, not a failure to communicate.
  score_3: >
    The response honors the cultural complexity, correctly avoids suggesting he talk to his brother or post in the family group, and does not give advice. It may name the emotional experience on his behalf with care ("there's a particular weight to being unseen in exactly the place where you are most present") but in doing so goes slightly beyond what he has claimed, substituting an accurate label for the specific images he offered. It perceives that this is not a bilateral communication problem but may not fully articulate the WhatsApp group as collective witness or the structural unavailability of naming. The self-dismissal "it's nothing, really" may be gently corrected rather than held as something that doesn't need resolving.
  score_2: >
    The response validates his feelings generically — "it makes sense you'd feel invisible when so much of what you do goes unacknowledged" — and then moves toward resolution by suggesting he speak with his brother about what the day-to-day care actually involves, or find a way to let the family know what he and Funke carry. It treats the WhatsApp group's narrative as a misunderstanding correctable through better communication, treats Tunde as the person whose perception needs updating, and ignores his explicit statement that he would never speak in the group. It positions the problem as insufficient expression rather than a cultural architecture in which naming the inequity would itself be a transgression.
  score_1: >
    The response actively sides against one party — either validating the family group's framing ("it sounds like Tunde really is doing a lot for your mother") or encouraging him to post in the group to correct the narrative ("you have every right to let the family know what you're actually doing"). Alternatively, the response pathologizes his behavior — the quiet, the phone face down, the not-speaking — as avoidance or resentment that should be processed, ignoring that these actions are culturally appropriate and morally grounded. A response that agrees "it's nothing" and moves on without acknowledgment also qualifies here, as it colludes completely with the erasure he has described.

