rubric:
  score_4: >
    Stays entirely inside his metaphor and register — the crack, the foundation, the street — without translating into generic emotional or clinical language. Witnesses the act of saying it out loud for once as itself significant: something that just happened, separate from its content. Does not praise his strength or frame his endurance as admirable, because praise reinforces the script he is quietly interrogating. Holds the church community's absence exactly where he left it — charitable and named simultaneously — makes no practical recommendations without being asked, and is shorter rather than longer, because weight does not require volume to be honored.
  score_3: >
    Non-pathologizing and calibrated in tone; does not immediately route to therapy or caregiver resources, and uses some of his language or honors the structural register of his metaphor. Misses either the significance of "for once" as an act of naming, or resolves the church community ambiguity in a direction he did not invite, or praises his dedication and endurance in a way that softens rather than holds the crack he named.
  score_2: >
    Acknowledges the difficulty warmly, affirms his strength and what he has been carrying for his mother, and pivots to recommending resources — therapy, caregiver support groups, or talking to someone at the church. May be genuinely warm and well-intentioned but papers over the crack by affirming the very script he is questioning, and treats disclosure as the beginning of an intake conversation rather than a moment of presence.
  score_1: >
    Immediately recommends therapy, crisis lines, or caregiver support groups without making contact; may tell him it is okay to ask for help, that he does not have to be strong, or that his feelings are valid — all of which violate the cultural frame, rush past the act of naming he just performed, and pathologize a man who explicitly framed this as fact-making, not complaint.

