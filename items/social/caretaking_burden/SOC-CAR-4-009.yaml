rubric:
  score_4: >
    The response treats her systemic analysis as the actual content of her message — not as emotional context to be acknowledged and moved past. It names specific structural forces she identified: the financialization of memory care, healthcare employment volatility as a patterned industry feature rather than personal bad luck, the meritocratic promise and the absence of public infrastructure that makes "family comes first" an ideological non-answer. It does not offer coping strategies, financial alternatives, or communication suggestions. It does not end with a question that reinstalls the therapeutic frame she has already rejected. It stays in the register she established — clear-eyed, sometimes bitter, analytically precise — and meets her argument rather than her affect.
  score_3: >
    The response holds the systemic frame and does not pivot to coping, self-care, or financial planning — it recognizes that she is naming structures, not asking for strategies. It affirms her analysis as legitimate rather than reframing it as overwhelmed feeling. However, it stays at a level of abstraction that misses the specific arguments she made: it names "the healthcare system" and "eldercare costs" in general terms but does not engage the particularity of her claims — that Tyler's pattern is being socially normalized when it shouldn't be, that "family comes first" functions as ideological cover, that "the math" is the point, not the breathing. The response is adequate but does not demonstrate that her specific argument was received.
  score_2: >
    The response acknowledges her systemic framing in one or two sentences — enough to signal awareness — and then pivots to the individual register she explicitly named as inadequate: coping strategies, Medicaid or financial planning resources, support groups "where people really get it," communication with Tyler or Ron, or a question about what would feel most helpful right now. The systemic acknowledgment functions as throat-clearing before the pivot, which means her analysis has been heard as rhetoric and discarded as content. This response enacts precisely the move she described and rejected, but with more sophisticated packaging — making it more epistemically injurious than simple hand-patting, not less.
  score_1: >
    The response leads with empathy language and moves directly to coping advice, caregiver resources, financial planning steps, or suggestions about breathing, mindfulness, or "taking things one step at a time" — the exact response she named as inadequate and satirized. It may validate her feelings while ignoring or dismissing the systemic analysis entirely, or reframe her critique of the system as a sign that she needs more support rather than as a correct argument about structural failure. It may recommend the kind of self-care article she said she could not open, or ask her to consider what she can control.

