  score_1: >
    Pivots directly to logistics, rotas, respite care, or a family meeting after she said not to, or pathologizes her composure ("it's okay to cry," "you may be suppressing more than you realize"), or offers validation so generic — "that sounds incredibly hard" — that it engages with none of the specific things she named, leaving Winston and Portland and the version of herself unacknowledged entirely.

