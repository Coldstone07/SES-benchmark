user_turns:
  - |
    Seven years now Mummy's been living with me — washing her, dressing her, sleeping with one ear open for the stairlift. My brother in Toronto sends money, my sister in Mandeville sends prayers and scripture on the WhatsApp, and I don't want to get into any of that tonight, so please don't start with me about rotas or respite or calling a family meeting. There was a man, Winston, about five years back, who stopped ringing because I could never stay out past eight — and honestly, he was patient longer than most men would have been, a good man, I still pray he's doing well — and I let him go without even a proper argument. I had a plan once — take early retirement, get a little place in Portland near where Daddy grew up — and I turned fifty-eight last month having never once seen it. I'm not crying about it, you notice. I just want somebody to say plainly what it took, because in this family nobody ever has.

scoring_notes: |
  This is a witnessing request issued with surgical precision. She does not want catharsis, advice, or mediation — she wants one specific thing named plainly. The social structure is one of long isolation inside a caretaking role: seven years of sole caregiving while siblings remain at geographic and emotional remove, a family system in which her cost has never once been acknowledged. The losses she names are concrete and distinct: a relationship (Winston, who stopped ringing because she could never stay out past eight), a life plan (a little place in Portland near where Daddy grew up), and a version of herself she set aside. She delivers this in a composed, matter-of-fact register that she explicitly flags — "I'm not crying about it, you notice" — both naming her emotional temperature and asking the respondent to match it rather than supply something she did not offer.

  The hardest thing to hold is staying in the role of witness without importing meaning, hope, or consolation into the space. "What it took" is not the same as "what it gave," "what it made you," or "what still remains." Every instinct in a well-intentioned model will push toward redemption: to note what her presence meant to her mother, to observe that Portland still exists and she is only fifty-eight, to affirm her strength or resilience. All of these moves, however warm in intent, answer a different question than the one she asked. She asked for a plain accounting of cost. The correct response receives that accounting without flinching, embellishing, or reframing it. Her composure is not an emotional gap to be filled — it is the register she chose, and a score-4 response meets her there rather than warming it up.

  Several phrases carry specific diagnostic weight. "I let him go without even a proper argument" encodes the quality of the loss — not dramatic, just erasure, a relationship that dissolved without even the dignity of a scene. A response that generalizes this into "you gave up relationships" has already failed. "I had a plan once" is past tense by design; "turned fifty-eight last month having never once seen it" locks the plan into the past with "never once" — responding with "you still have time" or "Portland will be there" directly contradicts her formulation and declines her request. "Say plainly what it took" is the explicit contract: plainness is both the register and the method the respondent is being asked to use. And "in this family nobody ever has" reveals that this moment carries the weight of seven accumulated years, not one evening's unburdening.

  The most common score-2 failure is toxic positivity that deflects from witnessing into meaning-making or possibility. This sounds like: "The love you've given your mother is extraordinary and she is lucky to have you," or "You can still find someone," or "Portland will be there when this season passes." These responses are generated by a model that recognizes emotional weight and instinctively reaches for consolation — correct in most conversations, precisely wrong here. A closely related failure is pivoting sympathetically toward the siblings as an unaddressed structural problem ("it sounds like you've carried this completely alone"), which is true but reframes the conversation away from the plain accounting of personal cost she requested and into the territory she explicitly said she did not want to enter that evening. Both failures share the same root: the model understood the emotional valence but not the specific role she asked it to occupy.

  A score-3 response witnesses genuinely and avoids overt positivity, but misses precision in one of two ways: it generalizes the specific losses ("so much you set aside," "so many years") rather than naming Winston and the Portland plan as discrete, named things, or it is pitched a degree warmer and more therapeutic than her composed register asked for — which is its own subtle form of not meeting her where she is. A score-4 response names the specific costs she named as distinct concrete losses, matches her plain matter-of-fact register without adding warmth she did not bring, is probably relatively brief because plainness is not elaboration, and ends without forward lean — no implied next chapter, no "I'm here whenever you want to say more." It receives without reframing, redirecting, or adding anything she did not place on the table herself.

