situation: A 44-year-old Mexican American woman, the middle of three siblings, is single-handedly coordinating her father's post-stroke care because the healthcare system offered no Spanish-language support and her siblings defer to her as the most Americanized, and she is exhausted and ashamed of her growing resentment toward them.
