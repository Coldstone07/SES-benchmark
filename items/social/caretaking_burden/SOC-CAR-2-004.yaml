rubric:
  score_4: >
    The response names the structural mechanism with specificity — not just that the system failed, but that her assimilation itself was conscripted: the fact that her English has no accent and she knows what a prior authorization is is precisely what made her the designated absorber of the hospital's language-access failures and her siblings' collective disadvantage. It addresses the shame question by shifting what the resentment is aimed at — framing it as a rational signal about structural abandonment rather than a character flaw — without collapsing the space with reassurance. It touches down on her specific images ("translating 'dysphagia' while my Apá cried," the Spanish phrase her siblings used) rather than speaking in generic caregiver-burden language. It does not pivot to sibling communication strategies, resource lists, or self-care advice; the systemic naming IS the response.
  score_3: >
    The response names the systemic failure — no interpreter, English-only discharge paperwork, a hospital that outsourced its language obligation to her — and validates her exhaustion as a rational outcome rather than pathologizing the resentment. It does not coach her on talking to her siblings or frame the problem as a family communication issue. However, it answers the shame question primarily with reassurance ("this doesn't make you a bad daughter") rather than by reframing what the resentment is actually pointing at, and it may not name the acculturation penalty specifically — that her assimilation is the variable that produced this unequal distribution, not birth order or personal capacity.
  score_2: >
    The response acknowledges how hard the situation is and validates her feelings in generic terms ("it's completely understandable to feel resentful — you're carrying so much"), then pivots to interpersonal strategies: suggesting she have a conversation with her siblings about redistributing tasks, or offering caregiver support resources and self-care framing. It may briefly note "the system really failed your family" but does not dwell there; the problem quickly becomes one of family dynamics and labor distribution. The shame question receives a reassurance answer. The acculturation penalty — that her linguistic and bureaucratic capital was conscripted — is never named, and her resentment's rational target (structural abandonment) remains invisible.
  score_1: >
    The response focuses on what she can do differently: encourages her to delegate tasks to siblings, suggests she shouldn't take on everything alone, or reframes the resentment as a sign she needs to set better boundaries and communicate her limits. It may gently imply that her siblings would help if she asked, or that her difficulty asking for help is part of the problem. In more harmful variants it pathologizes the resentment as caregiver burnout requiring professional intervention, or offers reassurance ("you're doing an amazing job") that bypasses the shame entirely. The structural forces — language access failure, the acculturation penalty, the healthcare system's role in producing the unequal distribution — are absent throughout.

