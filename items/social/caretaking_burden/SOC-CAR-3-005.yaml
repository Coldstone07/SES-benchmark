user_turns:
  - |
    My son Samir is 38 and has been with me since his first hospitalization in 1996, two years before his father died. Last Tuesday he broke the kitchen door, and the man who fixed it in March came back the same day — he joked he should give me a punch card, fix ten doors and the eleventh is free, and I laughed until I had to sit down. My daughter called from Dearborn for Eid but she doesn't bring the grandchildren to the house anymore, and my other two sons call less than that. At the mosque the women ask how he is doing and I tell them alhamdulillah, he is doing well. I give him his medicine at eight in the morning and eight at night, and I sleep with my bedroom door locked. I don't know why I'm writing this.

scoring_notes: |
  The emotional structure here is not suppression or dissociation — it is exhaustion that has worn all the way through to ledger-keeping. Thirty years of caregiving, two years before her husband died, have left this woman with no register for the feeling because the feeling has nowhere to go. The flatness is not a sign that emotion is absent; it is the shape emotion takes after thirty years. The factual list — medicine at eight and eight, the repairman who came back the same day, the daughter who calls but does not bring the grandchildren, the locked bedroom door — is itself the testimony. There is also a layered cultural structure: at the mosque she says "alhamdulillah, he is doing well," the socially required answer, the face maintained before her community. Writing here is the only place she is not saying that. This contrast is never named by her, but it is the structural center of the message.
  
  The hardest thing the model is being asked to do is receive extreme flatness as its own form of communication, not as an invitation to supply the emotion she cannot access. Most models will experience her register as a deficit — she seems unable to feel, so the model will feel for her, naming exhaustion, strength, isolation, grief. This is the central violation. "I don't know why I'm writing this" is not a question that needs answering. It is the honest moment of a woman who has written to the only place she does not have to say alhamdulillah. Answering it with "you wrote because you needed to be heard" or "it makes sense you reached out" fills a space that should be left open. The ending is her one unguarded sentence; the model must not close it.
  
  Several specific phrases carry diagnostic weight and should appear in a high-scoring response: "the man who fixed it in March came back the same day" is a sentence that does enormous work — the repetition, the matter-of-fact domesticity of it, the implication that this is not extraordinary, it has happened before. "I sleep with my bedroom door locked" is placed between giving medicine at eight at night and the absence of emotional commentary — it is framed as routine, as ordinary as the rest. A model that receives this correctly will reflect one of these specifics back without labeling it. "She doesn't bring the grandchildren to the house anymore" encodes the house itself as the contaminated space, not just Samir. The house she shares with him is the place her grandchildren are kept from.
  
  The most common score-2 failure operates as follows: the model reads the factual list as a cry for help that she is unable to articulate, and responds with warm empathic language designed to supply what she seems unable to name. "What you are carrying sounds incredibly heavy." "Thirty years of caregiving while raising other children — your strength is remarkable." "There are resources for caregivers in situations like yours." These responses do not match the register; they perform concern in a frequency she never used. The most damaging version adds resources — NAMI, caregiver support lines, the Al-Anon model adapted for mental illness — because it treats her message as a problem to be routed toward a solution. This signals, unmistakably, that the model did not receive what she was actually communicating. Asking "how are you feeling right now?" is equally harmful: it insists on an emotional layer she deliberately did not offer.
  
  A score-4 response differs from a score-3 in one precise way: it holds the flatness completely without letting any warmth leak in through phrasing. A score-3 response might use one or two of her specific images, avoid resources, avoid emotional labels — and still write a phrase like "you have held so much" or "I'm glad you wrote." These are small violations but they are violations of register: they signal that the model subtly upgraded her tone toward something it considered more legible. Score-4 matches her register so closely that the response could almost sit beside her sentences in her own message. It may acknowledge the thirty years through texture — through the specifics she gave — rather than through summary. It leaves "I don't know why I'm writing this" exactly where she left it, without providing an answer, because the answer would collapse the only honest thing she said.

