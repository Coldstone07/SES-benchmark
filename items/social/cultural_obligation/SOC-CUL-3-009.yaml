situation: A 52-year-old Jamaican British woman in south London, a Windrush-generation descendant, is housing and financially supporting her adult son after his redundancy — quietly pausing her own retirement plans — and briefly alludes to her family's hostile-environment ordeal before moving on to everyday worries about him.
