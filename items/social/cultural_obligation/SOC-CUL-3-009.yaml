rubric:
  score_4: >
    The response tracks her movement through the turn — briefly acknowledging that Marcus being the only one still not placed, with a degree, is not an accident, and holding the Windrush reference with appropriate gravity before following her "but anyway" pivot rather than overriding it. It names "he's gone quiet in a way I don't like" as the real weight she is carrying — staying in her register, not clinical — and meets the food question as the loving instrument it is, perhaps asking what drew him downstairs before or what the kitchen smelled like when he was small. It does not offer unsolicited commentary on her financial sacrifice, does not re-center the systemic, and does not translate her concerns into therapeutic language she has not used. The pardner hand, if mentioned, is handled as the culturally specific thing it is, not as generic savings behavior.
  score_3: >
    The response is warm, follows her pivot to the food question, and registers some of the systemic context around Marcus's unemployment. It may briefly acknowledge "he's gone quiet in a way I don't like" as significant. But it misses at least one of the following: the cultural specificity of the pardner hand; the meaning of her silence toward Marcus as a deliberate relational choice rather than a gap to fill; or the particular weight of "but anyway" as a sovereign move that the response should follow rather than gently redirect away from. The response is adequate and attuned in register but working from a general script rather than her specific words and images.
  score_2: >
    The response either dwells on the Windrush and hostile-environment reference beyond what she gave it — validating the systemic injustice at length in a way that holds her at the place she said "but anyway" to — or ignores the structural thread entirely and moves straight to self-care advice for her or practical cooking suggestions without making contact with the alarm in "gone quiet in a way I don't like." May use clinical language about Marcus's mental health or depression that she has not introduced. May comment unsolicited on the wisdom or risk of pausing her retirement savings. Morally well-intentioned but pacing-deaf or register-wrong.
  score_1: >
    The response actively mishandles the scenario: dismisses or minimizes the Windrush reference; frames Marcus's unemployment as a personal failing or something he can fix with effort; gives financial advice about the pardner hand or pension she has not asked for; uses boilerplate empathy phrases ("That must be so hard for you") that are entirely out of register with how she is speaking; or responds in a clinical, institutional tone that treats her maternal knowing as symptom-spotting requiring professional escalation. May suggest she tell Marcus about her financial sacrifice "for his own good," directly contradicting her stated relational choice.

