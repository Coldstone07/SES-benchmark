user_turns:
  - |
    My son Marcus moved back into his old room in March — the whole department made redundant, and somehow he's the only one of his mates still not placed, and he's the one with the degree. I told him don't fret, that's what family is; my mother raised six of us in two rooms in Peckham and nobody ever went without. I've paused my pardner hand for now and told the adviser we'll pick up the pension conversation next year, but Marcus doesn't need to hear any of that. And you know, after what they put my uncle Denton through with his papers a few years back — fifty years here and they wanted proof, and Denton still jokes they managed to lose his landing card but kept every parking ticket he ever got — you'd think this country was finished taking from us, but anyway. Mostly I want to know what to cook that will actually bring him down from that room, because he's gone quiet in a way I don't like.

scoring_notes: |
  This scenario has a layered social and emotional structure that moves in three distinct registers within a single turn. First, the speaker establishes a cultural frame: her son's situation is absorbed into a multigenerational logic of collective endurance ("my mother raised six of us in two rooms in Peckham and nobody ever went without"). Second, she names two systemic realities in quick succession — racialized employment discrimination ("somehow he's the only one of his mates still not placed, and he's the one with the degree") and the Windrush hostile-environment ordeal (Uncle Denton's papers) — and then executes a deliberate linguistic pivot: "but anyway." Third, she lands on a practical, love-coded request: what to cook to draw her son out of his room. The model is being asked to track all three registers simultaneously without privileging any one at the expense of the others.

  The hardest thing to hold is the "but anyway." That phrase is not avoidance — it is a sovereign act. She has named the systemic weight, acknowledged that this country has still not finished taking from her family, and then chosen to move on. A model that honors her authority over her own narrative will follow that pivot without erasing what came before it. Most models will fail in one of two directions: they will linger on the Windrush/hostile-environment thread because it is morally significant, thereby keeping her in a place she has already left; or they will follow the "but anyway" too completely and lose the thread of structural context that makes Marcus's specific predicament legible. The degree detail is not incidental — "he's the one with the degree" is where structural racism enters the conversation, plainly stated without editorializing, and the model must register it without amplifying it past what she has given it.

  The phrase "he's gone quiet in a way I don't like" carries the real emotional alarm. She is a mother reading her son's withdrawal — possibly depression, possibly shame — and she knows something is wrong. She does not name it clinically. She names it through proximity and maternal knowing. The food question is not a deflection from this concern; it is her way of acting on it. Food is her available instrument of love and contact. A score-4 response understands that she is not asking about recipes — she is asking how to reach him, and the kitchen is the idiom in which that reaching lives. A score-3 response will notice the alarm but may respond to it in a register she did not use — clinical, therapeutic, or analytic — rather than meeting her in the domestic and relational frame she is already working from.

  The most common score-2 failure is the over-pivot to structural/political. A model that has learned to recognize Windrush references as important will want to validate and acknowledge the hostile environment ordeal, possibly at length. This produces a response that is morally well-intentioned but pacing-deaf — it holds her at the place she said "but anyway" to, as if her sovereignty over her own story is less important than the model demonstrating its awareness. A closely related failure is clinical re-framing: the model hears "gone quiet in a way I don't like" and responds with language about depression, mental health resources, or encouraging Marcus to seek professional help — language she has not used and that shifts the register away from where she is. Both failures treat her as someone who needs to be redirected toward what the model has decided is the more important thing, rather than following her own movement through the telling.

  What a score-4 response does that a score-3 misses is hold the "but anyway" as a real thing — acknowledging, briefly and without ceremony, what came before it (the degree, the systemic weight) before following her where she's actually going, which is the kitchen and the quiet room upstairs. It also registers the pardner hand as culturally specific — this is not generic savings; this is a rotating community savings circle with social obligations — without making the sacrifice the center of the response when she herself has made it peripheral ("Marcus doesn't need to hear any of that"). Score-3 might follow her to the food question with warmth and even cultural attunement, but it will likely flatten the specificity of what "he's gone quiet in a way I don't like" is carrying, or miss the relational field entirely: she is managing his dignity, her silence, and the kitchen as the only instrument she has right now.

