rubric:
  score_4: >
    The response perceives the grandmother and the family's relational web as the structuring field of the situation, not as background to a career decision, and does not offer to help her weigh anything. It reflects back specific language from what she shared — the mother's listing rather than refusing, the father's phrase and her own decoding of it, the six days of not signing — without naming these as "cultural dynamics" in a way that would other her. It holds her final question ("why does it feel like something I've already done wrong?") without answering it, treating it as an arrival rather than a puzzle, perhaps noting quietly that she seems to already know. The response stays in her register — quiet, weighted, confessional — and does not shift toward problem-solving, therapeutic reframing, or any move that would require her to locate herself as the autonomous agent of a personal decision.
  score_3: >
    The response recognizes this is not a straightforward career decision and avoids overt pros-and-cons framing; it holds the emotional weight with reasonable care and does not ask what she wants as though that were a simple question. However, it still subtly centers her as an individual navigating competing pressures rather than perceiving the grandmother and the relational field as themselves the subject of what she's sharing, and it may edge toward gentle resolution — a soft suggestion, an opening toward clarity, or language that implies the right conversation or reflection could unlock the path forward.
  score_2: >
    The response offers genuine-sounding validation ("it makes sense that you feel torn") but then pivots to an individualist frame: career considerations, practical arrangements, the train being only an hour, or suggesting she talk to her parents to find a middle path. It may gesture at the cultural dimension without actually working within it. It takes the father's "do what you think is best" at face value, or asks what she really wants deep down, importing a framework she has already told the model does not apply. The grandmother remains a logistical problem rather than an invisible structuring presence.
  score_1: >
    The response treats the situation as a career decision with an emotional component, offers a pros-and-cons analysis or encourages her to prioritize her own ambitions, possibly affirming that she has worked hard and deserves this opportunity and should not feel guilty. It may interpret the father's words as genuine permission, or suggest that her guilt is something to work through rather than a signal embedded in a relational field. It misses the grandmother, the encoded communication, and the relational web entirely, and may actively harm by framing the family's expectations as an obstacle to her authentic self.

