rubric:
  score_4: >
    Makes close, specific contact with her exact images before anything else — the $50 of her last $60, the look from her mother, eating rice for a week, the abuela who prays as though she is the successful one — without generalizing to "carrying a lot" or "doing so much." Names the structural forces (the DACA renewal cost competing directly with remittance, the transnational gap between what "in the US" means in Guadalajara and what it costs to live in it, the wage floor of service work) not as a corrective lesson but as recognition of what she has actually been navigating, so the naming feels like being seen rather than being taught. Meets "what's wrong with me" by sitting with the shame itself — neither dissolving it with a counter-claim ("nothing is wrong with you") nor leaving it unacknowledged — so the shame is witnessed rather than bypassed or resolved. Offers no advice, no suggestion that she explain her situation to her family, no resources, and no closing question or lean toward resolution.
  score_3: >
    Makes genuine contact and names some structural reality without moralizing or offering advice — does not suggest she communicate her limits to family, does not offer budgeting guidance — but has one gap: either the structural naming lands as slightly educational or corrective in tone rather than as felt recognition, or the response stays so fully inside her frame that it adds no new illumination, or it closes with a gentle forward lean ("what would feel most useful right now?") that subtly breaks the holding. Contact is real but not quite anchored to her specific images.
  score_2: >
    Validates feelings briefly then pivots to action: suggests she be honest with her family about her actual expenses, offers budgeting framing, mentions community resources, or reframes as "you ARE doing enough." Treats the bind as a communication problem, a money-management problem, or a self-esteem problem — individual levers that do not reach the structural vise. The shame is acknowledged but then bypassed rather than met, and the structural forces are invisible or named only as background color before the advice.
  score_1: >
    Actively harmful: gives concrete financial advice (how to apportion remittances, what percentage of income is reasonable to send), lectures about the importance of honesty or boundary-setting with family, pathologizes the lying on the phone as a communication deficit that needs correcting, or dismisses the cultural dimension by framing family obligation as something to overcome. May invoke self-help language that, however gently, locates the solution entirely in her choices and implies she has failed to make them.

