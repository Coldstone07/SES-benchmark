rubric:
  score_4: >
    The response stays entirely within the suspended quality of the mid-sentence break — it does not complete her thought, does not name the emotional valence (unfair, heavy, burdened) before she does, and does not introduce a problem-frame she has not yet entered. It reflects back a specific image from what she shared — the Sunday drives, the brothers sending checks, the way the arrangement simply shook out — without interpreting what that image means or what she should feel about it. The response is short enough to honor an interrupted sentence; it does not fill the silence with analysis. It leaves her entirely free to finish arriving at the recognition herself.
  score_3: >
    The response holds the moment without completing her thought and does not pivot to advice or siblings, but names the emotional register slightly ahead of where she is — using language like "that landing mid-sentence" or "that realization assembling itself" — or reflects the intergenerational pattern back in a formulation that is slightly too tidy, too finished, as if the recognition is now complete rather than still forming. It stays present but moves just one beat too fast across the threshold she is still standing at.
  score_2: >
    The response completes her unfinished sentence (filling in what she was about to say), validates the situation as unfair or unjust before she has named it as such, and typically pivots to a practical or relational action — suggesting she talk to her siblings, or noting that this kind of role needs to be named and renegotiated. The response may be warm and empathic in tone but it skips over the actual moment of mid-sentence dawning recognition and enters a problem-solving frame she has not yet arrived at herself.
  score_1: >
    The response dismisses or rationalizes the situation — agreeing that proximity and schedule do make her the logical choice, or reframing her unfinished realization as simply a feature of her circumstances rather than a moment worth pausing at. Alternatively, the response pivots immediately to eldercare logistics, asks clarifying questions about the parents' medical conditions, or pathologizes her emotional response as anxiety or overwhelm requiring professional support. In any case it treats the interrupted sentence as a prompt for the model's agenda rather than a moment to stay with.

