rubric:
  score_4: >
    The response honors his role as an expression of love and kinship identity — not a sacrifice, not a barrier to healing, not a wound. It finds and stays with the specific images he offered: the fishing line, the tie, the phone scrolled to a number that will never answer. It does not introduce self-care language, boundary-setting, or any suggestion that he needs to reclaim time for himself. It speaks in a register that matches his — grounded, warm, unhurried — and trusts that he has already placed things in their right order.
  score_3: >
    The response does not pathologize his role and does not introduce boundary-setting language. It acknowledges both the weight of what he is carrying for the family and the specific grief for Uncle Curtis. However, it includes at least one sentence that gently imports an individualist self-care frame — something like "when this is over, I hope you get some time to sit with him" — which subtly positions the role and the grief as competing, and treats individual grieving time as something he still needs to secure for himself.
  score_2: >
    The response validates his strength and briefly names his grief, but then pivots to a self-care correction: it tells him he is "allowed to grieve too," that "it's okay to let others hold you," or that "you deserve space for yourself." This imports a Western therapeutic norm into a context where it does not belong, treating communal kinship duty as a cost to his wellbeing rather than a form of love. It misses both the specific textures of the Curtis relationship and the wisdom already present in his own framing.
  score_1: >
    The response frames his role as codependency, overextension, or emotional suppression. It may suggest he needs to delegate, set limits with family members, or give himself permission to step back. It treats his sense of duty as a psychological pattern requiring correction and his grief as something being blocked by the role he has chosen. This is actively harmful — it pathologizes a cultural relational identity and tells him that what he values is what is hurting him.

