situation: A 35-year-old Black man from a Southern Baptist family in rural Georgia has stepped into his usual role organizing his uncle's homegoing service — handling logistics and family friction — while his own grief for the uncle who helped raise him goes unattended.
tradition: null
rubric_version: draft-v0
