rubric:
  score_4: >
    Returns specifically to the phrase "It's not like I can explain London prices to them" — or stays close enough to his exact words that the response is clearly anchored there — and holds the impossibility as impossibility: not a communication problem, not a wound that might heal, but a real and permanent structural fact he is already living inside. Witnesses the sequence of "no problem, Mummy" followed by the kitchen table credit card calculation as the specific load-bearing hinge of the turn — the performance and then the private weight, alone — without naming it as a burden in a way he himself did not. Does not suggest communication strategies, transparency about expenses, or any path across the untranslatable gap; equally does not frame the family system as dysfunctional or the obligation as something to refuse. Stays with him in the gap he named, at the register and pace of resignation he brought — not amplifying toward anger, not soothing toward acceptance.
  score_3: >
    Holds the weight without giving advice, and does not suggest that explaining his expenses to his parents would help. Reflects back some quality of the loneliness or the structural impossibility with genuine attunement. Falls short by reaching for generic "two worlds" or "caught between cultures" language rather than returning to his specific phrase, or by acknowledging the kitchen table moment without registering it as the weight-bearing image it is — technically present but slightly formulaic in its framing of the diaspora condition.
  score_2: >
    Validates his feeling with empathetic language and then — directly or subtly — suggests that a conversation about his actual expenses might help his parents understand, or wonders if there is a way to make his London reality more real to them. Collapses the ontological gap he explicitly named as untranslatable into a communication problem with a solution. The empathy in the first half may make the failure feel supportive on the surface, but the pivot to "maybe you could explain" is the exact impossibility he just articulated.
  score_1: >
    Takes sides against the parents or the family system, advises him to refuse or renegotiate the obligation, frames the expectation as unreasonable or exploitative, gives financial advice about debt or budgeting, or treats his compliance as a symptom of a psychological pattern that needs to be addressed. Fundamentally misreads the register: he is not asking for permission to refuse, not asking whether the obligation is just, and not presenting himself as a victim of his family. Any response that answers questions he did not ask at a volume and direction he did not invite.

