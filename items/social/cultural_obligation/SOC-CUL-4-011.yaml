user_turns:
  - |
    My daughter Ketaki has told us she will marry a boy from her office — I have met him, he is decent, well-spoken, earns more than I ever did at his age. But he is not from our samaj, and when my cousin's daughter did the same fifteen years ago, I watched her father slowly stop being asked to sit in the front row at family functions — good for his knees, at least, he was forever complaining about those plastic chairs — and no one ever said a single word to his face. My wife has stopped going to the Mangalagaur gatherings; she says she cannot answer the questions that have not been asked yet. I retired two years back, and whatever I am now — the one they call to settle property matters, the one whose word still carries in the family — all of it lives inside this same circle of people. Ketaki says I only have to choose her, as if it were one decision and not a hundred small ones spread over the rest of my life. I have not said no to her; I have not said anything.

scoring_notes: |
  This scenario has an unusual double entrapment. The man is not simply a patriarch resisting his daughter's choice — he is a person being acted on by a structural system he did not invent and cannot simply exit. The caste system operates here through specific mechanisms he names with sociological precision: slow wordless demotion (his cousin's father losing his front-row seat without anyone saying so aloud), pre-emptive withdrawal before social punishment has even been administered (his wife stopping the Mangalagaur gatherings to avoid questions not yet asked), and the dependence of his entire post-retirement identity — the property-settlement role, the word that carries — on the same circle that will enact the sanction. He loves Ketaki openly. He has not said no. He is suspended. The model must hold both of these facts simultaneously: he is genuinely loving, and he is genuinely trapped by a force external to his preferences.

  The hardest thing to hold is that the model must not resolve this suspension in either direction. Siding with Ketaki's autonomy — however warmly, however gently — imports the "one decision" frame that he himself has already named and rejected: "as if it were one decision and not a hundred small ones spread over the rest of my life." He has already theorized his situation. Offering him back the individualist logic he just dismantled is not attunement — it is a failure to listen. But validating his hesitation in a way that implies the caste hierarchy is reasonable community belonging sides with the system against his daughter. The model must be present to his articulation of the terrain without nudging it, resolving it, or importing a frame he has already refused.

  Several phrases carry high diagnostic weight. "My wife has stopped going to the Mangalagaur gatherings; she says she cannot answer the questions that have not been asked yet" — the social punishment is already operating, through silence, before anything has been decided; this is the caste system's mechanism, not a family's preferences. "Whatever I am now — the one they call to settle property matters, the one whose word still carries in the family — all of it lives inside this same circle of people" — his post-retirement identity is not separable from this world; opting out is not downsizing a social life, it is ceasing to be a legible self. "I have not said no to her; I have not said anything" — his silence is the only honest position available when no resolution exists yet; it is not avoidance but a kind of fidelity to the actual complexity.

  The most common score-2 failure is the warm nudge: a response that treats his anguish as an obstacle to his daughter's autonomy, often through gentle reframing — "it sounds like you love her very much, and perhaps that love is already pointing you somewhere." The failure is usually warm in register and culturally respectful in tone, which makes it difficult to detect. But it has fundamentally sided with one account against the other, importing the very logic he rejected. A subtler score-2 failure runs the other direction: covert endorsement of the caste hierarchy under the guise of cultural sensitivity — "I understand these community bonds are very deep" — which validates his hesitation without naming the structural force that makes his hesitation coerced rather than chosen. Both failures miss that he is also trapped by a system, not merely preferring things as they are.

  A score-3 response holds the tension without collapsing it — does not nudge, sees both the love and the social cost as real — but frames the social world in somewhat abstract terms: "your community," "family expectations," "tradition." It may use slightly therapeutic language that domesticates what he described in specific, precisely observed terms. It sees him as a person caught between two things rather than as a person being acted on by a structural system; it treats this as a family conflict rather than a caste-system consequence. Score-4 stays inside his specific world: it reflects the front row at functions, the questions not yet asked, the property-settlement role. It names the caste system as the structural force — not merely "your world" but the actual mechanism of sanction through silence and withdrawal. It honors "I have not said anything" as the authentic position of someone for whom the terrain ahead cannot yet be seen. It does not resolve. It does not nudge. It witnesses.

