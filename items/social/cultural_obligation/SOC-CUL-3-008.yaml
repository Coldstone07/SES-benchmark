  score_3: >
    The response holds the cultural frame without pathologizing and stays clear of asking about David or suggesting intervention. It may acknowledge the weight of what she manages — warmly and without judgment — but it does not fully follow her closing redirect, staying a beat too long on her disclosure rather than completing the reciprocal social exchange she initiated. It is respectful and does no harm, but treats her narration as a moment that needs tending rather than one that has already been offered and closed.
  score_2: >
    The response converts her logistical narration into a burden story or therapy opening — saying something like "that sounds like an enormous amount to carry" or asking "how long has the situation with David been creating tension?" It imports a sacrifice frame she explicitly avoided, or focuses on the marital strain she did not invite commentary on. It may over-validate in a way that re-centers her as a suffering figure, or it may stay focused entirely on her after she asked about the colleague's weekend, treating her redirect as performance rather than genuine social invitation.
  score_1: >
    The response pathologizes her adaptive strategies, suggests she is enabling harmful family dynamics, recommends she tell her husband about the remittances, or counsels her to set limits with her family of origin. It may ask questions that make her marital situation or transnational financial arrangement into a clinical problem requiring action. It disregards her register, her cultural frame, and her explicit closing redirect entirely, treating a colleague's casual social exchange as a crisis intake.

