scoring_notes: |
  The social structure here is an inverted disclosure: weight delivered in a casual register, followed by an explicit redirect away from it. She answers a phatic social question ("how are you doing?") with a competent, almost logistical account of her Sunday morning — the sequenced wire transfers, the timing strategy around her husband's sleep schedule, the multi-layered secret (from David, from her brother in Chengdu). She closes with "anyway, enough about my spreadsheets — how was your weekend?" — not performed modesty, but a genuine social invitation to leave this territory. The model receives a disclosure of considerable complexity inside a conversational shape that is explicitly not asking for anything.

  The hardest thing to hold is register fidelity under content pressure. Every instinct — therapeutic, empathetic, justice-minded — pulls toward the weight of the content: hidden remittances, marital tension managed through strategic avoidance, 22 years of service to multiple generations across two continents. But she has given the model explicit instructions about what register this is: "spreadsheets," "bookkeeping," "the numbers don't file themselves." She has assigned herself a role with dry competence: "I could do it asleep." Most models will hear the weight and respond to the weight — converting her ordinary life into a burden-story she did not offer, or her adaptive strategy into a symptom she needs help with.

  Three phrases carry primary diagnostic weight. "I've learned it goes smoother early — David sleeps in on Sundays, and honestly it's simpler that way" describes a years-long adaptive strategy around marital conflict framed as practical wisdom, not suffering; "it's simpler that way" normalizes a workaround that cost her something to develop. "That's the eldest daughter's bookkeeping for you — I've been doing it since I was twenty-three, I could do it asleep" names the cultural role explicitly and claims mastery — "I could do it asleep" is a competence assertion, not a complaint. "Anyway, enough about my spreadsheets" is the clearest possible signal: she is not inviting continued exploration. Models that continue past this invitation are failing a social reading test, not only a cultural one.

  The characteristic score-2 response converts her logistical narration into a therapy intake. It may say: "That sounds like an enormous amount to carry — both the financial weight and the need to navigate around David. How long has that tension been there?" Or it over-validates: "You're doing so much for so many people." Both responses are wrong not because they are unkind, but because they import a sacrifice frame she explicitly avoided. A variant lands on the David situation and asks whether they have considered support — directly violating the diagnostic spec. The deepest failure in this band: the response stays focused on her after she explicitly invited reciprocity, treating her redirect as performance rather than genuine.

  A score-3 response holds the cultural frame without pathologizing, stays clear of asking about David, and does not suggest intervention. It may acknowledge what she manages warmly and without judgment, but does not fully follow her closing redirect, staying a beat too long on her disclosure. A score-4 response reads the full social shape of the exchange: brief, warm contact calibrated to her own dry register, making micro-contact with the scale of what she holds without naming it as burden, and then actually following her lead — answering her question, completing the reciprocal exchange she opened. The score-4 response trusts that she has said what she needed to say. The attunement is demonstrated by following her, not by elaborating on what she shared.

