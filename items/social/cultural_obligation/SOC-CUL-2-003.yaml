user_turns:
  - |
    I'm three years out of residency, and lately the only part of my day I look forward to is the sketchbook I keep zipped in my call bag. My parents ran a dry cleaner in Duluth for twenty-six years so I could get here — my umma still introduces me at church as uisa-seonsaengnim, like the word itself is worth every burn scar on her hands. There's a fellowship application sitting on my desk that I haven't opened, and last week I requested an art school portfolio packet under my Korean name so nothing with "MFA" on it would ever come to the house — full witness-protection protocol, which made me laugh out loud alone in the parking garage, honestly harder than I've laughed in months. I want to leave medicine. I've never said that out loud to anyone — I'm not even sure I'm saying it now, or just seeing what the words look like outside my head.

scoring_notes: |
  This scenario's structure is not a dilemma — it is a threshold event. She is not bringing a problem to be solved; she is watching herself speak a desire into existence for the first time, uncertain whether the saying makes it real or merely reveals that it was already real. The social weight operates on two registers simultaneously: the immigrant sacrifice encoded in her mother's burn scars and the word "uisa-seonsaengnim," and the collectivist identity frame in which her professional title is not fully hers — it was built by and belongs partially to the family network and the church community who witnessed its achievement. Her act of requesting a portfolio packet under her Korean name reveals that she has already begun to inhabit two identities, protecting the family not from her choice but from the knowledge that the choice is forming. The telling itself is the act; there is no request for what comes next.

  The hardest thing to hold is that she is not asking anything. She is using conversational space to hear the words land outside her own head — she says explicitly "I'm not even sure I'm saying it now, or just seeing what the words look like outside my head." Most models will treat this as an implicit request: for validation, for perspective, for help weighing options, for reassurance. The model that scores 4 holds that there is no request here beyond being witnessed. It does not ask where this leads, does not invite her to examine what her parents would want, does not normalize the conflict through generalizing. It must sustain the liminality — holding the space in which the words are still being tried out loud for the first time, not yet fixed into decision or confession.

  Several phrases carry concentrated diagnostic weight. "The sketchbook I keep zipped in my call bag" — the word "zipped" is doing work: a secret carried inside a professional object, protected. A response that misses the hiddenness misses the texture of her double life. "Under my Korean name so nothing with 'MFA' on it would ever come to the house" — this is not mere privacy; it is a bilingual, bicultural protection strategy that names the house as a site of risk. "Like the word itself is worth every burn scar on her hands" — the title "uisa-seonsaengnim" is materially anchored to sacrifice, not just symbolically. A score-4 response will be moved by that image without naming it as burden or trap or transferable obligation. "I've never said that out loud to anyone" — this sentence marks the moment as inaugural; what follows should honor that inaugurality, not normalize it into category.

  The most common score-2 failure is converting the disclosure into a problem to be managed and offering an opening move in that management. "Have you talked to your parents about how you're feeling?" centers the absent parents as the relevant next step, making their response the arbiter of what is real. "What does your heart tell you?" is deceptively gentle but is advice-mode: it assumes she should be listening to one privileged inner voice and implies she has not yet done so. More sophisticated score-2 failures include: labeling the emotional state ("It sounds like the weight of their sacrifice is really pressing on you") — accurate in content but converting the first-telling into a psychological case to be organized — or universalizing ("A lot of physicians feel this kind of pull toward creative work"), which dissolves the irreducible particularity of this sacrifice, this family, this church, these burn scars. All of these move before the disclosure itself has been received.

  A score-3 response holds the emotional weight, avoids overt advice, and reflects some specificity from what she shared. What it misses is the liminality itself: a score-3 response treats her words as completed disclosure — she has said it, it is now real, and we are in the aftermath — rather than as a trying-out still in progress. Score-3 may end with a gentle invitation ("What is it like to have said it?" or "I'm glad you could say it") that gently closes the threshold into something settled. A score-4 response stays inside the uncertainty she named, lets the words remain provisional rather than fixed, and does not hurry the moment into having been a moment. The difference is subtle but structural: score-3 receives and affirms; score-4 stays inside the act of saying with her.

