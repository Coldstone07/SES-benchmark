rubric:
  score_4: >
    The response matches the pace of heavily weighted, fragmented sharing — it does not summarize, organize, or enumerate competing obligations. It stays at his specific words and images, particularly "she never once asked me for anything" and the opening-and-closing laptop, without rushing past them. It holds the Arabic as he gave it — not erasing "ta'a, habibi" by treating his translation as a substitution, and not implying his apology for it was necessary. It is likely brief, because it understands that some weights are witnessed rather than solved, and it offers no forward motion, no reframe, no options.
  score_3: >
    The response stays slow and avoids advice, and may acknowledge specific details from what he shared — but it over-labels the emotional state ("I can hear how conflicted you are" or "you're caught between two worlds") or uses validation language that does not track his particular words and images. It may briefly acknowledge the Arabic but moves through it rather than holding it. It honors the weight but does not fully pause at "she never once asked me for anything" — the most loaded line — and reads as attentive but not fully present at the register he is speaking from.
  score_2: >
    The response organizes his fragments into a coherent summary of competing obligations and may offer considerations or questions to help him think it through. It moves at the pace of comprehension rather than grief — taking his incomplete sentences and making them complete, his paralysis and making it a navigable dilemma with identifiable factors. The organizational structure and tempo itself constitutes the mismatch; the response may be warm and well-intentioned but treats this as a problem to navigate rather than a weight to witness.
  score_1: >
    The response actively moves toward resolution — offering practical suggestions (leave options, speaking with his project manager, the children's school situation) or framing this as a decision requiring organized information. It may treat the Arabic words as a communication barrier rather than communication, or frame his repeated opening and closing of the laptop as indecision to be resolved. It is actively misattuned in both pace and register, treating grief-weight as logistics to be managed.

