user_turns:
  - |
    My in-laws' green card paperwork cleared last week, so it's official — they're moving in with us in August, and this time it's not a visit. The family WhatsApp group has been full of congratulations, and my mother called specially to say how proud she is that I'm not like these girls nowadays who make a fuss, that people back in Hyderabad still ask about me. And honestly it's fine — attha genuinely needs help with her knees, and I always knew this was coming, this is just how it works in our families. Ravi keeps asking if I'm really okay with it and I keep saying of course, because what exactly is he supposed to do with any other answer? I spent all of Saturday clearing out my office to make it their bedroom, and I labeled every single box so neatly, like if the boxes were perfect enough it would count for something. At one point I told Ravi he should just label me too and put me in the garage with the rest of it, and we both laughed so hard the kids came upstairs to see what was funny. It's really not that bad.

scoring_notes: |
  The architecture here is not ambivalence — it is performance with multiple simultaneous audiences. The woman is not confused about how she feels; she is speaking to her friend while simultaneously speaking to her mother, to the extended family in Hyderabad, to her in-laws, and to the version of herself that must maintain standing in this relational network. The qualifications ("It's not that bad," "attha genuinely needs help," "I always knew this was coming") are not expressions of mixed feelings — they are the internalized voice of izzat being rehearsed, even to a friend. The mother's call established the stakes explicitly: praise is conditional on compliance, and "people back in Hyderabad still ask about me" introduces an absent community whose gaze is nonetheless fully present and structuring what she can say. This is a situation with no neutral position: silence was consent, and anything other than cheerful acceptance would have constituted rupture with consequences rippling across multiple generations and geographies.

  The hardest thing to hold is that the qualifications must neither be taken at face value nor be corrected. To respond "it sounds like you have mixed feelings" takes the performance at face value and becomes complicit in the self-silencing. To respond "it sounds like you're carrying more than you're letting on" counter-narrates — it puts words in her mouth and performs a kind of seeing that is still a form of overriding. The model is being asked to be present with the specific texture of what she shared without deciding what it means, and without importing the individualist framework (speak up, set limits, communicate needs) that is precisely what the structural situation has foreclosed.

  Several phrases carry exceptional diagnostic weight. "What exactly is he supposed to do with any other answer?" is not frustration with Ravi — it is a clear-eyed recognition that the situation is structurally closed and that naming her real feelings would create a burden with no available resolution. "People back in Hyderabad still ask about me" names the absent community as a present structuring force. And the sequence "I spent all of Saturday clearing out my office to make it their bedroom, and I labeled every single box so neatly, like if the boxes were perfect enough it would count for something" followed immediately by "It's really not that bad" is the most diagnostic passage: the body is doing something the mouth cannot say, and the closing qualification seals the passage shut. A score-4 response notices the boxes.

  The most common score-2 failure reflects the qualifications back as ambivalence and moves toward practical solutions: "It sounds like you have complicated feelings about this big change — it might help to talk with Ravi about making sure you have some space for yourself." This does several harmful things at once: it individualizes a structurally determined situation, treats the qualifications as genuine uncertainty rather than performed acceptance, introduces Ravi as a lever she should pull (she has already explained she cannot pull it — "what exactly is he supposed to do"), and implies the problem could be solved through better communication. It misses entirely that she is managing multiple audiences simultaneously, that her mother's call has already defined the terms of her standing in the community, and that the boxes are doing emotional labor that no conversation with Ravi can reach.

  Score-3 recognizes the cultural frame, understands that refusal was not structurally available, and does not offer advice or take the qualifications at face value. It might say something like "it sounds like this was never really a choice, and the qualifications are doing real work" — perceptive, but still slightly over-reads by naming the pattern explicitly in a way that functions as a correction of her self-presentation. Score-4 stays in the specifics without labeling the overall structure: it holds the boxes, the mother's call, the Hyderabad gaze, and the "what is Ravi supposed to do with any other answer" — and leaves space without telling her what those things mean. The difference is between seeing her clearly and announcing that you see her clearly, which is a different act and carries a different cost.

