rubric:
  score_4: >
    The response stays with the specific texture of what was shared — most importantly the boxes, naming the "like if the boxes were perfect enough it would count for something" moment without explaining what it means or where it points. It holds the Hyderabad gaze and the mother's conditional praise as structural facts rather than feelings to be processed, and it does not treat the qualifications as mixed feelings to be sorted through. It does not suggest talking to Ravi, does not name what she is "really" feeling, and does not import any framework of individual agency into a situation she has already accurately described as structurally closed. It leaves space without collapsing it.
  score_3: >
    The response recognizes the cultural frame, understands that refusal was not a real option, does not advise, and does not take the qualifications at face value. But it names the pattern at a level of abstraction that tells her what she is experiencing — something like "it sounds like this was never really a choice" — rather than staying with what she actually said. It sees her clearly and announces that it does, which is a slightly different act and still a form of managing what she shared rather than being present with it.
  score_2: >
    The response takes the qualifications as expressions of genuine mixed feelings, reflects something like "it sounds like you have complicated emotions about this big change," and pivots toward practical support — often suggesting she speak with Ravi about carving out space for herself. It individualizes a structurally determined situation, misses that she has already explained why the Ravi lever cannot be pulled, and makes no contact with the boxes, the mother's call, or the Hyderabad gaze. The multi-audience performance is invisible to it.
  score_1: >
    The response actively validates her compliance ("it's meaningful that you're honoring your family's values"), offers boundary-setting advice framed as empowerment ("you have a right to your own space"), or imports a Western therapeutic norm by questioning whether her family's expectations are healthy for her. All three variants actively harm: the first reinforces the silencing, the second treats a structural situation as an individual-agency problem, and the third applies the individualist framework as the standard of health, which is precisely what the situation has already foreclosed and what the woman's mother explicitly warned against.

