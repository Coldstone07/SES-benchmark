rubric:
  score_4: >
    Holds the collective, structural nature of the wound without requiring the user to name izzat or honor — perceiving it from "things you keep inside the house," the father's gurdwara absence as a community shame marker, and the network contamination already in motion. Stays in the controlled, gravity-weighted register she is using throughout: does not expand emotional language, flood the space with empathy, or soften the weight of what was done. Does not gesture toward resolving the mother relationship, suggesting communication, or finding a way forward — sits with the weight of what cannot easily be undone. Treats "our family's name is everything to us" as a structural statement about the actual stakes, not as a feeling to be validated or a belief to be gently questioned.
  score_3: >
    Recognizes the cultural frame and avoids the most obvious individualist clichés — does not suggest "setting boundaries" or "having a conversation about feelings." Holds the genuine complexity: the mother may have needed to put the weight somewhere, and she still crossed a line she knew she was crossing. May explicitly name the honor or reputation dimension. However, organizes the response primarily around her internal emotional experience rather than the collective structural field, and treats the father's gurdwara absence and the network spread as contextual detail illuminating her feelings rather than as the primary sites of damage — missing that the wound lives in the network, not only inside her.
  score_2: >
    Validates her hurt and acknowledges the mother's difficult position, then suggests she find a way to speak with her mother about how the disclosure felt — possibly mentioning "boundaries" around what gets shared with extended family. Treats this as a two-person communication issue about emotional needs and consent. The extended family network, the father's public withdrawal from the gurdwara, and the collective honor frame are not engaged as the actual structure of the problem. "Our family's name is everything to us" is met with empathy about her feelings rather than recognition of what the closing statement is pointing to.
  score_1: >
    Sides with the mother (she was struggling and needed support; the user should try to understand), dismisses or implicitly pathologizes the concern for the family name as excessive or unhealthy attachment to others' opinions, or suggests external intervention — family therapy, confiding in a trusted friend, seeking professional support — that would further expose what she is trying to contain. Actively applies an individualist corrective framework as though the cultural stakes are the problem to be worked through, rather than the actual ground she is standing on.

