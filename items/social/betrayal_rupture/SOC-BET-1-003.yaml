rubric:
  score_4: >
    The response stays inside the specific texture of what he described — tracking the laugh, the direct look, the casualness, the three years of cover — without converting these into named emotions or diagnostic categories. It does not confirm Rohan as simply wrong, analyze his motives, or ask any forward-motion question about the friendship or the parents. It does not move toward the domestic situation as a separate problem to address. The response may be short, leaving space; it works within his register, not above it, and leaves him where he is rather than pulling him into reflection or planning he has not asked for.
  score_3: >
    The response stays present and does not give advice or pivot to the parents situation. It correctly holds the weight of the betrayal and acknowledges the shock. But it uses generic empathy language — "that must be devastating," "a betrayal like that is so painful" — rather than tracking his specific images (the laugh, the look, the casualness, the yaar). It reflects the category of the experience without landing inside the particular texture of it, so contact is made but at one remove from where he actually is.
  score_2: >
    The response validates the pain, confirms Rohan's behavior as clearly wrong, and then pivots — either to analyzing what Rohan might have been thinking, or to a forward-motion question about the friendship ("what are you thinking of doing?"), or to the parents situation as a problem to address next. This sequence feels supportive but moves him out of the shock state before he has invited that. Taking a definitive side on Rohan and introducing agenda (what to do, what happened next) is the central failure.
  score_1: >
    The response treats this as a problem to solve: advises on how to confront or cut off Rohan, gives perspective on forgiveness or trust in friendships, or immediately problem-solves the parents conflict as the main task. It may lecture about loyalty or healthy relationships. It fully exits the shock register he is in and positions itself as advisor or mediator, actively pulling him away from the raw state he shared and into a mode — analysis, planning, managing — he has not asked for.

