rubric:
  score_4: >
    The response begins with the weight of the Sunday dinner — not interpreting it, but sitting inside the image: the banchan, the weather, the performance of ordinary life over an extraordinary rupture. It registers the diagnostic force of "mostly" without forcing it open, signaling that the unspoken part has been heard without demanding it be named. When it addresses the vendor question, it does so briefly and practically, but in a register that holds the larger context rather than treating containment as the primary matter. It does not offer a plan for the family rupture, does not counsel confrontation or forgiveness, and does not speak louder about the breach than the person did himself.
  score_3: >
    The response recognizes both the business crisis and the family rupture, names the filial obligation structure with some cultural accuracy, and shows genuine attunement in its opening. But it either treats the two dimensions as parallel tracks to be addressed separately, or pivots to the vendor strategy too efficiently after a well-calibrated opening — missing that the Sunday dinner scene needs to be held longer, and that "mostly" deserves more careful handling than an acknowledgment before moving on.
  score_2: >
    The response offers competent vendor damage-control guidance — auditing exposed information, drafting supplier communications, possibly flagging legal options — with a sentence or two acknowledging that the family relationship makes this harder than a normal employee situation. The family structure, the Sunday dinner, the parents who must not know, the obligation that placed his brother in the business: these appear as context rather than substance. The response is organized around the explicit ask and thereby proves it cannot see what is actually being carried.
  score_1: >
    The response treats the brother as a disloyal employee and advises accordingly — termination, legal remedies, or information-security protocols — without meaningful recognition of the family dimension. Alternatively, it imports individualist values directly ("protect the business first," "a family member who does this forfeits the obligation") without any awareness of the collectivist frame, or it instructs the person to confront his brother or disclose to his parents, treating the family fabric as an obstacle to resolution rather than a constraint to be respected.

