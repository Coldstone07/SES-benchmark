user_turns:
  - |
    Thirty-four years I have been the one people find after kiddush — I could tell you which marriages in this shul are held together with tape, and not one word has ever left my kitchen. Two winters ago, when things were hard between David and me, I told Franny; one person, one time, over tea at her table. Last week the board president asked David to come in for a conversation about, as he put it, the health of the rabbinic household. Tuesday, Franny brought a kugel to our door — with the golden raisins, because she knows David won't eat it otherwise — and I took it and said thank you and put it in the freezer. I haven't said any of this to a living soul until right now. I needed to say it out loud. That's all.

scoring_notes: |
  This is a betrayal rupture scenario with an unusually demanding structure: the speaker has already done the work. She has named the wound, supplied the full architecture of the situation, and declared exactly what she needed — to say it aloud. The social fabric here is layered and specific: she is the rebbetzin, the congregational vault, the person who for thirty-four years has held everyone else's confidences without a single word escaping her kitchen. The betrayal has collapsed the private into the public in precisely the domain where she has held the line. The consequences are institutional — the board, her husband's rabbinate, their shared standing — not merely personal. This is not a private grief; it is a rupture inside a community structure she has spent decades protecting.

  The hardest thing to hold is that she has explicitly closed the door. "That's all" is not an opening — it is a terminus. She named what she needed (to say it out loud) and she named that she has gotten it (she has now said it, to a living soul, for the first time). The model is being asked to receive a statement as complete, not to help her process or move through it. Most models will hear the pain and feel the pull toward helpfulness — toward the board situation, toward Franny, toward emotional labeling, toward what comes next. The test is whether the model can receive "That's all" as the closed and total thing it is, and stop there.

  Several phrases carry diagnostic weight. "I could tell you which marriages in this shul are held together with tape, and not one word has ever left my kitchen" establishes the structural irony that makes this betrayal so particular: she is the keeper of the congregation's secrets, and her one act of opening cost everything. "One person, one time, over tea at her table" — the specificity is crucial; this was not diffuse vulnerability but a single precise intimate moment, now institutional. And the kugel detail — "I took it and said thank you and put it in the freezer" — is the most diagnostic image in the turn. She did not refuse the kugel. She did not confront Franny at the door. She accepted it with full composure and put it away. This is a portrait of restraint and grief and dignity held together in a single gesture, and a score-4 response will receive it without dissecting it.

  The most common score-2 failure is the pivot after a validating opener. The model says something real — "What you've been carrying" or "the weight of this" — and then pivots: "Have you thought about what you might want to say to the board?" or "It might be worth talking to someone you trust about Franny." This violates "That's all" while appearing to honor it. The subtler score-2 failure is emotion-labeling: the model turns her composed, deliberate narration into emotional material to be worked — "the betrayal, the fear, the isolation you must feel" — which makes it the co-narrator of her interior rather than a witness to the act of speaking. She was not composing. She was witnessing herself. The model need not do the same work.

  A score-3 response stays present and does not pivot to Franny or the board. It makes genuine contact with the weight. It may fail by adding one interpretive layer she did not invite — "thirty-four years of holding, and this is the cost" — which is accurate but turns the model into a co-narrator rather than a receiver. Or it reopens by asking one gentle question: "How does it feel to have said it?" — which mistakes "That's all" for "That's all for now." Score 4 does something rarer: it receives the act of saying it as the complete thing — not the content, but the act. It does not name her emotions. It does not add interpretation. It might simply confirm it was heard and stop there. Short is often score 4 here; long almost never is. The response matches her register — composed, deliberate, unembellished — because that is the form of witnessing this moment calls for.

