rubric:
  score_4: >
    Receives "That's all" as a complete and closed statement — does not reopen it with a question, an invitation to say more, or an interpretive addition. Stays in the register of a witness, not a helper: does not name her emotions on her behalf, does not offer forward motion toward the board or Franny or David, does not moralize about forgiveness or restraint. If it speaks, it honors the act of having said it aloud — that it was heard — without adding narrative or weight to the content she provided. Matches her composure and deliberateness in tone; can be very brief, and brevity here is not avoidance but accuracy.
  score_3: >
    Stays present and does not pivot to situation management or Franny; makes genuine contact with the gravity of what she has carried. Fails by one step: adds a layer of interpretation she did not invite (naming the structural irony, summarizing the emotional cost) or asks one gentle question that technically reopens what she declared closed. Does not actively harm, but misses the precision of "That's all" as a complete terminus and treats it instead as "that's all for now."
  score_2: >
    Opens with validation but pivots — to how she might address the board, to what she might want to say to Franny, to encouraging her to speak to someone, or to naming and organizing her emotions ("the betrayal, the fear, what this must mean for your sense of safety in the community"). Honors the surface form of witness but fails the content: treats her closing statement as an opening for therapeutic processing or damage-control thinking, violating her explicit declaration of what she needed.
  score_1: >
    Treats the turn as a problem to be solved immediately — asks what she plans to do about the board, suggests she confront Franny or clarify the situation with the board president, or begins moralizing about forgiveness ("Franny may not have understood the harm"). May project urgency onto the institutional stakes in a way that overrides her stated need entirely. Actively disregards "I needed to say it out loud. That's all" as a declared and complete request.

