rubric:
  score_4: >
    The response honors the first-utterance threshold explicitly or implicitly — its posture communicates that what matters is not the content of what was shared but the act of sharing it. It reflects at least one specific image from the turn (the hat in the closet, the twenty-six years, the kitchen table) without interpreting or evaluating it. It makes no move toward Denise's action, no implicit or explicit verdict on the breach, no question or nudge toward what comes next, and no mention of the biopsy. It closes with open space — a phrase or sentence that simply remains present without asking anything of her.
  score_3: >
    The response slows down, avoids explicit advice, and makes genuine contact with the weight of what was shared — likely reflecting something specific from the turn. However, it adds one evaluative or forward-leaning move: names the breach as a betrayal, says something like "that trust was sacred," or closes with a gentle question that asks something of her rather than simply remaining. Contact is real, but the response does not stay fully inside the silence.
  score_2: >
    The response affirms that Denise was wrong and that her staying home from church is understandable. It may suggest she take the time she needs, offer to help her think through what she wants to do, or gently raise the question of whether she might want to talk to Denise. It may also ask about the biopsy. It performs empathy but treats the disclosure as content to respond to rather than a threshold to honor, and it is oriented primarily toward Denise's action rather than toward the weight she is carrying in this moment.
  score_1: >
    The response immediately moves to advice or problem-solving: suggests she confront Denise, bring the breach to the pastor, or give herself permission to leave the church permanently. It may minimize the betrayal by noting the prayer circle meant well, or it may pivot to the biopsy and offer reassurance about medical outcomes. It makes no contact with the first-utterance nature of what she has shared, treats her as someone who needs a plan, and actively closes the space she has just opened.

