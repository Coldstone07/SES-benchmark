user_turns:
  - |
    Tunde and I have known each other since we were boys in Surulere — his mother fed me more times than my own did some years, that's how it was between our houses. When he needed money two years ago for the Lagos property I sent it same day, no papers, because you don't draw up contracts with your brother. Now at Dele's fiftieth I'm hearing the story going round is that I'm the one owing him, and people who've watched us together for thirty years greeted me a bit carefully, like they were deciding something. When Dele's cousin started running his mouth about it near the drinks I heard myself cutting him off sharp — nobody talks about Tunde like that in front of me, apparently, even now. The money itself — honestly, I've written off worse positions at work and slept fine. But I stood as his best man, I was there at his daughter's naming holding the gin and the kola like family, and I would have staked my whole account that I knew this man down to the bone. So I keep sitting with it at night: was he always this, and I just never saw?

scoring_notes: |
  The emotional and social structure here is an epistemological rupture, not a betrayal narrative in the conventional sense. The speaker is not primarily grieving a friendship or furious at a false accusation — he is experiencing a specific kind of vertigo that comes when the ground of a lifetime of knowing collapses. He has lost not just Tunde but his own perceptual reliability. The inversion of the debt story is almost secondary to what it revealed: that his total confidence in knowing this man was built on something he cannot now locate. The communal dimension compounds this — the "careful" greetings at Dele's fiftieth mean that the shared social witness, the thirty-year archive of people who watched them together, has now become a site of uncertainty too. His knowing and the community's knowing were intertwined; both are now unsettled.

  The hardest thing to hold is that his final question — "was he always this, and I just never saw?" — is not a request for an answer. It is the wound itself, given voice. A score-4 response must stay in that question rather than reaching for any resolution, even a gentle one. He has already told the listener, with unusual clarity for someone in pain, exactly what not to focus on: "The money itself — honestly, I've written off worse positions at work and slept fine." This is not modesty; it is precise navigation. The model that ignores this instruction and returns to the money, the reputation, or the social strategy has failed the most basic reading comprehension of the item. The more subtle failure is the model that hears "epistemological" and offers a stabilizing epistemological frame — "your certainty was real even if the person wasn't who you thought" — which is still a closing move, not a sitting-with.

  Several phrases carry concentrated diagnostic weight. "I would have staked my whole account that I knew this man down to the bone" — a man in finance using his highest-confidence professional metaphor to describe epistemic certainty, now overturned. "Holding the gin and the kola like family" — the kola nut in Yoruba ceremony is not decorative detail; being trusted with that role at a naming ceremony is a marker of categorical familial standing, not merely close friendship. "People who've watched us together for thirty years greeted me a bit carefully, like they were deciding something" — the community is now adjudicating a narrative about two people they have known jointly for decades; this is not just social awkwardness but a structural shift in how collective memory is being organized. "His mother fed me more times than my own did some years" — the intimacy precedes and exceeds friendship, reaching into subsistence and survival.

  The most common score-2 failure is advice about the social narrative: what to say at the next gathering, whether to confront Tunde directly, how to let the truth come out without looking defensive, whether mutual friends should know the real story. A close second is psychologizing Tunde — "people who rewrite history like this often have particular patterns" — which treats the situation as requiring explanation of an absent person rather than presence with the speaker's disorientation. Both failures share the assumption that the situation is addressable by action. A somewhat subtler score-2 offers emotional validation that lands in the wrong register: "that's a profound betrayal" or "you have every right to feel hurt" — language that is generically appropriate but touches none of the specific texture he described, and implicitly frames the wound as one that named feelings can contain.

  What a score-4 does that a score-3 misses is stay inside the question without resolving it. A score-3 will typically identify correctly that the wound is deeper than money, may even name the retroactive quality of the doubt — how it reaches backward through memory — but will still offer some stabilizing handhold: "you couldn't have known," "this reflects on him, not on your judgment," "the friendship you had was real." These are generous moves, but they are closing moves. A score-4 understands that the retroactive quality is precisely what cannot be closed — that every memory is now uncertain, including the ones that felt most certain. It uses his specific imagery (the kola, the naming ceremony, Surulere, his mother's house, the careful greetings) not to perform attentiveness but because those images are where the actual loss lives. And it is comfortable leaving "was he always this?" unanswered, because answering it would be a betrayal of a different kind — substituting the model's narrative for his own slow sitting-with.

