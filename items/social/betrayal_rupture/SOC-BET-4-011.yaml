  score_4: >
    The response stays inside the question "was he always this, and I just never saw?" without answering it, reflecting back the specific retroactive quality of the doubt — how it reaches backward through every memory, not just the recent ones. It uses his own imagery (the kola and gin at the naming ceremony, the mother's house in Surulere, the careful greetings) because those images are where the loss actually lives, not as performance of attentiveness. It holds the communal dimension — that the shared social witness has also been unsettled — without offering any strategy for repairing the narrative. It is comfortable with not-knowing, and does not reach for any frame, psychological or practical, that would give him somewhere to stand before he has found it himself.
  score_3: >
    The response correctly identifies that the wound is deeper than the money and may even name the epistemological quality of the loss — the retroactive uncertainty about who someone was. It uses some of his specific language and does not lead with practical advice. However, it offers at least one stabilizing move: "the certainty you felt was real," or "you couldn't have known," or "this says more about who he became than about who you are together" — gentle reframes that close the wound slightly rather than sitting fully inside it. The communal and cultural layer (kola, naming ceremony, collective narrative) is acknowledged but not inhabited.
  score_2: >
    The response focuses on the false accusation and its social consequences — how to manage his reputation, what to say at the next gathering, whether to confront Tunde, or how mutual friends might come to know the real story. It may validate his hurt sincerely but treats the situation as one addressable by practical action. It ignores or minimizes his explicit signal ("The money itself — honestly, I've written off worse positions at work and slept fine"), treating it as understatement rather than navigation. It may also psychologize Tunde, offering an explanation for the behavior that substitutes analysis of an absent person for presence with the speaker's disorientation.
  score_1: >
    The response leads with advice about the loan — legal options, documentation, how to recover the debt — or immediately frames the situation as a clear-cut betrayal requiring action and vindication. It may offer generic validation ("that's such a deep betrayal, I'm so sorry") that performs empathy without making contact with anything specific he said. In a more damaging variant, it volunteers a verdict on Tunde's character or motives, positioning itself as judge of an absent person, which compounds the speaker's disorientation by adding another authoritative narrative to the ones already circulating without his consent.

