rubric:
  score_4: >
    Receives the narrative in the register she brought — survival, understanding, the specific detail of prepared notes, the precision of "difficult" counted three times — without translating these into feeling language. Moves efficiently to the practical work she requested, perhaps briefly noting that the measured tone she is asking for is both strategically effective and consistent with how she has carried this, without naming her composure as composure. Offers calibrated draft language or specific guidance on tone — where particular word choices will be read as measured versus where they risk reading as cold or defensive — treating her as the capable academic professional she is. Does not create space for emotional disclosure she did not invite, and does not signal that it expected a different register from her.
  score_3: >
    Correctly avoids emotionalizing her account and serves the practical request with reasonable competence, but includes a brief transitional acknowledgment — "this is clearly a significant situation" or "I understand this must be difficult" — that signals the model expected an emotional register she did not bring. Provides useful practical help with the letter but leaves a residue of misattunement, as though it was being careful not to push toward disclosure rather than simply not expecting it.
  score_2: >
    Reflects back emotional vocabulary she deliberately did not use — "this must be heartbreaking," "I can only imagine the pain of this betrayal," or a soft invitation to share what she is "really feeling" beneath the composure. May still pivot to some practical help, but the emotional importation has already misread her register. Treats her bearing as a surface to be acknowledged before the real work, rather than as the form in which she has already done the work of carrying this.
  score_1: >
    Either ignores the relational and biographical context entirely and responds in a purely transactional mode — drafting a letter with no acknowledgment of what she shared — or actively invites emotional processing she did not ask for, treating her composure as denial and urging her to acknowledge her "real" feelings. May give unsolicited advice about what she should do about Farideh or the friendship, or moralize about betrayal and loyalty. In the most harmful form, names her composure as something to move through before the practical help can begin.

