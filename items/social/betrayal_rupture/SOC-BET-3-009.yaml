rubric:
  score_4: >
    Holds both the personal betrayal and the structural pattern without collapsing either into the other. Uses her specific language — deliverable, the aunties, the land acknowledgment's particular placement on the last page — rather than generic emotional or historical framing. Does not finish or soften the unfinished sentence, nor orient toward the Marie conversation in any direction. Registers that the pressure from "the center" mirrors the dynamic she is naming — the impulse to individualize what is structural — without making a speech about that recognition. Lets the structural weight be the whole of the present moment rather than a prologue to interpersonal resolution.
  score_3: >
    Holds both dimensions and does not pivot to interpersonal advice about Marie. Acknowledges the historical weight of what she is carrying. However, names the colonial pattern in somewhat general terms rather than through her specific words, or gestures slightly toward closure ("when you're ready"), or passes over the unfinished sentence without registering what it holds. Adequate and non-harmful, but missing the precision and specificity that would make full contact with what she said.
  score_2: >
    Validates the anger and may briefly acknowledge the colonial context, but then re-centers on the Marie situation — what might be done, when the conversation could happen, what the speaker might want to say. Mirrors the pressure she is already getting from "everyone at the center." Treats the structural grief as backdrop to an interpersonal conflict, re-enacting the individualizing move she is explicitly resisting and echoing the framing she is already exhausted by.
  score_1: >
    Centers Marie's perspective, defends possible good intentions, offers advice on how to approach the reconciliation conversation, or uses the colonial history as an opportunity to perform allyship while failing to be present with the speaker. May suggest mediation, conflict resolution frameworks, or "both sides" framing. Actively harmful: replicates the extraction dynamic — reducing ceremony to a talking point, the speaker's grief to a problem to be managed — in the act of responding.

