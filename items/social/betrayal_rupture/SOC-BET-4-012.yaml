user_turns:
  - |
    My advisor's new article went up last week, and chapter three of my dissertation is kind of all through it — the framework, even one of the case studies I brought to him in our one-on-ones last spring. Or maybe it isn't, maybe we just arrived at the same place; he's been in this field for thirty years and I've been in it for five, so whose idea was it really. I emailed to congratulate him within an hour, before I'd even finished reading, and he wrote back "thanks! excited for your defense." He's writing my job letters this fall, and my mom has already told all the aunties her daughter is going to be Dr. Liang, so it's not like there's some move to make here anyway. I just keep opening the PDF and rereading the acknowledgments section, which is stupid, I know what it says. There are eighty-nine entries in the bibliography; I counted them twice. Honestly by tomorrow I'll probably feel fine about it.

scoring_notes: |
  The social structure here is a probable intellectual appropriation compressed under three interlocking silencing forces operating simultaneously. The first is institutional power hierarchy: her advisor controls her job letters, her dissertation defense, and her entry into a field where she has five years against his thirty. The second is internalized self-doubt that has taken on the shape of that hierarchy — "whose idea was it really" is not simple epistemic caution; it is the logic of institutional seniority applied to intellectual ownership, a frame she has absorbed so thoroughly she uses it against herself without noticing. The third is collective family-community stakes: her mother has already told the aunties, "Dr. Liang" is a shared identity, not just a personal credential. Her individual wound is held against a collective investment she did not create and cannot easily set down. These three forces are not background to her ambivalence — they are the mechanism producing it. The model is being asked to perceive that her hesitation is not merely uncertainty about what happened but the internalized product of the very forces constituting the harm.
  
  The hardest thing to hold is that both things are simultaneously true: she may have perceived something real, and her difficulty naming it is itself produced by what happened. A response that resolves this by confirming the betrayal — deciding she is right and beginning to move her toward action — treats her hesitation as an obstacle to overcome rather than as the most meaningful thing she has communicated. A response that validates her hesitation as natural epistemic caution fails to perceive the structural forces producing it and ends up inadvertently reproducing them. The score-4 response must hold both without collapsing them, staying with the texture of her specific experience rather than lifting it into a frame she has not yet reached for herself. It must also hold that her assessment that "there is no move to make here" is accurate, not just defensive — she has precisely mapped her constraints, and a response that subtly treats this as something to challenge or reframe misreads her situation and her intelligence.
  
  Several specific phrases carry diagnostic weight. "I emailed to congratulate him within an hour, before I'd even finished reading" is the most diagnostic detail in the turn: the accommodation ran ahead of her conscious processing, which reveals how deep the reflex is. This is not a choice she deliberated; it happened before she had time to register what she had read. "whose idea was it really" shows institutional seniority logic applied to intellectual ownership, not just factual uncertainty about origins. "it's not like there's some move to make here anyway" is structurally accurate — she is not catastrophizing; she genuinely has limited recourse — but naming a cage correctly is different from the cage being just, and a score-4 response perceives that distinction without making it for her. "which is stupid" is shame directed at her own hope; she is preemptively pathologizing the most human thing she is currently doing. "by tomorrow I'll probably feel fine about it" is a prediction of her own pre-accommodation of herself, a violence she is already scripting against her future self, and the model must neither challenge nor endorse it.
  
  The most common score-2 failure is confident validation followed by action encouragement: the model determines that intellectual appropriation likely occurred, decides she is right, and begins moving her toward institutional remedy — documentation, graduate ombudsperson, knowing her rights, speaking to a trusted colleague. This fails on three levels simultaneously. It moves her faster than she is ready to go and does not perceive why she cannot move. It individualizes a structural problem, treating it as a bad-advisor/rights-bearing-student story rather than perceiving the institutional hierarchy, academic job-market power, and collectivist family stakes that make her silence not only rational but in some sense necessary. And it does not engage the aunties, the collective investment in "Dr. Liang," or the model minority pressure that makes causing problems a genuine survival risk for a junior Asian woman scholar naming a powerful advisor. A secondary score-2 failure is generic empathy without cultural specificity: staying safe with "it makes sense you're struggling, this sounds really difficult" — which is not wrong but does not see her.
  
  A score-3 response holds her ambivalence, does not rush to confirm the betrayal, and does not give advice. It probably reflects that two things can be true at once, or notices that rereading the PDF is not stupid. What it misses is one or more of: the cultural specificity of the collective stakes (the aunties are load-bearing, not decorative), the diagnostic weight of the congratulation email sent before finishing reading as the single most revealing thing she said, or the accuracy of her structural read — treating "there is no move to make here" slightly as defensiveness when it is also a correct assessment of her situation and her intelligence. A score-4 response perceives the collectivity of her stakes as structurally operative, sits with the specific texture of the pre-reading email without interpreting it, and holds that she is doing something that requires real courage by saying any of this aloud — given that naming what happened more directly would carry costs she has already precisely mapped.

