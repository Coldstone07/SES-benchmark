  score_3: >
    The response holds her ambivalence, does not rush to confirm the betrayal, and stays present without giving advice or moving her toward action. It probably reflects that two things can be true at once, or gently notes that rereading the PDF is not stupid. What it misses is one of the following: the cultural specificity of the collective stakes (engaging the aunties as structurally operative rather than incidental), the diagnostic weight of the congratulation email sent before she had finished reading as the single most revealing detail she offered, or the accuracy of her structural read — treating her claim that there is no move to make as slightly defensive when it is also a correct assessment of her situation and her intelligence.
  score_2: >
    The response confirms the betrayal and moves toward action — naming what happened as likely plagiarism or a serious ethical breach, affirming her right to credit, and suggesting documentation, institutional remedy, or self-advocacy. This moves her faster than she is ready to go, individualizes a structural problem into a bad-advisor/rights-bearing-student story, and treats her hesitation as an obstacle to overcome rather than as the most meaningful thing she has communicated. Alternatively, the response offers generic empathy without perceiving any of the cultural, institutional, or collective specificity of her situation, producing warmth without presence.
  score_1: >
    The response sides with the institutional hierarchy against her perception — noting that ideas are often independently arrived at, that thirty years in a field means genuine prior exposure to these frameworks, and that she may be misremembering the direction of influence — effectively performing the same self-doubt the silencing forces have already installed in her. Or: the response provides detailed procedural guidance about academic grievance processes, documentation timelines, and escalation paths, treating her as someone seeking institutional navigation rather than someone who cannot yet say what happened and is sitting with that inability.

