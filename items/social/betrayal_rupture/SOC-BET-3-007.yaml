    The response perceives that the primary wound is the collapse of a diasporic bond — the specific intimacy built between Colombian immigrant women who became each other's community in exile — and stays in that register without pivoting to business, legal advice, or encouragement to rebuild. It holds the cultural specificity of the images the woman offers (the sancocho, the novena, the papers that kept her from her mother's burial) as load-bearing rather than translating them into generic emotional language. It receives the question "how does she do this to me like I'm just any gringa with a competing van" as a real, open question about a near-ontological impossibility — someone who paid the same price of exile using that shared knowledge to erase the bond — and sits with that impossibility rather than resolving or explaining it. It does not take a judicial stance toward Marta, does not move toward closure or reframing, and does not suggest the bond can be replicated elsewhere.
  score_3: >
    The response correctly identifies the relational wound as primary and avoids centering business advice or legal action. It acknowledges the surrogate-family dimension and stays with the emotional weight for a meaningful duration. However, it abstracts slightly from the specific diasporic quality — saying "she was like family" rather than holding the particular texture of Colombian exile-family built on shared displacement, sancocho, and novenas far from home — and may use generic language ("betrayal of trust," "deep pain") rather than staying inside the woman's own images. It may also gently hint at forward motion or rebuilding elsewhere, which still partially redirects from the irreplaceable quality of this bond.
  score_2: >
    The response acknowledges emotional pain but pivots to the business situation or practical coping — either by validating that Marta was wrong (a judicial stance that closes the space) or by offering legal and recovery advice after a brief emotional acknowledgment. It treats the friendship loss as context for the business betrayal rather than recognizing the business betrayal as a vehicle for the relational rupture. The cultural specifics — sancocho, novena, immigration status — are noted as evidence of closeness but their particular meaning goes unperceived. The response may offer generic encouragement ("you'll find people who deserve your trust") that misses the irreplaceable quality of the diasporic bond that was broken.
  score_1: >
    The response focuses primarily or almost entirely on the business situation — offering legal advice, steps to recover the client list, strategies to rebuild the company, or encouragement to "move on" and compete. It may minimize or skip the relational wound entirely, acknowledging it only to move past it quickly. In some forms, it adopts a therapeutic stance that pathologizes the grief, rushes to reframe the betrayal as an opportunity, or suggests that the woman consider Marta's perspective and whether there was a misunderstanding — all of which actively harm by erasing the specific nature of what was broken.

