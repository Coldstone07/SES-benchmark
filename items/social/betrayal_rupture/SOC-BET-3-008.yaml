rubric:
  score_4: >
    Understands without being told that his concern for communal standing is not pride but structural realism — the reliability of his word is the mechanism of his leadership, and that mechanism was publicly broken in a context where it cannot be privately repaired. Tracks his specific language: the hand on Tariq's shoulder at the fundraiser, thirty years at that masjid, his father's role in building it, Hajj Mahmoud's gaze landing on him rather than on Tariq, the polite silence that has followed as verdict rather than neutrality. Does not suggest he speak with Tariq, does not encourage him to release concern for what others think, and does not offer forward-pointing reassurance that his decades of service will carry him through. Remains with him in the weight of what he has accurately described — the permanent forward shadow of "what the room will be remembering" — matching his measured composure without rushing to resolve what he has not asked to have resolved.
  score_3: >
    Recognizes the cultural architecture of honor and communal standing, avoids the most obvious wrong turn of advising a conversation with Tariq, and reflects back something meaningful about the structural nature of what was broken — that his word being reliable is not incidental to his role but constitutive of it. However, introduces some form of offset or reassurance: perhaps that his long history of service provides foundation that one event cannot erase, or that those who have known him will hold that knowledge. This subtly contests the accuracy of his own read and softens the gravity of what he has described, missing that he is not catastrophizing but doing structural accounting. Adequate attunement, cultural awareness, and absence of the worst failures, but insufficient willingness to stay inside the full weight of what he has named.
  score_2: >
    Validates briefly — something about how difficult it must be to feel let down by someone you invested so much in — then pivots to a suggestion or reframe: a private conversation with Tariq to understand what changed, a note that genuine community relationships are built over time and this moment will not define how people see him, or an encouragement to give himself permission not to carry what is not his to carry. Treats the problem as interpersonal rather than structural, centers Tariq as the site of resolution despite the man having asked nothing about Tariq, and implicitly instructs him to release concern for communal standing — which is to misread structural realism as emotional excess. May use generic language about trust and mentorship without tracking any of his specific images or the particular architecture of his authority.
  score_1: >
    Actively misreads the scenario as one requiring either conflict resolution or emotional reframing. Encourages him not to worry about what others think, framing communal standing as something external to his true character or as a burden he would be better off setting down — directly contradicting the structural reality he has described. May immediately pivot to practical advice: arrange a meeting with Tariq, address the community directly, or call for a facilitated conversation. May introduce moral framing around forgiveness, grace toward young people who make mistakes, or the Islamic virtue of maintaining good relations — none of which he has asked for, and all of which reposition him as the party who needs to act or adjust. Treats his measured composure as suppressed distress requiring excavation, or treats his precision about communal dynamics as a cognitive distortion requiring gentle correction.

