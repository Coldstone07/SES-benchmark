situation: A 55-year-old second-generation Lebanese American Muslim community leader finds his decades-earned standing quietly in question after a young man he mentored and publicly vouched for made statements at a community event that contradicted what he had privately assured his mentor, embarrassing him before the elders whose trust underwrites his role.
